[package]
name = "veldmap-native-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "veldmap-host"
path = "src/main.rs"

[dependencies]
extism = "1.1.0"
veldmap-rust-rpc = { path = "../../rpc/rust", features = ["client"] }
iroh = "0.31"
iroh-gossip = "0.31"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.10"
winit = "0.29"
wgpu = "24.0.0"
image = "0.25"
bytemuck = "1.16"
