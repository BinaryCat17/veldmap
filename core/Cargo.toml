[package]
name = "veldmap-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
anyhow = "1.0"
regex = "1.10"
once_cell = "1.19"
futures = "0.3"
tokio = { version = "1.37", features = ["full"] }
extism = "1.10"
iroh = "0.33"
iroh-gossip = "0.33"
veldmap-rust-rpc = { path = "../rpc/rust" }
prost = "0.13"
reqwest = { version = "0.12", features = ["stream"] }
