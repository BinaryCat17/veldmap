[package]
name = "veldmap-app-data-browser"
version = "0.1.0"
edition = "2021"

[dependencies]
veldmap-core = { path = "../../core" }
iced = { version = "0.13", features = ["image", "async-std", "tokio"] }
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
async-stream = "0.3"
futures = "0.3"
image = "0.25"
tiff = "0.9"
anyhow = "1.0"
path-clean = "1.0"
