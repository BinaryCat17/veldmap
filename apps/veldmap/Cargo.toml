[package]
name = "veldmap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "veldmap-native"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
thiserror.workspace = true
veldmap-core = { path = "../../crates/veldmap-core", version = "0.1.0" }
veldmap-render = { path = "../../crates/veldmap-render", version = "0.1.0" }
veldmap-storage = { path = "../../crates/veldmap-storage", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlCanvasElement", "Location", "Window"] }

[lints]
workspace = true
