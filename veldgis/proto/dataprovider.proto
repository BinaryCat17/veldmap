syntax = "proto3";

package veldmap.dataprovider;

import "common.proto";

// --- Search ---

message SearchFilter {
  string name = 1;
  string value = 2;
}

message DataProduct {
  string name = 1;
  string path = 2;
  string timestamp = 3;
  string grid_id = 4;
}

message SearchRequest {
  string query = 1;
  repeated SearchFilter filters = 2;
}

message SearchResponse {
  repeated DataProduct products = 1;
  string error = 2;
}

// --- List Path ---

message ListPathRequest {
  string path = 1;
  string token = 2;
}

message ListPathResponse {
  repeated string items = 1;
  string next_token = 2;
  string error = 3;
}

// --- Download ---

message DownloadRequest {
  string identifier = 1;
  string destination = 2;
}

// Download started event
message DownloadStarted {
  string task_id = 1;
  string identifier = 2;  // s3_key
  string destination = 3;
}

// Download progress event
message DownloadProgress {
  string task_id = 1;
  float progress = 2;  // 0.0 to 1.0
}

// Download completed event
message Downloaded {
  string task_id = 1;
  bool success = 2;
  string error = 3;
}
