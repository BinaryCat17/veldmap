package: veldmap-data-browser
language: rust
rust:
  sdk_path: ../../../../veldcore/sdk/rust
  dependencies:
    veld-ui: '{ path = "../../../../veldstd/ui-service/lib/rust" }'
    veldmap-api: '{ path = "../../../lib/rust/api" }'
    prost: '"0.14"'
    serde: '{ version = "1.0", features = ["derive"] }'
    serde_json: '"1.0"'
    once_cell: '"1.19"'
    anyhow: '"1.0"'
    log: '"0.4"'
    lazy_static: '"1.4"'
    tokio: '{ version = "1.49", features = ["sync", "macros"] }'
    async-stream: '"0.3"'
    image: '"0.25"'
    tiff: '"0.9"'
