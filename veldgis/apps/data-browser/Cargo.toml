[package]
name = "veldmap-app-data-browser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
veldsdk = { path = "../../../veldsdk/rust", features = ["iced"] }
veldmap-gis-api = { path = "../../lib/rust/gis-api" }
extism-pdk = "1.1.0"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
anyhow = "1.0"
log = "0.4"
lazy_static = "1.4"
tokio = { version = "1.0", features = ["sync", "macros"] }
async-stream = "0.3"
image = "0.25"
tiff = "0.9"
cosmic-text = "0.15"
tiny-skia = "0.11"
iced_core = "0.14.0"
iced_runtime = { version = "0.14.0", default-features = false }
iced_widget = { version = "0.14.0", default-features = false }
iced_graphics = { version = "0.14.0", default-features = false }
iced_renderer = { version = "0.14.0", default-features = false }
