[package]
name = "veldmap-app-desktop-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
veldsdk = { path = "../../../veldsdk/rust", features = ["iced"] }
veldmap-gis-api = { path = "../../lib/rust/gis-api" }
extism-pdk = "1.1.0"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
anyhow = "1.0"
log = "0.4"
