[package]
name = "veldmap-data-provider"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
veldsdk = { path = "../../../veldcore/sdk/rust" }
veldmap-gis-api = { path = "../../lib/rust/gis-api" }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
anyhow = "1.0"
quick-xml = "0.36"
urlencoding = "2.1"
rusty-s3 = "0.8.1"
http = "1.0"
aws-sigv4 = "1.2.2"
aws-credential-types = "1.2.0"
aws-smithy-runtime-api = { version = "1.1", features = ["client"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2.5"