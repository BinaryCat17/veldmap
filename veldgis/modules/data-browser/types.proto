syntax = "proto3";

package veldmap.data_browser;

// --- UI Events ---

message ButtonPressed {
    string id = 1;
}

message TextInputChanged {
    string widget_id = 1;
    string value = 2;
}

message ScrollEvent {
    float delta_x = 1;
    float delta_y = 2;
}

// --- Download ---

// User pressed download button
message DownloadPressed {
    string s3_key = 1;
    string filename = 2;
}

// --- Search ---

message SearchRequest {
    string query = 1;
    int32 filter = 2;  // 0=All, 1=Raster, 2=Vector
}

message SearchResponse {
    repeated DataProduct products = 1;
    string error = 2;
}

message DataProduct {
    string identifier = 1;
    string name = 2;
    string description = 3;
    string collection = 4;
    string date = 5;
    double cloud_cover = 6;
}

// --- Browse ---

message BrowseRequest {
    string path = 1;
    string token = 2;  // для пагинации
}

message BrowseResponse {
    repeated BrowseItem items = 1;
    string next_token = 2;
    string error = 3;
}

message BrowseItem {
    string path = 1;
    string name = 2;
    bool is_prefix = 3;  // true для папок
    int64 size = 4;
    string modified = 5;
}
