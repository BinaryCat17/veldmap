name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo build -p veldmap -p veldmap-core -p veldmap-render -p veldmap-storage --locked
      - run: cargo build -p veldmap -p veldmap-core -p veldmap-render -p veldmap-storage --target wasm32-unknown-unknown --locked
      - name: Record resolved rendering dependencies
        run: cargo tree --locked -e normal -p veldmap
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  smoke:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: Install native build and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev mesa-vulkan-drivers xauth xvfb
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Native window smoke
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python3 scripts/render_smoke.py native
      - name: Browser WebGPU smoke
        env:
          VELDMAP_BROWSER_GPU: swiftshader
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python3 scripts/render_smoke.py browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-smoke-${{ github.run_id }}
          path: |
            runtime/logs/*-smoke.log
            runtime/logs/*-smoke-result.json
            runtime/logs/*-smoke.ppm
            runtime/logs/*-smoke.png
            runtime/logs/browser-process.log
          if-no-files-found: error
