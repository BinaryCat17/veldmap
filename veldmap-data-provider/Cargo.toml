[package]
name = "veldmap-data-provider"
version = "0.1.0"
edition = "2021"

[dependencies]
veldmap-core = { path = "../veldmap-core" }
async-trait = "0.1"
anyhow = "1.0"
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
aws-config = "1.1"
aws-sdk-s3 = "1.14"
futures-util = "0.3"