[package]
name = "veldsdk"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
# Базовые системные зависимости
prost = "0.13"
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
extism-pdk = "1.1.0"
once_cell = "1.19"

# Опциональные тяжелые зависимости
iced_core = { version = "0.14.0", optional = true }
iced_widget = { version = "0.14.0", default-features = false, features = ["image"], optional = true }
iced_tiny_skia = { version = "0.14.0", default-features = false, features = ["image"], optional = true }
iced_runtime = { version = "0.14.0", default-features = false, optional = true }
iced_graphics = { version = "0.14.0", default-features = false, optional = true }
iced_renderer = { version = "0.14.0", default-features = false, features = ["tiny-skia"], optional = true }
tiny-skia = { version = "0.11", optional = true }

[build-dependencies]
prost-build = "0.13"

[features]
default = ["pdk"]
graphics = []
iced = [
    "graphics",
    "iced_core", 
    "iced_widget", 
    "iced_tiny_skia", 
    "iced_runtime", 
    "iced_graphics", 
    "iced_renderer", 
    "tiny-skia"
]
pdk = []
client = []