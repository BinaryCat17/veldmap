[package]
name = "veldsdk"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
# Базовые системные зависимости
prost = "0.13"
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# Опциональные зависимости для UI (без дефолтных фич)
iced_core = { version = "0.14.0", default-features = false, optional = true }
iced_widget = { version = "0.14.0", default-features = false, optional = true }
iced_runtime = { version = "0.14.0", default-features = false, optional = true }
iced_graphics = { version = "0.14.0", default-features = false, optional = true }
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }

[build-dependencies]
prost-build = "0.13"

[features]
default = ["pdk"]
wgpu = []
app = []
iced = [
    "wgpu",
    "app",
    "iced_core", 
    "iced_widget", 
    "iced_runtime", 
    "iced_graphics"
]
pdk = []
client = []

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
