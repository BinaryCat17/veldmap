[package]
name = "veldsdk"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
# Базовые системные зависимости
prost = "0.13"
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# Опциональные тяжелые зависимости
iced_core = { version = "0.14.0", optional = true }
iced_widget = { version = "0.14.0", default-features = false, features = ["image"], optional = true }
iced_tiny_skia = { version = "0.14.0", default-features = false, features = ["image"], optional = true }
iced_runtime = { version = "0.14.0", default-features = false, optional = true }
iced_graphics = { version = "0.14.0", default-features = false, optional = true }
iced_renderer = { version = "0.14.0", default-features = false, features = ["tiny-skia"], optional = true }
tiny-skia = { version = "0.11", optional = true }
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }

[build-dependencies]
prost-build = "0.13"

[features]
default = ["pdk"]
graphics = []
wgpu = ["graphics"]
app = ["graphics"]
iced = [
    "wgpu",
    "app",
    "iced_core", 
    "iced_widget", 
    "iced_tiny_skia", 
    "iced_runtime", 
    "iced_graphics", 
    "iced_renderer", 
    "tiny-skia"
]
pdk = []
client = []

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true