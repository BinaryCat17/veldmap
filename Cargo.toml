[workspace]
members = [
    "apps/veldmap",
    "crates/veldmap-core",
    "crates/veldmap-render",
    "crates/veldmap-storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
