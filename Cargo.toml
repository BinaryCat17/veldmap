[workspace]
members = ["crates/veldmap-proto", "crates/veldmap-rpc", "host/veldmap-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.104"
buffa = { version = "=0.9.2", default-features = false, features = ["std", "json"] }
buffa-codegen = "=0.9.2"
bytes = "=1.12.1"
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip"] }
connectrpc-build = "=0.9.0"
http = "=1.5.0"
http-body = "=1.0.1"
http-body-util = "=0.1.5"
hyper = "=1.12.0"
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "logging", "ring"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "sync"] }
tokio-stream = { version = "=0.1.19", default-features = false }
toml = "=1.1.8"
wasip3 = "=0.9.0"
wasmtime = { version = "=50.0.0", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "component-model-async", "component-model-bytes", "anyhow"] }
wasmtime-wasi = { version = "=50.0.0", default-features = false, features = ["p3"] }
wasmtime-wasi-http = { version = "=50.0.0", default-features = false, features = ["p3", "default-send-request"] }
webpki-roots = "=1.0.11"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
