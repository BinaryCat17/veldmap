[workspace]
members = ["crates/veldmap-proto"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
buffa = { version = "0.9.2", default-features = false, features = ["std", "json"] }
buffa-codegen = "0.9.2"
buffa-types = { version = "0.9.2", default-features = false, features = ["std", "json"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["json", "gzip"] }
connectrpc-build = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
