syntax = "proto3";

package veldmap.tile_cache;

import "core.proto";

// --- Tile Cache ---
// Дисковый кэш тайлов пирамид: ключ → тайлы уровня, RGBA8 sRGB текстурами.
//
// Ключ — отпечаток содержимого источника из Described производителя
// (image-tiler). Чтение по ключу безопасно по построению: соврав ключом,
// заказчик навредит только себе; записи же приходят только от производителя,
// который выводит ключ сам, — отравить кэш чужими тайлами неоткуда.

// Спросить названные тайлы одного уровня.
//
// Списком, а не прямоугольником: заказчик рисует именно эти ячейки, и второе
// описание того же желания расходилось бы с первым. У канвы прямоугольник и
// список совпадают, а вот у наложения видимые ячейки лежат на шаре полосой —
// прямоугольник вокруг неё вдвое шире, и разница целиком уходила бы в чтения
// файлов, декод и текстуры того, чего никто не увидит.
message QueryRequest {
  string fingerprint = 1;
  uint32 level = 2;
  repeated TileAddr tiles = 3;
  // Чем назвать запрос в логах.
  string label = 4;
}

// Промежуточный ответ: по одному на найденный тайл.
message TileResult {
  uint32 level = 1;
  uint32 x = 2;
  uint32 y = 3;
  veldmap.core.ResourceHandle texture = 4;  // RGBA8 sRGB; владение — заказчику
  // Фактические размеры: краевые тайлы короче стороны тайла.
  uint32 width = 5;
  uint32 height = 6;
}

message TileAddr {
  uint32 x = 1;
  uint32 y = 2;
}

message QueryDone {
  // Чего в кэше не оказалось — за этим к производителю (image-tiler).
  repeated TileAddr misses = 1;
  string error = 2;  // "" = успех; промахи ошибкой не являются
}

// Пополнение кэша производителем. Кодированный тайл ложится на диск как
// есть; формат кодека закреплён суффиксом ключа, а не полем, — смена кодека
// меняет ключ, и старые каталоги просто стареют до вытеснения.
message StoreTile {
  string fingerprint = 1;
  uint32 level = 2;
  uint32 x = 3;
  uint32 y = 4;
  uint32 width = 5;
  uint32 height = 6;
  bytes qoi = 7;
}
