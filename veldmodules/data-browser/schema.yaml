name: data-browser
version: 0.1.0

# UI разметку этого модуля рендерит ui-service (Elm-цикл: view после каждого сообщения)
view: ui-service

interface:
  inputs:
    nav_browse:
      type: ui/UiEventResponse
    nav_search:
      type: ui/UiEventResponse
    nav_downloaded:
      type: ui/UiEventResponse
    browse:
      type: ui/UiEventResponse
    browse_up:
      type: ui/UiEventResponse
    search:
      type: ui/UiEventResponse
    search_input:
      type: ui/UiEventResponse
    download_pressed:
      type: ui/UiEventResponse
    view_pressed:
      type: ui/UiEventResponse

dependencies:
  # Платформенный контракт: хост просит владельца окна выделить поверхность.
  app:
    subs:
      window_resized:
        type: app/WindowResized
  ui-service: {}
  data-provider:
    subs:
      download_started:
        type: dataprovider/DownloadStarted
      download_progress:
        type: dataprovider/DownloadProgress
      downloaded:
        type: dataprovider/Downloaded
      search_result:
        type: dataprovider/SearchResponse
      list_path_result:
        type: dataprovider/ListPathResponse
    calls:
      list_path:
        type: dataprovider/ListPathRequest
      download:
        type: dataprovider/DownloadRequest
      cancel_download:
        type: dataprovider/CancelDownloadRequest
      search:
        type: dataprovider/SearchRequest
  fs:
    subs:
      list_result:
        type: core/FsListResponse
    calls:
      list:
        type: core/FsListRequest
  image:
    subs:
      load_result:
        type: core/ImageLoadResult
    calls:
      load:
        type: core/ImageLoadRequest
