name: data-browser
version: 0.1.0

# UI разметку этого модуля рендерит ui-service. hook_event пересобирает
# view и шлёт её рендереру после каждого события (см. module.rs::hook_event).
hooks: [hook_event]

dependencies:
  # Платформенный контракт: хост просит владельца окна выделить поверхность
  # (адресовано, target = имя владельца, поэтому не приходит другим модулям),
  # владелец в ответ аттачит выделенную текстуру обратно хосту.
  app:
    subs: [on_window_resized]
    calls: [on_set_surface]
  # Виджет-события собственного UI: один топик на все методы, конкретная
  # кнопка/поле — в UiEventResponse.method (см. handlers::ui_methods в
  # module.rs). Адресовано ui-service'ом через target — другие модули с UI
  # этот топик тоже слушают, но чужие события не получают.
  ui-service:
    subs: [on_ui_event]
  data-provider:
    subs: [on_download_started, on_download_progress, on_downloaded, on_search_result, on_list_path_result]
    calls: [on_list_path, on_download, on_cancel_download, on_search]
  fs:
    subs: [on_list_result, on_delete_result, on_write_result, on_read_result]
    calls: [on_list, on_delete, on_write, on_read]
  # Превью картинок: image-loader грузит файл в GPU-текстуру и передаёт нам
  # владение; ответ различим по correlation_id (broadcast-конвенция шины).
  image-loader:
    subs: [on_load_result]
    calls: [on_load]
