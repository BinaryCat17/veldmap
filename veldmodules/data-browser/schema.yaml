name: data-browser
version: 0.1.0

# UI разметку этого модуля рендерит ui-service. hook_event пересобирает
# view и шлёт её рендереру после каждого события (см. module.rs::hook_event).
hooks: [hook_event]

interface:
  inputs:
    on_nav_browse:
      type: ui_service/UiEventResponse
    on_nav_search:
      type: ui_service/UiEventResponse
    on_nav_downloaded:
      type: ui_service/UiEventResponse
    on_browse:
      type: ui_service/UiEventResponse
    on_browse_up:
      type: ui_service/UiEventResponse
    on_search:
      type: ui_service/UiEventResponse
    on_search_input:
      type: ui_service/UiEventResponse
    on_download_pressed:
      type: ui_service/UiEventResponse
    on_view_pressed:
      type: ui_service/UiEventResponse

dependencies:
  # Платформенный контракт: хост просит владельца окна выделить поверхность.
  app:
    subs:
      on_window_resized:
        type: app/WindowResized
  ui-service: {}
  data-provider:
    subs:
      on_download_started:
        type: data_provider/DownloadStarted
      on_download_progress:
        type: data_provider/DownloadProgress
      on_downloaded:
        type: data_provider/Downloaded
      on_search_result:
        type: data_provider/SearchResponse
      on_list_path_result:
        type: data_provider/ListPathResponse
    calls:
      on_list_path:
        type: data_provider/ListPathRequest
      on_download:
        type: data_provider/DownloadRequest
      on_cancel_download:
        type: data_provider/CancelDownloadRequest
      on_search:
        type: data_provider/SearchRequest
  fs:
    subs:
      on_list_result:
        type: fs/FsListResult
    calls:
      on_list:
        type: fs/FsListRequest
