name: data-browser
version: 0.1.0

# UI разметку этого модуля рендерит ui-service. hook_event пересобирает
# view и шлёт её рендереру после каждого события (см. module.rs::hook_event).
hooks: [hook_event]

dependencies:
  # Платформенный контракт: хост просит владельца окна выделить поверхность
  # (адресовано, target = имя владельца, поэтому не приходит другим модулям),
  # владелец в ответ аттачит выделенную текстуру обратно хосту.
  app:
    subs: [on_window_resized]
    calls: [on_set_surface]
  # Виджет-события собственного UI: один топик на все методы, конкретная
  # кнопка/поле — в UiEventResponse.method (см. handlers::ui_methods в
  # module.rs). Адресовано ui-service'ом через target — другие модули с UI
  # этот топик тоже слушают, но чужие события не получают.
  ui-service:
    subs: [on_ui_event]
    # Мы шлём рендереру свою разметку (on_set_view) и делегируем ему текстуру
    # окна (on_set_surface). Оба вызова уходят через хелперы его wrap-крейта
    # (render::render, surface::delegate), но публикуют — наши стабы отсюда:
    # wrap общий для всех потребителей и не вправе публиковать за нас.
    calls: [on_set_view, on_set_surface]
  # Каталог провайдера: поиск и обход. Скачанное — не здесь, а в data-library:
  # провайдер знает свои продукты, но не то, что из них у нас на диске.
  # on_open — просмотр ещё не скачанного: подписать запрос к хранилищу умеет
  # только провайдер.
  data-provider:
    subs: [on_search_result, on_list_path_result, on_open_result]
    calls: [on_list_path, on_search, on_open]
  # Библиотека скачанного. Диска мы не касаемся вовсе: ни путей, ни суффиксов,
  # ни сидкаров — приходит уже выведенное состояние записей.
  data-library:
    subs: [on_state, on_open_result]
    calls: [on_list, on_download, on_cancel, on_delete, on_open]
  # Превью картинок: ресурс открывает библиотека или провайдер, мы отдаём его
  # загрузчику, он возвращает GPU-текстуру и передаёт нам владение; ответ
  # различим по correlation_id (broadcast-конвенция шины).
  image-loader:
    subs: [on_load_result]
    calls: [on_load]
  # Убийство декодирования, когда пользователь ушёл с превью. Заводить и
  # закрывать операцию не нужно: платформа учла её с самой публикации
  # image-loader/on_load (топик объявлен `cancellable: true`) и снимет с учёта
  # его терминальным ответом. Владелец операции — паблишер запроса, то есть мы.
  tasks:
    calls: [on_cancel]
