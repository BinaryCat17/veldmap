name: data-browser
version: 0.1.0

# UI разметку этого модуля рендерит ui-service. hook_event пересобирает
# view и шлёт её рендереру после каждого события (см. module.rs::hook_event).
hooks: [hook_event]

interface:
  inputs:
    on_nav_browse:
      type: ui/UiEventResponse
    on_nav_search:
      type: ui/UiEventResponse
    on_nav_downloaded:
      type: ui/UiEventResponse
    on_browse:
      type: ui/UiEventResponse
    on_browse_up:
      type: ui/UiEventResponse
    on_search:
      type: ui/UiEventResponse
    on_search_input:
      type: ui/UiEventResponse
    on_download_pressed:
      type: ui/UiEventResponse
    on_view_pressed:
      type: ui/UiEventResponse

dependencies:
  # Платформенный контракт: хост просит владельца окна выделить поверхность.
  app:
    subs:
      on_window_resized:
        type: app/WindowResized
  ui-service: {}
  data-provider:
    subs:
      on_download_started:
        type: dataprovider/DownloadStarted
      on_download_progress:
        type: dataprovider/DownloadProgress
      on_downloaded:
        type: dataprovider/Downloaded
      on_search_result:
        type: dataprovider/SearchResponse
      on_list_path_result:
        type: dataprovider/ListPathResponse
    calls:
      on_list_path:
        type: dataprovider/ListPathRequest
      on_download:
        type: dataprovider/DownloadRequest
      on_cancel_download:
        type: dataprovider/CancelDownloadRequest
      on_search:
        type: dataprovider/SearchRequest
  fs:
    subs:
      on_list_result:
        type: fs/FsListResult
    calls:
      on_list:
        type: fs/FsListRequest
