name: data-browser
version: 0.1.0

# UI разметку этого модуля рендерит ui-service. hook_event пересобирает
# view и шлёт её рендереру после каждого события (см. module.rs::hook_event).
hooks: [hook_event]

dependencies:
  # Платформенный контракт: хост просит владельца окна выделить поверхность
  # (адресовано, target = имя владельца, поэтому не приходит другим модулям),
  # владелец в ответ аттачит выделенную текстуру обратно хосту.
  app:
    subs: [on_window_resized]
    calls: [on_set_surface]
  # Виджет-события собственного UI: один топик на все методы, конкретная
  # кнопка/поле — в UiEventResponse.method (см. handlers::ui_methods в
  # module.rs). Адресовано ui-service'ом через target — другие модули с UI
  # этот топик тоже слушают, но чужие события не получают.
  ui-service:
    subs: [on_ui_event]
    # Мы шлём рендереру свою разметку (on_set_view) и делегируем ему текстуру
    # окна (on_set_surface). Оба вызова уходят через хелперы его wrap-крейта
    # (render::render, surface::delegate), но публикуют — наши стабы отсюда:
    # wrap общий для всех потребителей и не вправе публиковать за нас.
    calls: [on_set_view, on_set_surface]
  # Каталог провайдера: поиск и обход. Скачанное — не здесь, а в data-library:
  # провайдер знает свои продукты, но не то, что из них у нас на диске.
  # on_open — просмотр ещё не скачанного: подписать запрос к хранилищу умеет
  # только провайдер. on_imagery — растры продукта для наложения на шар:
  # раскладку .SAFE и рамку тайла знает тоже только он. on_locate — продукт
  # по ключу хранилища: «показать на шаре» из каталога и загрузок, где под
  # рукой один ключ, а продукт с футпринтом надо ещё найти.
  data-provider:
    subs: [on_search_result, on_list_path_result, on_open_result, on_imagery_result, on_locate_result]
    calls: [on_list_path, on_search, on_open, on_imagery, on_locate]
  # Библиотека скачанного. Диска мы не касаемся вовсе: ни путей, ни суффиксов,
  # ни сидкаров — приходит уже выведенное состояние записей.
  data-library:
    subs: [on_state, on_open_result]
    calls: [on_list, on_download, on_pause, on_delete, on_open]
  # Канва просмотра снимка. Ресурс открывает библиотека или провайдер, а
  # владение уходит канве вместе с on_show: тайлы, камеру и кадр она ведёт
  # сама. Ей же делегируется место вкладки (on_canvas — тот же обряд, что у
  # глобуса, плюс имя вида: канв много) и намерения камеры; обратно приходит
  # рассылка состояния показа.
  image-view:
    subs: [on_view_state]
    calls: [on_canvas, on_show, on_close, on_camera]
  # Трёхмерный вид. Почти всё исходящее: место под рендер (on_set_surface, тем
  # же обрядом, что и поверхность окна), движение камеры (on_camera), то, что
  # очертить на поверхности (on_outlines), и то, что на неё наложить
  # (on_overlay — ресурсы растров уходят во владение глобуса); результат его
  # работы мы видим в текстуре, которую сами же ему и отдали. Обратно приходит
  # ровно один ответ — на вопрос, куда пришёлся щелчок: перевести точку кадра
  # в место на Земле может только тот, у кого камера.
  globe:
    subs: [on_probed]
    calls: [on_set_surface, on_camera, on_outlines, on_overlay, on_probe]
