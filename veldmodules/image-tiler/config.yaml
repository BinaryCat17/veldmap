package: veldmap-image-tiler
language: rust
rust:
  dependencies:
    prost: "0.14"
    serde:
      version: "1.0"
      features: ["derive"]
    serde_json: "1.0"
    anyhow: "1.0"
    log: "0.4"
    # Потоковые декодеры: пирамида строится по строкам/чанкам, память не
    # зависит от высоты файла (см. src/cascade.rs).
    png: "0.18"
    # Фича zstd — компрессия measurement-COG Sentinel-1 (GRD). Она тянет
    # C-шный zstd-sys: в wasm он собирается штатно (wasm-shim в составе
    # крейта), но компилятором обязан быть clang с бэкендом wasm32 — его
    # находит build.py::wasm_cc_env.
    tiff:
      version: "0.11"
      features: ["zstd"]
    # default-features = false: по умолчанию тянется rayon, а потоков в wasm нет.
    jpeg-decoder:
      version: "0.3"
      default-features: false
    # Только форматы без потокового пути — они мелкие по своей природе.
    image:
      version: "0.25"
      default-features: false
      features: ["gif", "bmp", "webp"]
    # Кодек тайлов кэша: чистый Rust, миллисекунды на тайл и в wasm.
    qoi: "0.4"
    # JPEG 2000 (квиклуки и гранулы Sentinel-2): порт OpenJPEG на Rust,
    # декодирует один тайл кодстрима на факторе разрешения — чанк драйвера
    # сетки (docs/decisions/0002-jpeg2000-decoder.md). Без `file-io`: файлов у
    # wasm-модуля нет, поток строится поверх ресурса.
    openjp2:
      version: "0.6"
      default-features: false
      features: ["std"]
    # NetCDF-4 (Sentinel-5P, климатика): это HDF5. Чистый Rust без libhdf5:
    # C-библиотека потребовала бы clang с бэкендом wasm32 и своей сборки под
    # каждую цель. Из фич — только чтение и deflate: пишущая половина и палитра
    # фильтров тут не нужны.
    #
    # Вход `File::from_source` и трейт `Source` — то, чем живёт всё чтение по
    # требованию: пути у wasm-модуля нет вовсе (инстанс собирается без единого
    # preopen), и всякий байт приходит к нему ресурсом. Без них файл пришлось
    # бы поднимать в память целиком.
    # Регион по всем осям (`read_*_region`) в релизе upstream ещё не вышел
    # (PR #466): зависимость — коммит этого PR в форке. Им величина читается
    # окном по оси строк плоскости, а не по нулевой оси файла.
    hdf5-pure:
      git: "https://github.com/BinaryCat17/hdf5-pure.git"
      rev: "fa5dfc64521dfe1d554b9f1cffee836c873718ff"
      default-features: false
      features: ["std", "checksum", "deflate"]
