package: veldmap-image-tiler
language: rust
rust:
  dependencies:
    prost: "0.14"
    serde:
      version: "1.0"
      features: ["derive"]
    serde_json: "1.0"
    anyhow: "1.0"
    log: "0.4"
    # Потоковые декодеры: пирамида строится по строкам/чанкам, память не
    # зависит от высоты файла (см. src/cascade.rs).
    png: "0.18"
    tiff: "0.11"
    # default-features = false: по умолчанию тянется rayon, а потоков в wasm нет.
    jpeg-decoder:
      version: "0.3"
      default-features: false
    # Только форматы без потокового пути — они мелкие по своей природе.
    image:
      version: "0.25"
      default-features: false
      features: ["gif", "bmp", "webp"]
    # Кодек тайлов кэша: чистый Rust, миллисекунды на тайл и в wasm.
    qoi: "0.4"
    # JPEG 2000 (квиклуки и гранулы Sentinel-2): чистый Rust, декод сразу в
    # масштаб уровня. Без фичи `image` — её конвертеры и moxcms не нужны.
    hayro-jpeg2000:
      version: "0.4"
      default-features: false
      features: ["std", "simd"]
