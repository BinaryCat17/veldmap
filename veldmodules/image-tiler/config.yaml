package: veldmap-image-tiler
language: rust
rust:
  dependencies:
    prost: "0.14"
    serde:
      version: "1.0"
      features: ["derive"]
    serde_json: "1.0"
    anyhow: "1.0"
    log: "0.4"
    # Потоковые декодеры: пирамида строится по строкам/чанкам, память не
    # зависит от высоты файла (см. src/cascade.rs).
    png: "0.18"
    # Фича zstd — компрессия measurement-COG Sentinel-1 (GRD). Она тянет
    # C-шный zstd-sys: в wasm он собирается штатно (wasm-shim в составе
    # крейта), но компилятором обязан быть clang с бэкендом wasm32 — его
    # находит build.py::wasm_cc_env.
    tiff:
      version: "0.11"
      features: ["zstd"]
    # default-features = false: по умолчанию тянется rayon, а потоков в wasm нет.
    jpeg-decoder:
      version: "0.3"
      default-features: false
    # Только форматы без потокового пути — они мелкие по своей природе.
    image:
      version: "0.25"
      default-features: false
      features: ["gif", "bmp", "webp"]
    # Кодек тайлов кэша: чистый Rust, миллисекунды на тайл и в wasm.
    qoi: "0.4"
    # JPEG 2000 (квиклуки и гранулы Sentinel-2): чистый Rust, декод сразу в
    # масштаб уровня. Без фичи `image` — её конвертеры и moxcms не нужны.
    hayro-jpeg2000:
      version: "0.4"
      default-features: false
      features: ["std", "simd"]
    # NetCDF-4 (Sentinel-5P, климатика): это HDF5. Чистый Rust без libhdf5:
    # C-библиотека потребовала бы clang с бэкендом wasm32 и своей сборки под
    # каждую цель. Из фич — только чтение и deflate: пишущая половина и палитра
    # фильтров тут не нужны.
    #
    # Своя ветка, а не выпуск с crates.io, и ровно на одну возможность: ридер
    # крейта умеет читать по требованию, но наружу выносит только вход по пути
    # в файловой системе, а пути у wasm-модуля нет вовсе — инстанс собирается
    # без единого preopen, и всякий байт приходит к нему ресурсом. Ветка
    # открывает трейт `Source` и вход `File::from_source`; без неё файл
    # пришлось бы поднимать в память целиком, то есть смотреть только то, что
    # меньше гигабайта.
    #
    # Ветка временна по замыслу: правка отправлена автору (его issue #27), и
    # когда она выйдет выпуском — здесь снова останется номер версии.
    hdf5-pure:
      git: "https://github.com/BinaryCat17/hdf5-pure"
      branch: "source-entry"
      default-features: false
      features: ["std", "checksum", "deflate"]
