syntax = "proto3";

package veldmap.image_tiler;

import "core.proto";

// --- Image Tiler ---
// Ресурс с растром → тайлы пирамиды: RGBA8 в sRGB, сторона тайла ≤ Described.tile.
//
// Уровень n — источник, ужатый в 2ⁿ раз последовательным усреднением пополам;
// вершина пирамиды помещается в один тайл. Арифметика уровней и сеток — в
// pyramid.rs wrap-крейта, общая с потребителями: посчитанная порознь, она
// сходилась бы, только пока кто-то держит две копии одинаковыми.
//
// Откуда байты — не его дело: заказчик открывает ресурс сам и даёт read-грант.
// Всё произведённое попутно уезжает в tile-cache, поэтому повторный запрос
// обслуживается кэшем, а сюда приходят только промахи.

message DescribeRequest {
  veldmap.core.ResourceHandle resource = 1;  // байты растра
  // Чем назвать источник в логах: у ресурса имени нет, его знает заказчик.
  string label = 2;
  // Байты файла с координатами пикселей растра — там, где они лежат не в нём
  // самом (Sentinel-3: полоса в одном `.nc`, широта с долготой в соседнем).
  // Спрашивается он только когда в самом растре опорных точек не нашлось, и
  // молчание его — не отказ: снимок тогда ложится тем, что сказал каталог.
  optional veldmap.core.ResourceHandle geolocation = 3;
  // Источник читается быстро: он лежит на диске, а не за проводом.
  //
  // Это про цену чтения, а не про природу ресурса: чем он является, тайлеру
  // по-прежнему не видно и не нужно (см. заголовок схемы). Нужно ему другое —
  // у формата, который читается только целиком (NetCDF), «слишком велик»
  // значит разное по разные стороны провода: по сети это минуты ожидания
  // впустую, а с диска те же байты приходят мгновенно, и упирается такое
  // чтение уже в память. Знать, за какой из двух мерок мерить, может только
  // тот, кто ресурс открывал.
  bool near = 4;
}

message Described {
  // Идентичность содержимого — ключ тайлового кэша. Выводится из самих байтов
  // (длина, голова, хвост), поэтому одинакова у файла на диске и удалённого
  // объекта с теми же байтами, а договора об идентичности между модулями нет.
  string fingerprint = 1;
  uint32 width = 2;   // родное разрешение источника
  uint32 height = 3;
  // Сторона тайла — константа тайлера. Потребителю на Rust она известна и без
  // сообщения: арифметику ячеек он считает тем же `pyramid.rs` через
  // `#[path]`. Здесь она для того, кто этот файл не разделяет.
  uint32 tile = 4;
  // Уровней в пирамиде: 0 — родное разрешение, вершина ≤ одного тайла.
  uint32 levels = 5;
  // Во что обходится лишняя ступень пирамиды у этого источника.
  Reach reach = 6;
  // Предел детали: подробнее этого уровня источник не отдаст ни при какой
  // попытке. Обычно 0 — родное разрешение; больше нуля у того, чей декодер
  // читает кадр целиком и не умещает подробные уровни в память: первая строка
  // таблицы уровней тайлера, которая влезает (так у JPEG 2000 и у крупного JPEG).
  //
  // Фактом в описании, а не отказом на запрос, потому что это свойство
  // источника, а не попытки: узнанный отказом, он переучивался бы на каждом
  // сдвиге камеры — у новых ячеек того же уровня отметки нет, — и стоил бы
  // ошибки в интерфейсе там, где сказать надо всего лишь «резче не будет».
  uint32 finest = 9;
  // Сетка геопривязки из самого файла; пусто — в файле её нет. Тайлер её не
  // толкует и ничего о Земле не знает: он читает то, что записано в растре, —
  // а сказать, где лежит снимок, больше некому. Каталог отвечает на другой
  // вопрос: его контур говорит, какой кусок Земли снят, но не тем, каким
  // пикселем куда, — и порядок вершин у него свой.
  repeated GeoTie ties = 8;
  // Привязка к проекции — для растра, лежащего не в градусах. Взаимоисключима
  // с `ties`: узлы объявлены в градусах, и записать в них метры зоны значило
  // бы соврать полем, а не промолчать. Приходит одно из двух либо ничего.
  optional Placement placement = 10;
  // Сколько уровней от нулевого читаются ТОЧЕЧНО — ровно заказанными кусками,
  // а не проходом по файлу. Ноль — ни одного.
  //
  // Числом, а не признаком, потому что у одного источника бывает и так и эдак:
  // полосный TIFF отдаёт подробный уровень окном в несколько полос, а грубому
  // нужна каждая строка файла, и он идёт проходом (см. `REACH_WINDOWED`). Один
  // ответ на весь источник заставлял бы половину его поведения объяснять
  // неправдой.
  //
  // От этого зависят три разных ответа у потребителя, и все три — про то, что
  // проход отдаёт: годны ли его байты как мерка хода (у точечного чтения
  // счётчик прочитанного — водяной знак головы, а не объём); стои́т ли
  // откладывать промахи до его конца (точечный кладёт в кэш только заказанное,
  // проход — всю пирамиду); и можно ли снять проход, ушедший из поля зрения
  // (у прохода уехавшее место тоже добудется, у точечного — нет).
  uint32 windowed = 11;
  string error = 7;  // "" = успех
  // Растр описан, а привязку из него взять не удалось — и вот почему.
  //
  // Отдельно от `error` по тому же правилу, по какому разведены `error` и
  // `trouble` у канвы и у наложения: «смотреть не на что» заменяет собой показ,
  // а это — подпись рядом с тем, что уже видно. Снимок ляжет по контуру
  // каталога, то есть, скорее всего, повёрнутым, и выглядеть будет настоящим.
  //
  // Названо по предмету — по привязке, — а не общей оговоркой, потому что род
  // высказывания здесь один: «места нет, и вот отчего». Оговорка другого рода
  // (растяг широких отсчётов, выбранная полоса стопки) говорит о другом
  // предмете и заведёт своё поле: сведённые в одно, они заставили бы каждого
  // потребителя разбирать, про что ему сейчас сказали. Отсюда же и то, что
  // канва просмотра этого поля не читает — не по правилу, а потому, что о месте
  // на Земле она ничего не показывает.
  //
  // Чужой датум сюда не входит: у него привязка как раз взялась, и снимок лежит
  // на своём месте с точностью до сотни метров. Такому место в логе.
  //
  // Пусто — привязка взялась либо файл о ней не заговаривал: различать эти два
  // незачем, сказать нечего в обоих.
  string binding_trouble = 12;
}

// Что один проход по источнику закрывает — то есть во сколько обходится
// потребителю лишняя ступень пирамиды.
//
// Спрашивают об этом затем, что пирамида набирается сверху вниз: показать
// грубое сразу лучше, чем не показывать ничего. Но там, где ступень стоит
// целого чтения файла, лестница умножает эту цену на число ступеней, и
// промежуточные ступени надо пропускать.
enum Reach {
  // Проход строит всю пирамиду разом: первая же ступень оплачивает
  // остальные, дальше они попадания в кэш. PNG, мелочь.
  REACH_PYRAMID = 0;
  // Читается ровно запрошенное: ступень стоит своих тайлов и не больше.
  // Тайловый TIFF с обзорами (COG).
  REACH_EXACT = 1;
  // Проход строит запрошенный уровень и грубее, а за подробным приходят
  // заново — то есть каждая ступень стоит ещё одного чтения файла целиком.
  // JPEG, JPEG 2000.
  REACH_COARSER = 2;
  // Читается окном по строкам: подробный уровень — точечно, грубый — целым
  // проходом. Так устроен полосный TIFF без внутренних тайлов (Sentinel-1 GRD,
  // полтора-два гигабайта): полосы адресуются поштучно не хуже тайлов, и тайл
  // подробного уровня — это 512 строк на всю ширину, десятки мегабайт вместо
  // всего файла. А вот тайл грубого уровня — это КАЖДАЯ строка, прореженная:
  // полосы не пропустишь, потому что нужная строка есть в каждой. Отсюда и
  // окно: чем подробнее уровень, тем меньше читается.
  //
  // Промежуточных ступеней у такого источника не бывает — грубая ступень
  // стоила бы целого файла, то есть дороже самой цели. Грубый край закрывает
  // не лестница, а соседний растр (у Sentinel-1 это квиклук) либо тот самый
  // проход, когда соседа нет.
  REACH_WINDOWED = 3;
}

// Узел сетки геопривязки: пиксель растра и его место на Земле (WGS84,
// градусы). Узлов бывает четыре (ровный прямоугольник в градусах) и бывает
// решётка: 21×21 у гранулы Sentinel-1, гуще у витковой NetCDF, где узлы
// ставятся по длине стороны. Между узлами потребитель интерполирует сам.
message GeoTie {
  double px = 1;
  double py = 2;
  double lat = 3;
  double lon = 4;
}

// Привязка растра, лежащего в проекции: код системы координат и линейное
// преобразование пикселя в её метры.
//
// Кодом, а не разобранной зоной: код — то, что записано в файле, а «зона 38
// северная» — уже толкование, и толкует его тот, кто знает Землю. Тайлеру
// иначе пришлось бы завести вторую копию проекционной математики — ту самую,
// которая сошлась бы с первой на глаз и разошлась на числах.
//
// Шестёрка чисел, а не пара «начало и шаг»: она покрывает обе привязки
// GeoTIFF — и точку с шагом пикселя, и матрицу, — то есть повёрнутый растр
// тоже, и покрывает одинаковым кодом у потребителя.
message Placement {
  // Код EPSG проекционной системы (ProjectedCSTypeGeoKey). Нуля здесь не
  // бывает: «в файле не сказано» и «сказано непонятное» — это отсутствие
  // всего сообщения, иначе их нечем различить в логе.
  uint32 epsg = 1;
  // Пиксель растра → метры системы:
  //   x = x_per_i·i + x_per_j·j + x0
  //   y = y_per_i·i + y_per_j·j + y0
  //
  // Где (i, j) — **угол** пикселя, ноль в левом верхнем углу растра, ось j
  // вниз. Полпикселя RasterPixelIsPoint снято здесь, как оно снимается у
  // узлов: наружу уезжает одна конвенция, а не конвенция GeoTIFF.
  double x_per_i = 2;
  double x_per_j = 3;
  double x0 = 4;
  double y_per_i = 5;
  double y_per_j = 6;
  double y0 = 7;
}

message TileAddr {
  uint32 x = 1;
  uint32 y = 2;
}

// Произвести названные тайлы одного уровня. Пустой список тоже осмыслен:
// у последовательного формата это «построй пирамиду в кэш», без текстур.
message ProduceRequest {
  veldmap.core.ResourceHandle resource = 1;
  uint32 level = 2;
  repeated TileAddr tiles = 3;
  string label = 4;
  // То же, что `DescribeRequest.near`, и нужно здесь по той же причине: разбор
  // источника, который читается только целиком, после прохода отпускается
  // (память), и следующий проход разбирает его заново — вместе с потолком.
  bool near = 5;
}

// Промежуточный ответ: по одному на готовый тайл, в момент готовности.
message TileResult {
  uint32 level = 1;
  uint32 x = 2;
  uint32 y = 3;
  veldmap.core.ResourceHandle texture = 4;  // RGBA8 sRGB; владение — заказчику
  // Фактические размеры: краевые тайлы короче стороны тайла.
  uint32 width = 5;
  uint32 height = 6;
}

// Промежуточный ответ: чем занят долгий проход. Байты — сколько прочитано из
// источника; тайлы — сколько запрошенных уже отдано.
message ProduceProgress {
  uint64 read_bytes = 1;
  uint64 total_bytes = 2;
  uint32 done_tiles = 3;
  uint32 want_tiles = 4;
}

message ProduceDone {
  string error = 1;  // "" = успех
}
