syntax = "proto3";

package veldmap.image_loader;

import "core.proto";

// --- Image Loader ---
// Ресурс с изображением → GPU-текстура превью (RGBA8).
//
// Откуда взялись байты — не его дело: заказчик открывает ресурс сам (файл
// через fs, удалённый файл через network — они читаются одинаково) и даёт
// на него read-грант. Декод потоковый, с даунсемплом сразу в запрошенный
// бокс, поэтому память не зависит от размера исходника, а из удалённого
// ресурса по проводу идут только нужные фрагменты. Владение готовой
// текстурой передаётся заказчику: он грантит чтение (например, ui-service
// для виджета image) и освобождает её.

message LoadImageRequest {
  veldmap.core.ResourceHandle resource = 1;  // байты изображения
  // Бокс превью в пикселях: изображение ужимается так, чтобы влезть в него
  // целиком с сохранением пропорций. 0 — на усмотрение загрузчика.
  uint32 max_width = 2;
  uint32 max_height = 3;
  // Чем назвать источник в логах и в списке задач. У ресурса имени нет —
  // знает его только заказчик, поэтому пустое поле означает лишь менее
  // внятную диагностику, а не ошибку.
  string label = 4;
}

message LoadImageResult {
  veldmap.core.ResourceHandle handle = 1; // текстура RGBA8; валидна, если error пуст
  uint32 width = 2;          // размеры превью — они же размеры текстуры
  uint32 height = 3;
  uint32 source_width = 4;   // размеры исходного изображения
  uint32 source_height = 5;
  string error = 6;          // "" = успех
}
