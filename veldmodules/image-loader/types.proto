syntax = "proto3";

package veldmap.image_loader;

import "core.proto";

// --- Image Loader ---
// Файл → GPU-текстура превью (RGBA8). Файл приходит ресурсом от fs и
// читается фрагментами (у wasm нет доступа к диску, а целиком такой файл
// в память может и не влезть); декод потоковый, с даунсемплом сразу в
// запрошенный бокс — память не зависит от размера исходника. Владение
// готовой текстурой передаётся заказчику вместе с ответом: дальше он сам
// грантит чтение (например, ui-service для виджета image) и освобождает её.

message LoadImageRequest {
  string path = 1;           // путь в семантике fs (относительно runtime/)
  // Бокс превью в пикселях: изображение ужимается так, чтобы влезть в него
  // целиком с сохранением пропорций. 0 — на усмотрение загрузчика.
  uint32 max_width = 2;
  uint32 max_height = 3;
  string correlation_id = 4;
}

message LoadImageResult {
  veldmap.core.ResourceHandle handle = 1; // текстура RGBA8; валидна, если error пуст
  uint32 width = 2;          // размеры превью — они же размеры текстуры
  uint32 height = 3;
  uint32 source_width = 4;   // размеры исходного изображения
  uint32 source_height = 5;
  string error = 6;          // "" = успех
  string correlation_id = 7;
}
