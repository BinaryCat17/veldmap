name: image-loader
version: 0.1.0

# Зависимостей нет намеренно: загрузчик получает готовый ресурс и не знает,
# файл за ним или удалённый URL. Кто ресурс открыл — тот его и закроет.
interface:
  inputs:
    # Снимок декодируется секундами, и заказчик вправе бросить работу, если
    # смотреть на результат уже некому.
    on_load:
      type: module/LoadImageRequest
      cancellable: true
  outputs:
    on_load_result:
      type: module/LoadImageResult
      replies_to: on_load
