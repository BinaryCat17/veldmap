name: image-loader
version: 0.1.0

interface:
  inputs:
    on_load:
      type: module/LoadImageRequest
  outputs:
    on_load_result:
      type: module/LoadImageResult
      replies_to: on_load

dependencies:
  # У wasm нет доступа к диску: байты файла приходят от платформенного fs
  # (ответ — ResourceHandle на memory-регион, owner = запросчик).
  fs:
    subs: [on_read_result]
    calls: [on_read]
