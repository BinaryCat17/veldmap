package: veldmap-image-loader
language: rust
rust:
  dependencies:
    prost: "0.14"
    serde:
      version: "1.0"
      features: ["derive"]
    serde_json: "1.0"
    anyhow: "1.0"
    log: "0.4"
    image:
      version: "0.25"
      default-features: false
      features: ["png", "jpeg", "gif", "bmp", "webp"]
