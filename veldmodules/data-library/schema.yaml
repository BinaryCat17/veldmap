name: data-library
version: 0.1.0

interface:
  inputs:
    on_list:
      type: module/LibraryRequest
    on_download:
      type: module/DownloadRequest
    # Пауза и отказ от начатого — разные топики: первый оставляет `.part`
    # точкой возобновления, второй не оставляет ничего.
    on_pause:
      type: module/ItemRequest
    on_delete:
      type: module/ItemRequest
    # Состав снимка: сколько в нём файлов. Своими силами не узнать — обойти
    # снимок в хранилище умеет только провайдер; приходит от того, кто снимок
    # качает, и ложится в сидкары его файлов.
    on_snapshot:
      type: module/SnapshotFiles
    on_open:
      type: module/OpenRequest
    # Показать запись в файловом менеджере. Тем же ItemRequest, потому что
    # сказать нужно то же самое — какую запись; путь к ней знаем только мы.
    on_reveal:
      type: module/ItemRequest

  outputs:
    # Одно состояние на всех — и после on_list, и при любом изменении.
    # Второго топика «а теперь изменилось» нет намеренно: он отличался бы
    # только поводом, а состояние присылается одно и то же.
    #
    # Рассылается оно на всякое изменение, а поводов много — вплоть до каждого
    # события прогресса закачки, — поэтому `snapshot`: неизменившееся не уходит
    # вовсе, и спрашивать «а изменилось ли» каждому вызывающему не нужно.
    on_state:
      type: module/LibraryState
      snapshot: true
    on_open_result:
      type: core/ResourceOpened
      replies_to: on_open

dependencies:
  # Диск: листинг каталога, чтение и запись сидкаров, удаление. Единственный
  # модуль, которому положено знать раскладку хранения.
  fs:
    subs: [on_list_result, on_read_result, on_write_result, on_delete_result]
    calls: [on_list, on_read, on_write, on_delete]
  # Провайдер умеет одно: подписать адрес продукта. Качаем мы сами — запись в
  # каталоге, её раскладка и её состояние наши, а владельцем операции платформа
  # делает того, кто публикует network/on_fs_download. Владея ею, мы её сами и
  # убиваем, без посредника.
  # Он же отвечает, к какому снимку относится ключ: границу снимка задаёт
  # раскладка бакета, и вывести её здесь не из чего. Спрашиваем только про
  # записи, у которых снимок в сидкаре не записан.
  data-provider:
    subs: [on_signed, on_product_roots_result]
    calls: [on_sign, on_product_roots]
  # Собственно закачка, её прогресс и её единственный конец — в том числе у
  # убитой: пустой терминальный ответ за неё публикует хост.
  network:
    subs: [on_fs_download_progress, on_fs_download_result]
    calls: [on_fs_download]
  # Рабочий стол есть только у платформы: путь считаем мы, показывает она.
  app:
    calls: [on_reveal_path]
