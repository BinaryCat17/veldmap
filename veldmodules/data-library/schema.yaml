name: data-library
version: 0.1.0

interface:
  inputs:
    on_list:
      type: module/LibraryRequest
    on_download:
      type: module/DownloadRequest
    on_cancel:
      type: module/ItemRequest
    on_delete:
      type: module/ItemRequest
    on_open:
      type: module/OpenRequest

  outputs:
    # Одно состояние на всех — и после on_list, и при любом изменении.
    # Второго топика «а теперь изменилось» нет намеренно: он отличался бы
    # только поводом, а состояние присылается одно и то же.
    on_state:
      type: module/LibraryState
    on_open_result:
      type: core/ResourceOpened
      replies_to: on_open

dependencies:
  # Диск: листинг каталога, чтение и запись сидкаров, удаление. Единственный
  # модуль, которому положено знать раскладку хранения.
  fs:
    subs: [on_list_result, on_read_result, on_write_result, on_delete_result]
    calls: [on_list, on_read, on_write, on_delete]
  # Провайдер умеет одно: подписать адрес продукта. Качаем мы сами — запись в
  # каталоге, её раскладка и её состояние наши, а владельцем операции платформа
  # делает того, кто публикует network/on_fs_download. Владея ею, мы её сами и
  # убиваем, без посредника.
  data-provider:
    subs: [on_signed]
    calls: [on_sign]
  # Собственно закачка, её прогресс и её единственный конец — в том числе у
  # убитой: пустой терминальный ответ за неё публикует хост.
  network:
    subs: [on_fs_download_progress, on_fs_download_result]
    calls: [on_fs_download]
