syntax = "proto3";

package veldmap.data_library;

// --- DATA LIBRARY ---
// Каталог скачанного: что лежит на диске, откуда взялось и что качается
// прямо сейчас.
//
// Единственный владелец всего, что связано с локальным хранением: каталога
// (`data/dem/...`), суффикса `.part` у недокачанного (его заводит
// network/download) и сидкаров `.origin`, в которых переживает рестарт ответ
// на вопрос «откуда этот файл».
//
// Наружу отдаётся только выведенное состояние: ни путей, ни суффиксов, ни
// сидкаров в контракте нет. Потребителю (data-browser) достаточно записей.

enum LibraryStatus {
  // Начато, но не доведено: `.part` на диске либо сидкар без данных (закачка
  // сорвалась до первых байт). Во втором случае done = 0.
  LIB_PAUSED = 0;
  LIB_DOWNLOADING = 1;
  LIB_COMPLETE = 2;
}

message LibraryEntry {
  // Имя записи в каталоге — ключ для on_pause/on_delete/on_open.
  string name = 1;
  // Ключ у провайдера; пустой — файл появился мимо загрузки, докачать или
  // перекачать его нельзя (сидкара нет, спросить не у кого).
  string identifier = 2;
  uint64 done = 3;   // байт есть сейчас
  uint64 total = 4;  // ожидаемый полный размер; 0 — неизвестен
  LibraryStatus status = 5;
  // Время файла на диске, unix-секунды; 0 — файла ещё нет или время не
  // прочиталось. Единственное, что о записи знает только диск: у провайдера
  // это время объекта в хранилище, а не время скачивания.
  int64 modified = 6;
  // Снимок, к которому относится запись; пусто — она сама по себе. Пришёл с
  // запросом закачки и пережил рестарт в сидкаре: вывести его из имени
  // библиотека не может, границу снимка знает только провайдер.
  string product = 7;
  // Сколько файлов в этом снимке всего; 0 — неизвестно.
  //
  // Тем и отвечается вопрос «скачан ли снимок целиком»: сколько его файлов
  // доведено, видно по самим записям, а сколько их должно быть — только
  // отсюда. Без этого числа полным выглядел бы всякий снимок, у которого
  // доведено всё, что качали, — и три файла из двадцати шести читались бы как
  // «на диске».
  //
  // Живёт у каждой записи, а не у снимка: снимок — понятие показа, записи же у
  // библиотеки файлы, и там же, в их сидкарах, уже лежит `product`. Число
  // приходит извне (обойти снимок может только провайдер) и переживает рестарт
  // в сидкаре — как и всё, что о файле известно не из его имени.
  uint32 siblings = 8;
  // Почему сорвалась последняя попытка; пусто — не срывалась.
  //
  // Отдельно от состояния, а не четвёртым его значением: остановленная
  // человеком и сорвавшаяся закачка стоя́т одинаково — недокачанный файл на
  // диске, — и продолжаются одинаково. Различаются они только тем, знает ли
  // человек, почему она стои́т, а этого состоянием не выразить.
  //
  // Переживает перечитывание каталога, но не перезапуск: причина — про
  // попытку, а попытки после перезапуска нет. Снимается началом следующей.
  string trouble = 9;
}

// Состояние библиотеки целиком — всегда рассылка, а не ответ кому-то одному.
// Корреляции здесь нет намеренно: состояние одно на всех, у подписчика своей
// версии правды о скачанном нет, и принимать он должен любое присланное.
// Целиком, а не дельтами: список короткий, а расхождение частичных обновлений
// с действительностью — ровно та болезнь, от которой каталог перечитывается
// с диска на каждом терминальном событии.
message LibraryState {
  repeated LibraryEntry entries = 1;
  string error = 2;
}

// «Перечитай каталог». Ответом станет обычная рассылка on_state.
message LibraryRequest {}

// Скачать (или докачать) продукт провайдера. Ключ здесь — identifier, а не
// name: записи в каталоге ещё может не быть, и имени тоже.
message DownloadRequest {
  string identifier = 1;
  // Снимок, к которому относится файл; пусто — он сам по себе. Библиотека
  // приписывает его записи и запоминает в сидкаре: по нему «Скачанное»
  // собирает файлы одного снимка в одну строку.
  //
  // Приходит снаружи, а не выводится здесь: граница снимка — раскладка
  // хранилища провайдера, а библиотека знает только диск.
  string product = 2;
}

// Приостановить закачку, удалить запись или показать её в файловом менеджере.
// Ключ — name: адресуется то, что в каталоге уже есть, а значит вызывающий
// держит его запись и её имя.
//
// Одно сообщение на три топика, потому что сказать в них нужно одно и то же —
// какую запись трогаем; чем именно они различаются, сказано их именами.
message ItemRequest {
  string name = 1;
}

// «В снимке столько файлов». Одно число, которое библиотека не может добыть
// сама: обойти снимок в хранилище умеет только провайдер, а обходит его тот,
// кто снимок и качает.
//
// Сообщение отдельное, а не поле в `DownloadRequest`: состав снимка узнают и
// тогда, когда качать уже нечего — всё лежит на диске с прошлого раза, — и
// приписать его записи через закачку значило бы перекачать её ради одного
// числа.
message SnapshotFiles {
  // Ключ снимка у провайдера — тот же, что в `DownloadRequest.product`.
  string product = 1;
  // Сколько файлов в снимке. Ноль приходит — обход поддерева бывает и
  // пустым, — но значит он «сказать нечего», и получатель его роняет: этим
  // числом он переписывает `siblings` в сидкарах, и ноль стёр бы верное.
  // Отличить «ноль файлов» от «не спрашивали» скаляром proto3 всё равно
  // нельзя, а нужды в таком различении нет.
  uint32 files = 2;
}

// Открыть скачанный файл ресурсом; ответ — общий core.ResourceOpened,
// владение уходит вызывающему. Удалённый файл, которого в каталоге нет,
// открывает не библиотека, а провайдер (подписать запрос умеет только он).
message OpenRequest {
  string name = 1;
}
