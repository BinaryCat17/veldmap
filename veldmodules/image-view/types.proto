syntax = "proto3";

package veldmap.image_view;

import "core.proto";

// --- Image View ---
// Канва просмотра растра: камера, тайлы и кадр — здесь; владелец разметки
// присылает место, ресурс и намерения, а обратно читает on_view_state.

// Место канвы: владелец разметки выделил текстуру и назвал вид, которому она
// принадлежит. Обёртка вокруг общего обряда делегирования — канв много, а
// сам SurfaceDelegated имени не несёт.
message Canvas {
  string view = 1;
  veldmap.core.SurfaceDelegated surface = 2;
}

// Показать снимок в названной канве. Владение ресурсом переходит сюда: показ
// переживает обработчик, и держать байты живыми дальше больше некому.
message ShowRequest {
  string view = 1;
  veldmap.core.ResourceHandle resource = 2;
  // Чем подписать источник в логах и задачах: у ресурса имени нет.
  string label = 3;
  // Занятый номер.
  reserved 4;
}

message CloseView {
  string view = 1;
}

message CameraCommand {
  string view = 1;
  oneof command {
    Fit fit = 2;
    ZoomAt zoom_at = 3;
    Pan pan = 4;
  }
}

// Вписать снимок в канву целиком.
message Fit {}

// Масштабирование вокруг точки канвы (пиксели её текстуры): точка снимка под
// курсором остаётся под курсором.
message ZoomAt {
  float x = 1;
  float y = 2;
  // Множитель к масштабу; двойка — вдвое ближе.
  float factor = 3;
}

// Сдвиг содержимого на столько пикселей канвы, куда тянут.
message Pan {
  float dx = 1;
  float dy = 2;
}

// Что происходит с показом. Рассылается на каждом смысловом изменении и
// только при изменении; ничего, что можно было бы вывести из самой команды,
// здесь нет — это правда камеры и конвейера тайлов, которой больше нигде нет.
message ViewState {
  string view = 1;
  // Родное разрешение источника; нули — источник ещё не описан.
  uint32 source_width = 2;
  uint32 source_height = 3;
  // Экранных пикселей на пиксель снимка; 0 — камера ещё не встала.
  double scale = 4;
  // Ход производства тайлов: прочитанные байты источника — ровно те, о которых
  // позволено говорить вслух. Нулевой знаменатель значит «мерить нечем», а не
  // «ноль байт»: у источника с произвольным доступом счётчик прочитанного —
  // водяной знак головы чтения, а у прочитанного разбором целиком он равен
  // размеру ещё до прохода. Разбирает эти поводы общее правило пирамиды
  // (`tiles::inside`), то же самое, которым считается доля, — и разойтись
  // числам в подписи с длиной полосы под ними негде.
  uint64 read_bytes = 5;
  uint64 total_bytes = 6;
  // Идёт работа: описание источника или производство тайлов. Слово то же, каким
  // отвечает общее правило тайлера (`tiles::working`), и каким называет этот же
  // ответ всякий, кто его спрашивает: два имени одному ответу заставляли бы
  // принимающего решать, не разные ли это вещи.
  bool working = 7;
  // Смотреть не на что: ресурс не открылся или не описался. Кадра нет вовсе,
  // и заменить его может только причина.
  string error = 8;  // "" = порядок
  // Кадр неполон: часть тайлов не доехала, а снимок жив и виден. Поэтому не
  // вместо кадра, а подписью — и пропадает, как только что-то доезжает.
  string trouble = 9;  // "" = порядок
  // Места под кадр у канвы нет: делегированное не собралось (текстуру сменили,
  // пока событие шло; не хватило видеопамяти). Само это не пройдёт — место
  // выделяет владелец разметки, и он же обязан выдать его заново, увидев здесь
  // `true`. Отдельным полем, а не по пустому кадру: «места нет» и «нечего
  // показывать» лечатся по-разному.
  bool needs_place = 10;
  // Ход набора пирамиды теми же величинами, какими его меряет шар: ячеек
  // последнего заказа доведено из скольки, какая ступень лестницы набирается и
  // сколько их всего.
  //
  // Слагаемыми, а не готовой долей: доля из них складывается одним правилом
  // (`tiles::inside` плюс лестница), и присланная готовой она была бы вторым
  // способом сказать то же самое — тем самым, который однажды разойдётся с
  // первым. Нули значат «считать не по чему»: описания ещё нет, места под кадр
  // нет либо ступень закрыта.
  uint32 ready = 11;
  uint32 total = 12;
  uint32 step = 13;
  uint32 steps = 14;
  // Какая величина файла показана (из описания тайлера, `Described.variable`):
  // у файла многих величин выбор делает тайлер, и смотрящему его иначе не
  // видно. Пусто — источник не описан или величина одна и без имени (снимок).
  optional Variable variable = 15;
}

// Показываемая величина файла многих величин — как в файле и как файл назвал
// её словами; то же, что `Described.variable` тайлера.
message Variable {
  // Путь внутри файла (`/PRODUCT/carbonmonoxide_total_column`).
  string path = 1;
  // `long_name` либо `standard_name`; пусто — файл не назвал.
  string said = 2;
  // `units`, как записано в файле; пусто — не записано.
  string units = 3;
}
