name: image-view
version: 0.1.0

# Канва просмотра растра: тайлы пирамиды → кадр в делегированную текстуру.
# Владеет камерой, показанным ресурсом и текстурами тайлов; место получает
# делегированием (обёрнутым в Canvas: канв много, у каждой имя вида), жесты
# приезжают уже намерением — какой кнопкой тащат, знает владелец разметки.
# Тайлы берутся у tile-cache, промахи производит image-tiler; исходный ресурс
# приходит с on_show во владение, read-грант тайлеру выдаётся здесь.
#
# Отменяемых входов нет намеренно: здесь живёт межсобытийный учёт (ожидания
# query/produce, реестр канв), а приговор отменяемой операции ставит трап
# всему инстансу. Убиваются здесь только собственные produce у тайлера —
# устаревший уровень при смене масштаба и показ, который закрыли.
interface:
  inputs:
    # Место канвы. Пустая поверхность — отзыв места; сам вид при этом жив.
    on_canvas:
      type: module/Canvas
    on_show:
      type: module/ShowRequest
    # Конец вида: показ гасится, ресурсы вида освобождаются.
    on_close:
      type: module/CloseView
    on_camera:
      type: module/CameraCommand
  outputs:
    # Рассылка о ходе показа: масштаб, размеры источника, прогресс, ошибка.
    # Владелец разметки рисует из неё тулбар и свойства. Поводов рассылать
    # много — каждый приехавший тайл и каждое движение камеры, — а меняется
    # она реже, отсюда `snapshot`.
    on_view_state:
      type: module/ViewState
      snapshot: true

dependencies:
  # Кадровый тик — единственный повод рисовать (как у глобуса): события лишь
  # меняют состояние, а кадр из того же состояния пропускается сравнением.
  app:
    subs: [on_ui_event]
  # Описание источника и производство недостающих тайлов.
  image-tiler:
    subs: [on_described, on_produced, on_produce_progress, on_produce_done]
    calls: [on_describe, on_produce]
  # Дисковый кэш — первый адрес за тайлами; его промахи идут тайлеру.
  tile-cache:
    subs: [on_tile, on_query_done]
    calls: [on_query]
