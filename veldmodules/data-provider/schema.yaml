name: data-provider
version: 1.0.0

interface:
  inputs:
    on_download:
      type: module/DownloadRequest
    on_cancel_download:
      type: module/CancelDownloadRequest
    on_list_path:
      type: module/ListPathRequest
    on_search:
      type: module/SearchRequest

  outputs:
    on_download_started:
      type: module/DownloadStarted
    on_list_path_result:
      type: module/ListPathResponse
      replies_to: on_list_path
    on_search_result:
      type: module/SearchResponse
      replies_to: on_search
    on_downloaded:
      type: module/Downloaded
    on_download_progress:
      type: module/DownloadProgress

dependencies:
  network:
    subs: [on_fs_download_result, on_fs_download_progress, on_http_result]
    calls: [on_fs_download, on_http]
  tasks:
    subs: [on_task_finished]
