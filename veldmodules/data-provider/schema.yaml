name: data-provider
version: 1.0.0

interface:
  inputs:
    download:
      type: module/DownloadRequest
    cancel_download:
      type: module/CancelDownloadRequest
    list_path:
      type: module/ListPathRequest
    search:
      type: module/SearchRequest

  outputs:
    download_started:
      called_by: module/download
      type: module/DownloadStartedEvent
    list_path_result:
      called_by: module/list_path
      type: module/ListPathResponse
    downloaded:
      called_by: network/fs_download_result
      type: module/DownloadedEvent
    download_progress:
      called_by: network/fs_download_progress
      type: module/DownloadProgressEvent

dependencies:
  network:
    subs:
      fs_download_result: 
        type: network/FsResult
      fs_download_progress:
        type: network/FsDownloadProgress
      http_result:
        type: network/HttpResult
    calls:
      fs_download:
        called_by: module/download
        type: network/FsDownloadRequest
      http:
        called_by: module/list_path
        type: network/HttpTaskRequest
      cancel_download:
        called_by: module/cancel_download
        type: network/TaskCancelRequest