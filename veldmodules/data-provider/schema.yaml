name: data-provider
version: 1.0.0

interface:
  inputs:
    # Подписать адрес продукта. Скачиванием и его жизненным циклом провайдер
    # не занимается: владельцем задачи платформа делает того, кто публикует
    # network/on_fs_download, и это должен быть заказчик — иначе отменять
    # свою же закачку он может только через посредника.
    on_sign:
      type: module/SignRequest
    on_list_path:
      type: module/ListPathRequest
    on_search:
      type: module/SearchRequest
    on_open:
      type: module/OpenRequest
    # Растры продукта для наложения: роли файлов и рамка привязки. Отвечает
    # листингом поддерева продукта и знанием раскладки .SAFE.
    on_imagery:
      type: module/ImageryRequest
    # Продукт каталога по ключу хранилища: подъём к корню продукта — раскладка
    # бакета, запрос по точному имени — каталог. Обратный ход поиска.
    on_locate:
      type: module/LocateRequest

  outputs:
    on_signed:
      type: module/SignedUrl
      replies_to: on_sign
    on_open_result:
      type: core/ResourceOpened
      replies_to: on_open
    on_list_path_result:
      type: module/ListPathResponse
      replies_to: on_list_path
    on_search_result:
      type: module/SearchResponse
      replies_to: on_search
    on_imagery_result:
      type: module/ImageryResponse
      replies_to: on_imagery
    on_locate_result:
      type: module/LocateResponse
      replies_to: on_locate

dependencies:
  # Открытие удалённого ресурса (подписать умеем только мы) и HTTP для
  # листинга бакета. Закачек здесь больше нет — их ведёт заказчик.
  network:
    subs: [on_http_result, on_open_result]
    calls: [on_http, on_open]
