name: data-provider
version: 1.0.0

interface:
  inputs:
    on_download:
      type: module/DownloadRequest
    on_cancel_download:
      type: module/CancelDownloadRequest
    on_list_path:
      type: module/ListPathRequest
    on_search:
      type: module/SearchRequest
    on_preview:
      type: module/PreviewRequest

  outputs:
    on_preview_result:
      type: module/PreviewResponse
      replies_to: on_preview
    on_download_started:
      type: module/DownloadStarted
    on_list_path_result:
      type: module/ListPathResponse
      replies_to: on_list_path
    on_search_result:
      type: module/SearchResponse
      replies_to: on_search
    on_downloaded:
      type: module/Downloaded
    on_download_progress:
      type: module/DownloadProgress

dependencies:
  network:
    subs: [on_fs_download_result, on_fs_download_progress, on_http_result, on_open_result]
    calls: [on_fs_download, on_http, on_open]
  # Отмена своих закачек: TaskTracker публикует on_cancel через этот стаб,
  # терминальное событие приходит обратно как on_task_finished{cancelled}.
  tasks:
    subs: [on_task_started, on_task_finished]
    calls: [on_cancel]
