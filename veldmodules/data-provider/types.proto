syntax = "proto3";

package veldmap.data_provider;

import "core.proto";

// --- Search ---

message SearchFilter {
  string name = 1;
  string value = 2;
}

message DataProduct {
  string name = 1;
  string path = 2;
  string timestamp = 3;
  string grid_id = 4;
}

message SearchRequest {
  string query = 1;
  repeated SearchFilter filters = 2;
  string correlation_id = 3;
}

message SearchResponse {
  repeated DataProduct products = 1;
  string error = 2;
  string correlation_id = 3;
}

// --- List Path ---

message ListPathRequest {
  string path = 1;
  string token = 2;
  string correlation_id = 3;
}

message ListPathResponse {
  repeated string items = 1;
  string next_token = 2;
  string error = 3;
  string correlation_id = 4;
}

// --- Download ---

message DownloadRequest {
  string identifier = 1;
  string destination = 2;
}

// Download started event
message DownloadStarted {
  string task_id = 1;
  string identifier = 2;  // s3_key
  string destination = 3;
}

// Download progress event
message DownloadProgress {
  string task_id = 1;
  float progress = 2;  // 0.0 to 1.0
  uint64 downloaded_bytes = 3;
  uint64 total_bytes = 4;  // 0, если сервер не прислал Content-Length
}

// Download completed event
message Downloaded {
  string task_id = 1;
  bool success = 2;
  string error = 3;
  // true — закачку отменил пользователь (пауза либо удаление), а не сбой.
  // Отдельным полем, а не по тексту error: для подписчика это не ошибка —
  // .part остаётся на диске и следующее "скачать" продолжит с него, поэтому
  // показывать такое как failure нельзя (см. data-browser::on_downloaded).
  bool cancelled = 4;
}

// Cancel download request
message CancelDownloadRequest {
  string task_id = 1;
}

// --- Preview ---
// Открыть удалённый продукт как ресурс, не скачивая его. Подписывать запрос
// умеет только этот модуль (у него ключи), поэтому открывает он, а владение
// готовым ресурсом сразу передаёт заказчику: дальше тот читает его как
// обычный файл — например, отдаёт image-loader на превью.

message PreviewRequest {
  string identifier = 1;  // s3_key продукта
  string correlation_id = 2;
}

message PreviewResponse {
  veldmap.core.ResourceHandle resource = 1;  // валиден, если error пуст
  string error = 2;
  string correlation_id = 3;
}
