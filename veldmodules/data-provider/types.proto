syntax = "proto3";

package veldmap.data_provider;

// --- Поиск ---
//
// Ищется не по хранилищу, а по каталогу: у CDSE это отдельная служба поверх тех
// же продуктов, что лежат в S3, и отвечает она метаданными, а не файлами.
// Ключей она не спрашивает — читать каталог может кто угодно. Живёт запрос всё
// равно здесь: найденное нужно уметь тут же открыть и скачать, а это уже
// подпись, и раскладку хранилища знает только этот модуль.

// Точка на поверхности: WGS84, градусы. Порядок полей — как их называют вслух;
// в GeoJSON у каталога он обратный, и переставляет их разбор ответа.
message GeoPoint {
  double lat = 1;
  double lon = 2;
}

// Замкнутая ломаная по поверхности. Последняя точка совпадает с первой — в
// таком виде контуры отдаёт каталог, в таком же они идут дальше.
//
// Рёбра здесь только концами: чем считать точки между ними — отрезком в
// координатах или дугой по поверхности — решает тот, кто рисует. Уплотнить
// ломаную можно всегда, а восстановить исходные вершины из уплотнённой уже
// нельзя.
message Ring {
  repeated GeoPoint points = 1;
}

// Снимок в каталоге.
message DataProduct {
  // Путь продукта с префиксом бакета — тот же вид, что в листинге: им и
  // подписывают, и открывают, и качают.
  string identifier = 1;
  string name = 2;
  // Время съёмки, unix-секунды; 0 — каталог его не сообщил (как и в ListEntry).
  int64 acquired = 3;
  uint64 size = 4;
  // Контур съёмки. Колец бывает несколько: снимок через 180-й меридиан каталог
  // отдаёт разрезанным на два.
  repeated Ring footprint = 5;
  // Миссия и тип продукта словами каталога: «SENTINEL-2», «S2MSI2A».
  string mission = 6;
  string product_type = 7;
  // Облачность в процентах. Необязательна не для краткости: у радарной съёмки
  // её нет вовсе, и ноль означал бы «безоблачно» там, где верного ответа нет.
  optional double cloud_cover = 8;
  // Продукт доступен сразу. Иначе он в холодном хранении, и обращение к нему
  // сперва его оттуда поднимет — это долго.
  bool online = 9;
  // Продукт лежит в хранилище каталогом (.SAFE и родня) — открывается
  // переходом внутрь. false — это один объект (архив, гранула), и обращаться
  // с ним надо как с файлом: GET по пути каталога отвечает 404, а листинг по
  // пути объекта — пустотой.
  bool folder = 10;
}

// Что искать. Поля настоящие, а не пары «имя-значение»: список допустимых имён
// иначе жил бы строками и здесь, и у заказчика, и разойтись им никто бы не
// помешал.
//
// Пустое поле — «не сужать». Ни одно из них не обязательно, но запрос совсем
// без условий каталог отдаёт с начала времён, поэтому предел выдачи есть
// всегда (см. `limit`).
message SearchRequest {
  // Миссия целиком, как её называет каталог: «SENTINEL-2», «SENTINEL-1».
  string mission = 1;
  // Подстрока имени продукта — тем же поиском находят конкретный снимок или
  // все снимки одной клетки сетки.
  string name = 2;
  // Область: пересечение с этим контуром. Пусто — вся Земля.
  Ring area = 3;
  // Интервал съёмки, unix-секунды; 0 — граница не задана.
  int64 from = 4;
  int64 to = 5;
  // Верхняя граница облачности в процентах. Задавать её для радарной миссии
  // бессмысленно — там этого атрибута нет, и каталог не вернёт ничего.
  optional double max_cloud = 6;
  // Сколько снимков отдать. 0 — на усмотрение провайдера.
  uint32 limit = 7;
}

message SearchResponse {
  repeated DataProduct products = 1;
  string error = 2;
}

// --- List Path ---

message ListPathRequest {
  string path = 1;
  string token = 2;
}

message ListPathResponse {
  repeated ListEntry entries = 1;
  string next_token = 2;
  string error = 3;
}

// Элемент листинга. Размер и время у объекта каталог сообщает сам, а у папки
// их нет вовсе: папка в S3 — это общий префикс ключей, и ни размера, ни даты
// за ней не стоит; узнать их можно только обойдя её содержимое.
message ListEntry {
  // Путь продукта с префиксом бакета; со слэшем на конце — папка.
  string key = 1;
  uint64 size = 2;
  // Unix-секунды; 0 — каталог времени не сообщил.
  int64 modified = 3;
  // Снимок, внутри которого лежит запись; пусто — она лежит в пути к снимкам,
  // а не в снимке. Совпал с ключом без завершающего слэша — запись и есть
  // снимок: папка .SAFE тем и отличается от папки года, что декодер собирает её
  // в один растр, и смотрят её целиком. Без слэша потому, что слэш здесь —
  // признак папки в листинге, а не часть пути снимка.
  //
  // Ключом, а не признаком «да/нет»: тому, кто скачивает файл из середины
  // снимка, нужно знать, к какому снимку его записать, — а «да/нет» на это не
  // отвечает. Едет отсюда, а не выводится потребителем: чтобы провести границу
  // снимка, нужна раскладка бакета, и она есть только здесь
  // (см. s3::product_root).
  string product = 4;
}

// --- Подпись ---
//
// Единственное, чего не может сделать никто другой: подписать запрос к
// хранилищу — ключи есть только здесь. Всё остальное про закачку (куда
// класть, когда начать, чем отменить, что показать пользователю) знает
// заказчик, поэтому качает он сам, а сюда обращается ровно за подписью.
//
// Цикла закачки здесь нет намеренно: владельцем операции платформа делает того,
// кто публикует network/on_fs_download, и это должен быть заказчик — иначе
// убить собственную закачку он мог бы только через посредника. Провайдер
// подписывает адрес и на этом заканчивает; заодно ему не нужно знать, то
// есть раскладку чужого хранилища.

message SignRequest {
  string identifier = 1;  // путь продукта с префиксом бакета
}

// Подписанный адрес. Живёт столько же, сколько сама подпись (для SigV4 это
// порядка четверти часа) — заказчик обязан пустить его в дело сразу.
message SignedUrl {
  string url = 1;
  map<string, string> headers = 2;
  string error = 3;
}

// --- Imagery ---
// Растры продукта для наложения на глобус: какие файлы каких ролей лежат
// внутри и в какой рамке они привязаны. Раскладку .SAFE и смысл имени тайла
// знает только провайдер; проекционная математика — у потребителя (глобуса),
// сюда идут числа зоны.

message ImageryRequest {
  string identifier = 1;  // путь продукта с префиксом бакета
}

enum ImageryRole {
  IMAGERY_PREVIEW = 0;   // маленький квиклук: картинка сразу
  IMAGERY_DETAILED = 1;  // подробный растр: к нему идут на приближении
}

message ImageryRaster {
  string identifier = 1;  // путь файла с префиксом бакета
  ImageryRole role = 2;
}

// Рамка растра в метрах его зоны UTM. y1 — северный край: строки растра идут
// с севера на юг. Обе роли одного продукта лежат в одной рамке — гранула одна.
message UtmFrame {
  uint32 zone = 1;
  bool south = 2;
  double x0 = 3;
  double y0 = 4;
  double x1 = 5;
  double y1 = 6;
}

message ImageryResponse {
  repeated ImageryRaster rasters = 1;
  // Точная рамка гранулы, когда она выводится из имени (Sentinel-2). Без неё
  // потребителю остаётся футпринт из каталога — заявленная аппроксимация.
  optional UtmFrame utm = 2;
  string error = 3;
}

// --- Locate ---
// Продукт каталога по ключу хранилища — обратный ход поиска. У строки листинга
// и у скачанного файла есть только ключ, а показ на шаре хочет весь продукт:
// футпринт, имя, тип. Подняться от ключа к корню продукта (раскладка бакета)
// и спросить каталог по точному имени умеет только провайдер.

message LocateRequest {
  // Любой ключ внутри продукта, с префиксом бакета: сам продукт, его файл,
  // папка уровнем глубже.
  string identifier = 1;
}

message LocateResponse {
  // Пусто вместе с пустой error не бывает: либо продукт, либо объяснение.
  optional DataProduct product = 1;
  string error = 2;
}

// --- Product roots ---
// «К какому снимку относятся эти ключи». Единственный вопрос к провайдеру, на
// который он отвечает не ходя никуда: границу снимка задаёт раскладка бакета,
// и видна она в самом ключе (`s3::product_root`).
//
// Отдельно от `on_locate` затем, что тот отвечает продуктом каталога — то есть
// ходит в сеть и отвечает по одному. Здесь спрашивают про пачку ключей и хотят
// только границу; заводить ради этого сетевой обмен значит запретить его тем,
// кому нужен весь список сразу (см. data-library: приписать снимок файлам,
// скачанным до того, как границу стали записывать).

message ProductRootsRequest {
  repeated string identifiers = 1;
}

message ProductRoots {
  // Ключ → корень снимка, без завершающего слэша. Ключа, который ни в каком
  // снимке не лежит, в ответе нет вовсе: пустая строка значила бы «снимок с
  // пустым именем», а отсутствие — «снимка нет», и это разные ответы.
  map<string, string> roots = 1;
}

// --- Open ---
// Открыть продукт как ресурс, не скачивая его. Подписывать запрос к хранилищу
// умеет только этот модуль (у него ключи), поэтому открывает он, а владение
// готовым ресурсом сразу передаёт заказчику: дальше тот читает его как обычный
// файл — например, отдаёт конвейеру тайлов на превью.
//
// Зачем это здесь, а не у заказчика: единственное, что он не может сделать
// сам, — подписать запрос. Всё остальное (чтение окнами, декодирование) уже
// не про поставщика данных, поэтому и ответ — общий core.ResourceOpened,
// такой же, как у fs и network.

message OpenRequest {
  string identifier = 1;  // путь продукта с префиксом бакета
}
