syntax = "proto3";

package veldmap.ui_service;

import "core.proto";

message Layout {
    Widget root = 1;
}

message Widget {
    oneof type {
        Column column = 1;
        Row row = 2;
        Text text = 3;
        Button button = 4;
        TextInput text_input = 5;
        WgpuImage image = 6;
        Space space = 7;
        Container container = 8;
        Scrollable scrollable = 9;
        ProgressBar progress_bar = 10;
        Stack stack = 11;
        Tooltip tooltip = 12;
    }
    // Устойчивое имя ребёнка внутри своего родителя. Состояние виджета
    // (позиция скролла, каретка и выделение в поле ввода) живёт у рендерера и
    // сопоставляется с разметкой по месту в ней: удалили элемент из середины —
    // и всё, что ниже, разъехалось на одну позицию вместе с чужим состоянием.
    // Ключ говорит, где на самом деле произошло изменение.
    //
    // Именно это он и делает, не больше: список той же длины сопоставляется
    // позиционно даже с ключами, так что перестановка соседей состояние за
    // собой не тянет. Учитывает ключи пока только Column — keyed-вариант в
    // iced есть у неё одной.
    //
    // Подменять ключом целое поддерево нельзя: keyed-колонка диффит детей без
    // проверки типа, и на месте прежнего виджета окажется его состояние. Смену
    // содержимого и так ловит обычная колонка — по несовпадению типа.
    string key = 13;
}

// A widget event handler: identifies the input method of the owning module
// that the event is dispatched to, plus an optional payload set at view time
// (for TextInput the runtime replaces value with the typed text).
message Handler {
    string method = 1;
    string value = 2;
}

message Stack {
    repeated Widget children = 1;
    Length width = 2;
    Length height = 3;
}

message Tooltip {
    Widget content = 1;
    string tooltip = 2;
    uint32 position = 3; // Enum Position
    float gap = 4;
    Padding padding = 5;
    reserved 6; // бывший `string style` — конвертер его не читал
}

message ProgressBar {
    float range_start = 1;
    float range_end = 2;
    float value = 3;
    Length width = 4;
    Length height = 5;
}

message Scrollable {
    Widget content = 1;
    Length width = 2;
    Length height = 3;
    // Ось прокрутки. Горизонтальная — единственный способ сказать «содержимое
    // шире места»: без неё дети сжимаются до нуля, а не уезжают за край.
    ScrollDirection direction = 4;
}

enum ScrollDirection {
    SCROLL_VERTICAL = 0;
    SCROLL_HORIZONTAL = 1;
    SCROLL_BOTH = 2;
}

message Column {
    repeated Widget children = 1;
    float spacing = 2;
    Padding padding = 3;
    Alignment align_items = 4;
    Length width = 5;
    Length height = 6;
    Length max_width = 7;
    Length max_height = 8;
}

message Row {
    repeated Widget children = 1;
    float spacing = 2;
    Padding padding = 3;
    Alignment align_items = 4;
    Length width = 5;
    Length height = 6;
    Length max_width = 7;
    Length max_height = 8;
}

message Text {
    string content = 1;
    float size = 2;
    Color color = 3;
    bool bold = 4;
    Alignment horizontal_alignment = 5;
    Alignment vertical_alignment = 6;
    // 7 — бывший `string style`: класс-строка, которую конвертер никогда не
    // читал. Внешний вид текста задают color/size/bold, и это единственный
    // способ; сеттер в wrap-крейте существовал и молча ничего не делал.
    reserved 7;
    Length width = 8;
    Length height = 9;
    uint32 shaping = 10;
    string font_family = 11;
    // Что делать, когда текст не помещается в отведённую ширину.
    Wrapping wrapping = 12;
}

// Умолчание — перенос по словам, как в iced. Подписи (заголовок вкладки, имя
// в строке списка, надпись на кнопке) обязаны объявлять NO_WRAP: длинное имя
// без пробелов в узком месте иначе переносится по букве, и высота подписи
// растёт до высоты окна, унося за собой всю раскладку. Ширину такой текст
// займёт больше отведённой — обрежет его ближайший скроллируемый предок.
enum Wrapping {
    WRAP_WORD = 0;
    NO_WRAP = 1;
    WRAP_GLYPH = 2;
    WRAP_WORD_OR_GLYPH = 3;
}

message Radius {
    float top_left = 1;
    float top_right = 2;
    float bottom_right = 3;
    float bottom_left = 4;
}

message Border {
    Color color = 1;
    float width = 2;
    Radius radius = 3;
}

message Shadow {
    Color color = 1;
    float offset_x = 2;
    float offset_y = 3;
    float blur_radius = 4;
}

message Background {
    oneof type {
        Color color = 1;
        // Gradient gradient = 2; // Future
    }
}

message WidgetStyle {
    optional Background background = 1;
    optional Color text_color = 2;
    optional Border border = 3;
    optional Shadow shadow = 4;
}

message ButtonStyle {
    WidgetStyle active = 1;
    WidgetStyle hovered = 2;
    WidgetStyle pressed = 3;
    WidgetStyle disabled = 4;
}

message Button {
    Widget child = 1;
    Handler on_press = 2;
    bool disabled = 3;
    Length width = 4;
    Length height = 5;
    oneof style_variant {
        string style_class = 8;
        ButtonStyle style_custom = 10;
    }
    Padding padding = 9;
}

message TextInput {
    string value = 1;
    string placeholder = 2;
    Handler on_input = 3;
    Handler on_submit = 4;
    reserved 5; // бывший `string style` — конвертер его не читал
    Length width = 6;
    Padding padding = 7;
    float size = 8;
}

message WgpuImage {
    veldmap.core.ResourceHandle handle = 1;
    Length width = 2;
    Length height = 3;
}

message Space {
    Length width = 1;
    Length height = 2;
}

message Container {
    Widget child = 1;
    Padding padding = 2;
    Length width = 3;
    Length height = 4;
    Length max_width = 9;
    Length max_height = 10;
    Alignment align_x = 5;
    Alignment align_y = 6;
    // Фон контейнера задаётся только этим полем. Поле 8 было вторым,
    // конкурирующим `string style`, которое конвертер не читал.
    Background background = 7;
    reserved 8;
}

message Padding {
    float top = 1;
    float right = 2;
    float bottom = 3;
    float left = 4;
}

message Length {
    oneof value {
        float fixed = 1;
        bool shrink = 2;
        bool fill = 3;
        float portion = 4;
    }
}

enum Alignment {
    START = 0;
    CENTER = 1;
    END = 2;
}

message Color {
    float r = 1;
    float g = 2;
    float b = 3;
    float a = 4;
}

// RPC messages for ui-service.
// SetView is fire-and-forget: the module ships its full current view; the
// renderer owns change detection and frame pacing.
message SetViewRequest {
    string plugin_id = 1;
    Layout layout = 2;
}

// Делегирование render-таргета: владелец окна аллоцировал текстуру, выдал
// ui-service write-lease и передаёт её сюда вместе с размером холста.
// Пока модуль не делегировал поверхность, его события ввода игнорируются.
message SetSurfaceRequest {
    string plugin_id = 1;
    veldmap.core.ResourceHandle surface = 2;
    uint32 width = 3;
    uint32 height = 4;
    float scale_factor = 5;
}

// A UI event captured by the renderer, dispatched to `{plugin_id}/{method}`.
message UiEventResponse {
    string plugin_id = 1;
    string method = 2;
    string value = 3; // For TextInput or similar
}
