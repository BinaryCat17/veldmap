syntax = "proto3";

package veldmap.ui_service;

import "core.proto";

message Layout {
    Widget root = 1;
}

message Widget {
    oneof type {
        Column column = 1;
        Row row = 2;
        Text text = 3;
        // 4 занимал Button. Отдельного виджета-кнопки здесь нет: нажимаемость —
        // свойство коробки (см. Container.interaction), и номер не занимается
        // заново, чтобы старая разметка не разобралась во что-то другое.
        TextInput text_input = 5;
        WgpuImage image = 6;
        Space space = 7;
        Container container = 8;
        Scrollable scrollable = 9;
        ProgressBar progress_bar = 10;
        Stack stack = 11;
        Tooltip tooltip = 12;
        Popover popover = 14;
    }
    // Устойчивое имя ребёнка внутри своего родителя. Состояние виджета
    // (позиция скролла, каретка и выделение в поле ввода) живёт у рендерера и
    // сопоставляется с разметкой по месту в ней: удалили элемент из середины —
    // и всё, что ниже, разъехалось на одну позицию вместе с чужим состоянием.
    // Ключ говорит, где на самом деле произошло изменение.
    //
    // Именно это он и делает, не больше: список той же длины сопоставляется
    // позиционно даже с ключами, так что перестановка соседей состояние за
    // собой не тянет. Учитывает ключи пока только Column — keyed-вариант в
    // iced есть у неё одной.
    //
    // Подменять ключом целое поддерево нельзя: keyed-колонка диффит детей без
    // проверки типа, и на месте прежнего виджета окажется его состояние. Смену
    // содержимого и так ловит обычная колонка — по несовпадению типа.
    string key = 13;
}

// A widget event handler: identifies the input method of the owning module
// that the event is dispatched to, plus an optional payload set at view time
// (for TextInput the runtime replaces value with the typed text).
message Handler {
    string method = 1;
    string value = 2;
}

message Stack {
    repeated Widget children = 1;
    Length width = 2;
    Length height = 3;
}

message Tooltip {
    Widget content = 1;
    string tooltip = 2;
    TooltipPosition position = 3;
    float gap = 4;
    // Одно число, а не Padding: подсказка отступает от своего содержимого
    // одинаково со всех сторон, и разные значения по сторонам ей задать нечем.
    float padding = 5;
    // Вид самой подсказки; `text_color` — цвет её надписи.
    WidgetStyle style = 6;
    float text_size = 7;
}

// С какой стороны от содержимого встаёт подсказка.
enum TooltipPosition {
    TOOLTIP_TOP = 0;
    TOOLTIP_BOTTOM = 1;
    TOOLTIP_LEFT = 2;
    TOOLTIP_RIGHT = 3;
}

// Панель, всплывающая у своего якоря: меню кнопки, выпадающий список.
//
// Открыта или закрыта — решает клиент, а не сервис: состояние меню живёт там
// же, где остальное состояние экрана, и знать про него сервису нечего.
//
// Панель не занимает места в раскладке и не режется прокруткой: она рисуется
// поверх всего, как подсказка. Поэтому меню строки списка не обязано считать
// свои координаты — их знает якорь.
message Popover {
    Widget anchor = 1;
    Widget panel = 2;
    bool open = 3;
    // Каким краем панель равняется на якорь: START — левым к левому,
    // END — правым к правому.
    Alignment align_x = 4;
    // Зазор между якорем и панелью.
    float gap = 5;
    // Что клиент получит, когда мимо панели щёлкнут: без этого открытое меню
    // нечем закрыть. Событие при этом гасится — щелчок «мимо меню» закрывает
    // его и не нажимает то, что под ним.
    Handler on_dismiss = 6;
}

message ProgressBar {
    float range_start = 1;
    float range_end = 2;
    float value = 3;
    Length width = 4;
    Length height = 5;
    ProgressBarStyle style = 6;
}

// Полоса прогресса: дорожка, заполненная часть и общая рамка.
message ProgressBarStyle {
    Background track = 1;
    Background bar = 2;
    Border border = 3;
}

message Scrollable {
    Widget content = 1;
    Length width = 2;
    Length height = 3;
    // Ось прокрутки. Горизонтальная — единственный способ сказать «содержимое
    // шире места»: без неё дети сжимаются до нуля, а не уезжают за край.
    ScrollDirection direction = 4;
    Scrollbar scrollbar = 5;
}

// Полоса прокрутки: геометрия и цвета. Одна на обе оси — вид у них общий, а
// разные значения по осям задать было бы нечем.
message Scrollbar {
    // Ширина дорожки; 0 — умолчание рендерера.
    float width = 1;
    // Ширина бегунка внутри дорожки; 0 — во всю её ширину.
    float scroller_width = 2;
    // Отступ дорожки от края содержимого.
    float margin = 3;
    Background rail = 4;
    Background scroller = 5;
    // Скругление бегунка и дорожки.
    float radius = 6;
}

enum ScrollDirection {
    SCROLL_VERTICAL = 0;
    SCROLL_HORIZONTAL = 1;
    SCROLL_BOTH = 2;
}

// Потолок размера — только у Container: он умеет ограничить кого угодно, и
// один такой способ понятнее, чем свой у каждого носителя детей.
message Column {
    repeated Widget children = 1;
    float spacing = 2;
    Padding padding = 3;
    Alignment align_items = 4;
    Length width = 5;
    Length height = 6;
}

message Row {
    repeated Widget children = 1;
    float spacing = 2;
    Padding padding = 3;
    Alignment align_items = 4;
    Length width = 5;
    Length height = 6;
}

message Text {
    string content = 1;
    float size = 2;
    // Не задан — текст рисуется цветом, который назвал носитель (кнопка,
    // контейнер, подсказка). «Не сказано» значит «как всё вокруг», а не
    // «чёрный»: иначе каждая подпись повторяла бы цвет своей роли.
    optional Color color = 3;
    Alignment horizontal_alignment = 4;
    Alignment vertical_alignment = 5;
    Length width = 6;
    Length height = 7;
    Shaping shaping = 8;
    string font_family = 9;
    // Что делать, когда текст не помещается в отведённую ширину.
    Wrapping wrapping = 10;
    // Насыщенность начертания. Работает, пока в семействе есть такое лицо:
    // синтетического жирного нет, недостающее подменяется ближайшим.
    FontWeight weight = 11;
}

// Начертания, которые различает разметка. Полный набор весов шрифту не нужен:
// подпись бывает обычной, выделенной или заголовочной, а промежуточные веса
// в интерфейсе неотличимы друг от друга.
enum FontWeight {
    WEIGHT_NORMAL = 0;
    WEIGHT_MEDIUM = 1;
    WEIGHT_BOLD = 2;
}

// Сложность разбора строки. Продвинутый шейпинг нужен письменностям с
// лигатурами и переупорядочиванием (арабица, деванагари); латинице и кириллице
// он стоит времени и ничего не даёт.
enum Shaping {
    SHAPE_BASIC = 0;
    SHAPE_ADVANCED = 1;
}

// Умолчание — перенос по словам, как в iced: рвать строку можно только по
// пробелам. В имени файла, пути или ключе пробелов нет, поэтому в отведённую
// ширину такой текст не переносится, а выходит за неё — рамка своего места его
// не удержит. Тексту, который обязан остаться внутри, нужен
// WRAP_WORD_OR_GLYPH: он рвёт по словам, а неделимое слово — по буквам.
//
// NO_WRAP — для того, что обязано остаться одной строкой (заголовок вкладки,
// глиф иконки). Ширину такой текст займёт больше отведённой, и обрежет его
// только ближайший скроллируемый предок.
enum Wrapping {
    WRAP_WORD = 0;
    NO_WRAP = 1;
    WRAP_GLYPH = 2;
    WRAP_WORD_OR_GLYPH = 3;
}

message Border {
    Color color = 1;
    float width = 2;
    // Скругление одно на все четыре угла: рисуется оно расстоянием до
    // скруглённого прямоугольника (см. shaders.wgsl), и радиус там один.
    float radius = 3;
}

message Background {
    oneof type {
        Color color = 1;
        // Gradient gradient = 2; // Future
    }
}

// Тень под виджетом. Нулевое размытие при нулевом смещении — тени нет.
message Shadow {
    Color color = 1;
    float offset_x = 2;
    float offset_y = 3;
    float blur = 4;
}

// Внешний вид виджета в одном из его состояний.
//
// `text_color` не задан — текст внутри рисуется цветом темы: «не сказано» тут
// значит «как обычный текст», а не «чёрный».
message WidgetStyle {
    optional Background background = 1;
    optional Color text_color = 2;
    optional Border border = 3;
    optional Shadow shadow = 4;
}

message TextInput {
    string value = 1;
    string placeholder = 2;
    Handler on_input = 3;
    Handler on_submit = 4;
    Length width = 5;
    Padding padding = 6;
    float size = 7;
    TextInputStyle style = 8;
    string font_family = 9;
}

// Поле ввода в трёх своих состояниях. Фон, рамка и цвет набранного — общий
// `WidgetStyle` (его `text_color` и есть цвет значения); подсказка и выделение
// от состояния не зависят и заданы один раз.
message TextInputStyle {
    WidgetStyle active = 1;
    WidgetStyle hovered = 2;
    WidgetStyle focused = 3;
    Color placeholder = 4;
    Color selection = 5;
}

message WgpuImage {
    veldmap.core.ResourceHandle handle = 1;
    Length width = 2;
    Length height = 3;
}

message Space {
    Length width = 1;
    Length height = 2;
}

// Коробка: отступ, размер, выравнивание содержимого, обрезка, фон и рамка.
// Она же кнопка — стоит задать `interaction`.
message Container {
    Widget child = 1;
    Padding padding = 2;
    Length width = 3;
    Length height = 4;
    Length max_width = 5;
    Length max_height = 6;
    Alignment align_x = 7;
    Alignment align_y = 8;
    // Вид в покое. У ненажимаемой коробки он единственный: реагировать ей не на
    // что, и остальные состояния ей назвать нечем.
    WidgetStyle style = 9;
    // Обрезать содержимое по своим границам. Нужен там, где ребёнок может
    // оказаться шире отведённого: без него текст, не поместившийся в колонку,
    // рисуется поверх соседней (см. `Wrapping`).
    bool clip = 10;
    // Задан — коробка нажимается.
    Interaction interaction = 11;
}

// Отклик коробки на курсор: то, чем кнопка отличается от простой коробки.
//
// Отдельного виджета-кнопки в протоколе нет намеренно. Кнопка — это та же
// коробка: отступ, размер, выравнивание содержимого, обрезка, фон, рамка. Свой
// носитель всех этих полей рано или поздно расходится с контейнером и обедняет
// себя — так и было: кнопка не умела выравнивать содержимое, и глиф в кнопке
// фиксированного размера прижимался к её углу, а каждый call-сайт обходил это
// лишней обёрткой (и половина из них забывала).
//
// Виды состояний вырождаются к покою, а не к чёрному прямоугольнику: почти
// всякой кнопке хватает двух лиц, и остальные два не нужно повторять третий
// раз, чтобы они не разъехались.
message Interaction {
    // Нет — кнопка выключена: рисуется `disabled`, нажатие в неё не идёт.
    Handler on_press = 1;
    // Под курсором; не задан — как в покое (`Container.style`).
    WidgetStyle hovered = 2;
    // Под нажатой кнопкой мыши; не задан — как под курсором.
    WidgetStyle pressed = 3;
    // Выключенная; не задан — как в покое.
    WidgetStyle disabled = 4;
}

message Padding {
    float top = 1;
    float right = 2;
    float bottom = 3;
    float left = 4;
}

message Length {
    oneof value {
        float fixed = 1;
        bool shrink = 2;
        bool fill = 3;
        float portion = 4;
    }
}

enum Alignment {
    START = 0;
    CENTER = 1;
    END = 2;
}

message Color {
    float r = 1;
    float g = 2;
    float b = 3;
    float a = 4;
}

// Сообщения ui-service.
//
// Имени отправителя ни в одном из них нет: его штампует хост, и модуль читает
// достоверное через veldsdk::event_publisher(). Клиента сервис узнаёт только
// так — по нему же он и адресует события виджетов обратно.

// Fire-and-forget: модуль шлёт свой текущий view целиком, а когда его рисовать,
// решает рендерер.
message SetViewRequest {
    Layout layout = 2;
}

// Делегирование render-таргета: владелец окна аллоцировал текстуру, выдал
// ui-service write-lease и передаёт её сюда вместе с размером холста.
// Пока модуль не делегировал поверхность, его события ввода игнорируются.
message SetSurfaceRequest {
    veldmap.core.ResourceHandle surface = 2;
    uint32 width = 3;
    uint32 height = 4;
    float scale_factor = 5;
}

// Сработавший виджет, как его объявили в разметке (см. Handler). Едет обратно
// автору разметки адресным топиком, поэтому получателя в себе не несёт.
message UiEventResponse {
    string method = 2;
    string value = 3;
}
