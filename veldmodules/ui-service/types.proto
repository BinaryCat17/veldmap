syntax = "proto3";

package veldmap.ui_service;

import "core.proto";

message Layout {
    Widget root = 1;
}

message Widget {
    oneof type {
        Column column = 1;
        Row row = 2;
        Text text = 3;
        // 4 занимал Button. Отдельного виджета-кнопки здесь нет: нажимаемость —
        // свойство коробки (см. Container.interaction), и номер не занимается
        // заново, чтобы старая разметка не разобралась во что-то другое.
        TextInput text_input = 5;
        WgpuImage image = 6;
        Space space = 7;
        Container container = 8;
        Scrollable scrollable = 9;
        ProgressBar progress_bar = 10;
        // 11 занимал Stack; номер не занимается заново, чтобы старая разметка
        // не разобралась во что-то другое. Слой поверх слоя даёт Popover —
        // оверлеем, не занимая места в раскладке.
        Tooltip tooltip = 12;
        Popover popover = 14;
        Viewport viewport = 15;
        Slider slider = 16;
        Divider divider = 17;
    }
    // Устойчивое имя ребёнка внутри своего родителя. Состояние виджета
    // (позиция скролла, каретка и выделение в поле ввода) живёт у рендерера и
    // сопоставляется с разметкой по месту в ней: удалили элемент из середины —
    // и всё, что ниже, разъехалось на одну позицию вместе с чужим состоянием.
    // Ключ говорит, где на самом деле произошло изменение.
    //
    // Именно это он и делает, не больше: список той же длины сопоставляется
    // позиционно даже с ключами, так что перестановка соседей состояние за
    // собой не тянет. Учитывает ключи пока только Column — keyed-вариант в
    // iced есть у неё одной.
    //
    // Подменять ключом целое поддерево нельзя: keyed-колонка диффит детей без
    // проверки типа, и на месте прежнего виджета окажется его состояние. Смену
    // содержимого и так ловит обычная колонка — по несовпадению типа.
    string key = 13;
}

// Обработчик виджета: имя входа модуля-владельца, куда уедет событие, и то,
// что модуль хочет получить обратно.
//
// Полей отдачи два, и отвечают они на разные вопросы. `value` — что произошло;
// у виджета, чью нагрузку изготавливает рендерер (поле ввода, область,
// ползунок), она этой нагрузкой и подменяется. `key` — с кем; его не подменяет
// никто, и он единственный способ для виджета, стоящего в списке или во второй
// половине экрана, назвать свою строку или свою вкладку.
//
// Разделены они именно поэтому: пока ключом служила нагрузка, у кнопки они
// совпадали, а у поля ввода расходились — и одно и то же «кто» приходилось
// доставать из разных мест.
message Handler {
    string method = 1;
    string value = 2;
    string key = 3;
}

message Tooltip {
    Widget content = 1;
    string tooltip = 2;
    TooltipPosition position = 3;
    float gap = 4;
    // Одно число, а не Padding: подсказка отступает от своего содержимого
    // одинаково со всех сторон, и разные значения по сторонам ей задать нечем.
    float padding = 5;
    // Вид самой подсказки; `text_color` — цвет её надписи.
    WidgetStyle style = 6;
    float text_size = 7;
}

// С какой стороны от содержимого встаёт подсказка.
enum TooltipPosition {
    TOOLTIP_TOP = 0;
    TOOLTIP_BOTTOM = 1;
    TOOLTIP_LEFT = 2;
    TOOLTIP_RIGHT = 3;
}

// Панель, всплывающая у своего якоря: меню кнопки, выпадающий список.
//
// Открыта или закрыта — решает клиент, а не сервис: состояние меню живёт там
// же, где остальное состояние экрана, и знать про него сервису нечего.
//
// Панель не занимает места в раскладке и не режется прокруткой: она рисуется
// поверх всего, как подсказка. Поэтому меню строки списка не обязано считать
// свои координаты — их знает якорь.
message Popover {
    Widget anchor = 1;
    Widget panel = 2;
    bool open = 3;
    // Каким краем панель равняется на якорь: START — левым к левому,
    // END — правым к правому.
    Alignment align_x = 4;
    // Зазор между якорем и панелью.
    float gap = 5;
    // Что клиент получит, когда мимо панели щёлкнут: без этого открытое меню
    // нечем закрыть. Событие при этом гасится — щелчок «мимо меню» закрывает
    // его и не нажимает то, что под ним.
    Handler on_dismiss = 6;
}

message ProgressBar {
    float range_start = 1;
    float range_end = 2;
    float value = 3;
    Length width = 4;
    Length height = 5;
    ProgressBarStyle style = 6;
}

// Полоса прогресса: дорожка, заполненная часть и общая рамка.
message ProgressBarStyle {
    Background track = 1;
    Background bar = 2;
    Border border = 3;
}

// Дробное значение, которое тянут. От `ProgressBar` отличается ровно тем, что
// на него можно нажать: у полосы прогресса обработчика нет и быть не может —
// она показывает чужой ход, а не спрашивает.
//
// Значение возвращается строкой в общей нагрузке, а не своим её видом: число
// разбирается тем же `parse`, что и всякое другое значение, а чей это ползунок,
// говорит `Handler.key`.
message Slider {
    float range_start = 1;
    float range_end = 2;
    float value = 3;
    // Шаг; 0 — непрерывно.
    float step = 4;
    // Значение поменялось — приходит на каждое движение, пока тянут.
    Handler on_change = 5;
    // Ручку отпустили. Нужен там, где откликаться на каждое промежуточное
    // значение дорого: перетаскивание даёт их десятками.
    Handler on_release = 6;
    Length width = 7;
    // Высота полосы вместе с ручкой, в точках.
    float height = 8;
    SliderStyle style = 9;
}

// Вид ползунка: дорожка до ручки, дорожка после и сама ручка.
//
// Одно лицо на все состояния — в отличие от кнопки: дорожка с ручкой и так
// читается как то, что тянут, а подсветка под курсором ничего к этому не
// добавляет.
message SliderStyle {
    // Дорожка до ручки и после неё.
    Background filled = 1;
    Background rest = 2;
    float rail_width = 3;
    Border rail_border = 4;
    Background handle = 5;
    // Радиус круглой ручки. Иных форм здесь нет: прямоугольную ручку от
    // заполненной дорожки не отличить.
    float handle_radius = 6;
    float handle_border_width = 7;
    Color handle_border_color = 8;
}

// Граница между соседями в раскладке: её тянут мышью, и ею двигают их размеры.
//
// Своим виджетом, а не нажимаемой коробкой: у коробки есть только нажатие, а
// граница живёт удержанием — от нажатия до отпускания, в том числе за
// собственными краями.
//
// Отдаёт она сдвиг курсора, а не новый размер соседей: размеры задал владелец
// разметки, и перевести точки в них может только он. Виджет своих соседей не
// меряет — он даже не знает, кто они.
message Divider {
    DividerAxis axis = 1;
    // Ширина полосы, за которую можно взяться. Сама линия рисуется тоньше: по
    // ней целятся глазом, а берутся всей полосой — попасть в волосяную линию
    // мышью нельзя.
    float thickness = 2;
    float line = 3;
    // Цвет линии в покое и когда за неё можно взяться — под курсором и пока
    // тянут. Второй цвет и есть весь отклик: курсор в этом протоколе не
    // меняется, и «здесь можно тянуть» сказать больше нечем.
    Color color = 4;
    Color active = 5;
    // Сдвиг курсора вдоль оси перетаскивания с прошлого события, в точках
    // разметки. Приходит, пока границу тянут; нагрузку изготавливает рендерер.
    //
    // Сдвиг, а не путь от начала: разметка на каждое событие пересобирается, и
    // граница успевает переехать под курсор — путь от начала пришлось бы
    // отсчитывать от места, которого уже нет.
    Handler on_drag = 6;
    // Границу отпустили. Нужен там, где отзываться на каждое промежуточное
    // положение дорого: перетаскивание даёт их десятками, а «встало вот так» —
    // это одно событие, и наступает оно здесь.
    Handler on_release = 7;
}

// Как стоит граница и куда её тянут.
enum DividerAxis {
    // Стоит вертикально, тянут вбок.
    DIVIDER_VERTICAL = 0;
    // Стоит горизонтально, тянут вверх-вниз.
    DIVIDER_HORIZONTAL = 1;
}

message Scrollable {
    Widget content = 1;
    Length width = 2;
    Length height = 3;
    // Ось прокрутки. Горизонтальная — единственный способ сказать «содержимое
    // шире места»: без неё дети сжимаются до нуля, а не уезжают за край.
    ScrollDirection direction = 4;
    Scrollbar scrollbar = 5;
    // Имя области — им её адресует наводка ниже. Пусто — наводить не на что:
    // безымянную область не назвать, а имя нужно ровно затем, чтобы отличить её
    // от соседней такой же (списков на экране несколько).
    string name = 6;
    // Куда встать по вертикали и по чьей просьбе. Пусто — не наводить.
    //
    // Применяется один раз на просьбу: разметка пересобирается на каждое
    // событие, и наводка, применяемая каждый кадр, держала бы область
    // намертво — колесо крутилось бы, а список стоял.
    optional ScrollTo scroll_to = 7;
}

// Наводка прокрутки: куда встать и по чьей просьбе.
message ScrollTo {
    // Точки от начала содержимого. Сколько это в строках, знает только
    // клиент — высота строки его, а не наша.
    float offset = 1;
    // Номер просьбы, растущий у клиента. Наводка применяется на его смену, а
    // не на смену смещения: к одной и той же строке приводят дважды подряд, и
    // смещение у неё во второй раз то же самое — а навести надо снова. Само
    // смещение на вопрос «просят ли снова» не отвечает вовсе.
    uint64 request = 2;
}

// Полоса прокрутки: геометрия и цвета. Одна на обе оси — вид у них общий, а
// разные значения по осям задать было бы нечем.
message Scrollbar {
    // Ширина дорожки; 0 — умолчание рендерера.
    float width = 1;
    // Ширина бегунка внутри дорожки; 0 — во всю её ширину.
    float scroller_width = 2;
    // Отступ дорожки от края содержимого.
    float margin = 3;
    Background rail = 4;
    Background scroller = 5;
    // Скругление бегунка и дорожки.
    float radius = 6;
}

enum ScrollDirection {
    SCROLL_VERTICAL = 0;
    SCROLL_HORIZONTAL = 1;
    SCROLL_BOTH = 2;
}

// Потолок размера — только у Container: он умеет ограничить кого угодно, и
// один такой способ понятнее, чем свой у каждого носителя детей.
message Column {
    repeated Widget children = 1;
    float spacing = 2;
    Padding padding = 3;
    Alignment align_items = 4;
    Length width = 5;
    Length height = 6;
}

message Row {
    repeated Widget children = 1;
    float spacing = 2;
    Padding padding = 3;
    Alignment align_items = 4;
    Length width = 5;
    Length height = 6;
}

message Text {
    string content = 1;
    float size = 2;
    // Не задан — текст рисуется цветом, который назвал носитель (кнопка,
    // контейнер, подсказка). «Не сказано» значит «как всё вокруг», а не
    // «чёрный»: иначе каждая подпись повторяла бы цвет своей роли.
    optional Color color = 3;
    Alignment horizontal_alignment = 4;
    Alignment vertical_alignment = 5;
    Length width = 6;
    Length height = 7;
    Shaping shaping = 8;
    string font_family = 9;
    // Что делать, когда текст не помещается в отведённую ширину.
    Wrapping wrapping = 10;
    // Насыщенность начертания. Работает, пока в семействе есть такое лицо:
    // синтетического жирного нет, недостающее подменяется ближайшим.
    FontWeight weight = 11;
}

// Начертания, которые различает разметка. Полный набор весов шрифту не нужен:
// подпись бывает обычной, выделенной или заголовочной, а промежуточные веса
// в интерфейсе неотличимы друг от друга.
enum FontWeight {
    WEIGHT_NORMAL = 0;
    WEIGHT_MEDIUM = 1;
    WEIGHT_BOLD = 2;
}

// Сложность разбора строки. Продвинутый шейпинг нужен письменностям с
// лигатурами и переупорядочиванием (арабица, деванагари); латинице и кириллице
// он стоит времени и ничего не даёт.
enum Shaping {
    SHAPE_BASIC = 0;
    SHAPE_ADVANCED = 1;
}

// Умолчание — перенос по словам, как в iced: рвать строку можно только по
// пробелам. В имени файла, пути или ключе пробелов нет, поэтому в отведённую
// ширину такой текст не переносится, а выходит за неё — рамка своего места его
// не удержит. Тексту, который обязан остаться внутри, нужен
// WRAP_WORD_OR_GLYPH: он рвёт по словам, а неделимое слово — по буквам.
//
// NO_WRAP — для того, что обязано остаться одной строкой (заголовок вкладки,
// глиф иконки). Ширину такой текст займёт больше отведённой, и обрежет его
// только ближайший скроллируемый предок.
enum Wrapping {
    WRAP_WORD = 0;
    NO_WRAP = 1;
    WRAP_GLYPH = 2;
    WRAP_WORD_OR_GLYPH = 3;
}

message Border {
    Color color = 1;
    float width = 2;
    // Скругление одно на все четыре угла: рисуется оно расстоянием до
    // скруглённого прямоугольника (см. shaders.wgsl), и радиус там один.
    float radius = 3;
}

message Background {
    oneof type {
        Color color = 1;
        // Gradient gradient = 2; // Future
    }
}

// Тень под виджетом. Нулевое размытие при нулевом смещении — тени нет.
message Shadow {
    Color color = 1;
    float offset_x = 2;
    float offset_y = 3;
    float blur = 4;
}

// Внешний вид виджета в одном из его состояний.
//
// `text_color` не задан — текст внутри рисуется цветом темы: «не сказано» тут
// значит «как обычный текст», а не «чёрный».
message WidgetStyle {
    optional Background background = 1;
    optional Color text_color = 2;
    optional Border border = 3;
    optional Shadow shadow = 4;
}

message TextInput {
    string value = 1;
    string placeholder = 2;
    Handler on_input = 3;
    Handler on_submit = 4;
    Length width = 5;
    Padding padding = 6;
    float size = 7;
    TextInputStyle style = 8;
    string font_family = 9;
}

// Поле ввода в трёх своих состояниях. Фон, рамка и цвет набранного — общий
// `WidgetStyle` (его `text_color` и есть цвет значения); подсказка и выделение
// от состояния не зависят и заданы один раз.
message TextInputStyle {
    WidgetStyle active = 1;
    WidgetStyle hovered = 2;
    WidgetStyle focused = 3;
    Color placeholder = 4;
    Color selection = 5;
}

// Готовая картинка: вписывается в отведённое место с сохранением пропорций,
// на указатель не отзывается и сама по себе не меняется. Область, которую
// владелец перерисовывает каждый кадр, — это `Viewport`, а не это.
message WgpuImage {
    veldmap.core.ResourceHandle handle = 1;
    Length width = 2;
    Length height = 3;
}

// Место в разметке, которое владелец рисует своим рендерером: трёхмерный вид,
// карта, график.
//
// От `WgpuImage` отличается тремя вещами, и все три следуют из одного: у этой
// текстуры нет собственного размера — её размер задаёт разметка.
//   * заполняет отведённое место целиком, а не вписывается в него;
//   * содержимое считается меняющимся каждый кадр, поэтому область
//     перерисовывается, даже когда разметка стоит на месте;
//   * возвращает владельцу указатель и свой размер.
//
// Обратной связи «размер текстуры → раскладка» здесь нет: место области выведено
// из разметки, поэтому ответ владельца на `on_resized` её не двигает, и цикл
// сходится за один шаг.
message Viewport {
    // Что показывать. Не задана — владелец ещё не выделил текстуру; место
    // занимается, но остаётся пустым.
    veldmap.core.ResourceHandle texture = 1;
    Length width = 2;
    Length height = 3;
    // Область получила размер, отличный от прежнего: владельцу пора выделить
    // текстуру под него. Нагрузка события — `ViewportSize`.
    Handler on_resized = 4;
    // Указатель над областью. Нагрузка — `PointerEvent`.
    Handler on_pointer = 5;
}

// Размер области в пикселях её текстуры. Умножать на масштаб интерфейса
// владельцу не нужно: он живёт у рендерера, и знать его на той стороне неоткуда.
message ViewportSize {
    uint32 width = 1;
    uint32 height = 2;
}

enum PointerAction {
    POINTER_MOVED = 0;
    POINTER_PRESSED = 1;
    POINTER_RELEASED = 2;
    POINTER_SCROLLED = 3;
    // Курсор ушёл с области. Приходит один раз и только когда кнопка не
    // удерживается: удержание тянет за собой движения и за краем области.
    POINTER_LEFT = 4;
}

// Указатель над областью.
//
// Координаты — в пикселях текстуры области, от её левого верхнего угла: те же
// единицы, в которых приехал `ViewportSize`, так что `x / width` — доля, и
// пересчитывать масштаб не приходится. Во время удержания кнопки они выходят
// за границы области (в том числе становятся отрицательными): перетаскивание
// не рвётся о край, и решать, что делать за ним, владельцу.
message PointerEvent {
    PointerAction action = 1;
    float x = 2;
    float y = 3;
    // Кнопка у PRESSED и RELEASED: 1 — левая, 2 — правая, 3 — средняя.
    uint32 button = 4;
    // Прокрутка у SCROLLED, в щелчках колеса: `1.0` — один щелчок. Приходит
    // сглаженной, вместе с инерцией — тем же потоком, которым живут списки, —
    // поэтому щелчок приезжает долями за несколько кадров, а единицу составит
    // их сумма. В щелчках, а не в пикселях, потому что пиксель здесь означал
    // бы ровно то, во что его переводит сглаживание ui-service, и всякий
    // получатель хранил бы у себя копию этого числа.
    float scroll_x = 5;
    float scroll_y = 6;
}

message Space {
    Length width = 1;
    Length height = 2;
}

// Коробка: отступ, размер, выравнивание содержимого, фон и рамка. Она же
// кнопка — стоит задать `interaction`.
//
// Содержимое коробка обрезает по себе, и рычага «не обрезать» у неё нет
// намеренно: коробка — это граница показа, а не только место в раскладке. В
// узком окне родитель ужимает её до отведённого, а содержимое своей ширины не
// теряет (см. `Wrapping`), и без обрезки подпись рисуется поверх соседа и за
// краем половины. Рисовать поверх соседей умеет `Popover` — тем и отличается.
message Container {
    Widget child = 1;
    Padding padding = 2;
    Length width = 3;
    Length height = 4;
    Length max_width = 5;
    Length max_height = 6;
    Alignment align_x = 7;
    Alignment align_y = 8;
    // Вид в покое. У ненажимаемой коробки он единственный: реагировать ей не на
    // что, и остальные состояния ей назвать нечем.
    WidgetStyle style = 9;
    // Задан — коробка нажимается.
    Interaction interaction = 11;
    // Задан — коробку можно взять мышью и перенести.
    Drag drag = 12;
    // Задан — в коробку можно бросить перенесённое.
    Drop drop = 13;
}

// То, что берут мышью и несут: вкладка, строка, слой.
//
// Свойство коробки, а не свой виджет — по той же причине, что и нажимаемость:
// переносят обычно то, что уже нарисовано коробкой, и своему носителю пришлось
// бы повторить её отступ, размер, фон и обрезку.
message Drag {
    // Чем владелец разметки называет переносимое. Смысла её сервис не знает:
    // он вернёт эту строку той зоне, в которую её бросят.
    //
    // Пусто — брать нечего: коробка остаётся обычной.
    string payload = 1;
}

// Место, куда перенесённое можно положить.
message Drop {
    // Бросок. Нагрузка события — `DropEvent`: что принесли и в какой край зоны
    // попали; `key` — чем разметка назвала саму зону.
    Handler on_drop = 1;
    // Различать ли края зоны. Край значит «положить рядом, поделив место»,
    // середина — «положить сюда»; зоне, у которой делить нечего (полоса
    // вкладок), края не нужны, и обещать их было бы враньём.
    bool edges = 2;
    // Чем закрашивается место, куда упадёт. Цвет называет владелец разметки:
    // палитра его, а сервис не знает, что у него значит «подсвечено».
    Color highlight = 3;
}

// Что и куда бросили.
message DropEvent {
    // Нагрузка взятого — та, которой её назвал `Drag.payload`.
    string payload = 1;
    DropEdge edge = 2;
}

// В какую часть зоны попал курсор в миг броска.
enum DropEdge {
    DROP_CENTER = 0;
    DROP_LEFT = 1;
    DROP_RIGHT = 2;
    DROP_ABOVE = 3;
    DROP_BELOW = 4;
}

// Отклик коробки на курсор: то, чем кнопка отличается от простой коробки.
//
// Отдельного виджета-кнопки в протоколе нет намеренно. Кнопка — это та же
// коробка: отступ, размер, выравнивание содержимого, обрезка, фон, рамка. Свой
// носитель всех этих полей рано или поздно расходится с контейнером и обедняет
// себя — так и было: кнопка не умела выравнивать содержимое, и глиф в кнопке
// фиксированного размера прижимался к её углу, а каждый call-сайт обходил это
// лишней обёрткой (и половина из них забывала).
//
// Виды состояний вырождаются к покою, а не к чёрному прямоугольнику: почти
// всякой кнопке хватает двух лиц, и остальные два не нужно повторять третий
// раз, чтобы они не разъехались.
message Interaction {
    // Нет — кнопка выключена: рисуется `disabled`, нажатие в неё не идёт.
    Handler on_press = 1;
    // Под курсором; не задан — как в покое (`Container.style`).
    WidgetStyle hovered = 2;
    // Под нажатой кнопкой мыши; не задан — как под курсором.
    WidgetStyle pressed = 3;
    // Выключенная; не задан — как в покое.
    WidgetStyle disabled = 4;
}

message Padding {
    float top = 1;
    float right = 2;
    float bottom = 3;
    float left = 4;
}

message Length {
    oneof value {
        float fixed = 1;
        bool shrink = 2;
        bool fill = 3;
        float portion = 4;
    }
}

enum Alignment {
    START = 0;
    CENTER = 1;
    END = 2;
}

message Color {
    float r = 1;
    float g = 2;
    float b = 3;
    float a = 4;
}

// Сообщения ui-service.
//
// Имени отправителя ни в одном из них нет: его штампует хост, и модуль читает
// достоверное через veldsdk::event_publisher(). Клиента сервис узнаёт только
// так — по нему же он и адресует события виджетов обратно.

// Fire-and-forget: модуль шлёт свой текущий view целиком, а когда его рисовать,
// решает рендерер.
message SetViewRequest {
    // Тег 1 занимал plugin_id; отправителя теперь штампует хост, а номер не
    // занимается заново, чтобы старый конверт не разобрался во что-то другое.
    reserved 1;
    Layout layout = 2;
}

// Сработавший виджет, как его объявили в разметке (см. Handler). Едет обратно
// автору разметки адресным топиком, поэтому получателя в себе не несёт.
message UiEventResponse {
    // Тег 1 занимал plugin_id — как у SetViewRequest: адресата несёт конверт.
    reserved 1;
    string method = 2;
    // Чем разметка назвала сам виджет — `Handler.key`, отданный эхом. Пусто —
    // виджет себя не называл: адресата у события нет, кроме имени метода.
    string key = 6;
    // Нагрузка события. Обычно её назвала сама разметка (`Handler.value`), но у
    // виджетов, чьё событие несёт данные, её подставляет рендерер: набранный
    // текст у поля ввода, указатель и размер у области.
    //
    // Именно oneof, а не набор полей: нагрузка у события ровно одна, и набором
    // полей это выражалось бы состоянием «указатель и размер сразу», которого
    // не бывает.
    oneof payload {
        string value = 3;
        PointerEvent pointer = 4;
        ViewportSize size = 5;
        // 6 занимает `key` выше — он не часть нагрузки.
        DropEvent drop = 7;
    }
}
