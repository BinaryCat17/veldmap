package: veld-ui-service
language: rust
rust:
  sdk_features: ["compute", "app"]
  dependencies:
    prost: "0.14"
    serde:
      version: "1.0"
      features: ["derive"]
    serde_json: "1.0"
    log: "0.4"
    anyhow: "1.0"
    iced_runtime:
      version: "0.13"
      default-features: false
    iced_graphics:
      version: "0.13"
      default-features: false
    iced_core:
      version: "0.13"
      default-features: false
    iced_widget:
      version: "0.13"
      default-features: false
    iced_renderer:
      version: "0.13"
      default-features: false
      features: ["tiny-skia"]
    cosmic-text: "0.12"
