name: ui-service
version: 0.1.0

interface:
  inputs:
    # Разметка целиком: чего не прислали, того на экране нет. Пересобирает её
    # клиент на всякое событие, а меняется она заметно реже — отсюда
    # `snapshot`. Отпечаток при этом свой у каждого клиента: помнит его стаб в
    # его собственном крейте.
    on_set_view:
      type: ui_service/SetViewRequest
      snapshot: true
    # Делегирование места под рендер — платформенный обряд, а не наш: тем же
    # сообщением его получает любой чужой рендерер (см. core.SurfaceDelegated).
    on_set_surface:
      type: core/SurfaceDelegated
  outputs:
    # Виджет-событие владельцу окна: адресат — плагин, назначаемый в
    # рантайме (см. handlers.rs::dispatch_event), поэтому targeted вместо
    # статичного топика на стороне потребителя.
    on_ui_event:
      type: module/UiEventResponse
      targeted: true

# Платформенный контракт: хост публикует ввод и кадровые тики в app/on_ui_event.
# События адресуются plugin_id в данных; события модулей без делегированной
# поверхности игнорируются.
dependencies:
  app:
    # Обход разметки: платформа спрашивает, где на экране элемент, названный
    # не пикселями, и ответ ждёт она же (см. locate.rs). Отвечает тот, кому
    # делегирована поверхность окна, — то есть мы.
    subs: [on_ui_event, on_locate_widget]
    calls: [on_widget_located]
