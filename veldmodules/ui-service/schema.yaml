name: ui-service
version: 0.1.0

interface:
  inputs:
    on_set_view:
      type: ui_service/SetViewRequest
    # Делегирование места под рендер — платформенный обряд, а не наш: тем же
    # сообщением его получает любой чужой рендерер (см. core.SurfaceDelegated).
    on_set_surface:
      type: core/SurfaceDelegated
  outputs:
    # Виджет-событие владельцу окна: адресат — плагин, назначаемый в
    # рантайме (см. handlers.rs::dispatch_event), поэтому targeted вместо
    # статичного топика на стороне потребителя.
    on_ui_event:
      type: module/UiEventResponse
      targeted: true

# Платформенный контракт: хост публикует ввод и кадровые тики в app/on_ui_event.
# События адресуются plugin_id в данных; события модулей без делегированной
# поверхности игнорируются.
dependencies:
  app:
    subs: [on_ui_event]
