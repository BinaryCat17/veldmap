name: globe
version: 0.1.0

interface:
  inputs:
    # Место под вид: владелец разметки выделил текстуру, выдал нам право
    # записи и назвал её размер. Обряд общий с поверхностью окна — им же
    # ui-service получает своё (см. core.SurfaceDelegated).
    on_set_surface:
      type: core/SurfaceDelegated
    # Куда двигать камеру. Ни кнопок, ни пикселей: чем именно пользователь это
    # сделал, знает разметка, сюда приезжает уже намерение.
    on_camera:
      type: module/CameraCommand
    # Что очертить на поверхности. Набор целиком, а не правка к нему.
    on_outlines:
      type: module/Outlines
    # Что наложить на поверхность. Тоже набор целиком; ресурсы растров
    # приходят во владение, тайлы модуль добывает конвейером сам.
    on_overlay:
      type: module/Overlays
    # Что под указателем. Обратный ход проекции: считать его может только тот,
    # у кого камера.
    on_probe:
      type: module/Probe

  outputs:
    on_probed:
      type: module/Probed
      replies_to: on_probe
    # Ход добычи тайлов наложений: набор целиком и только когда он изменился.
    # Не ответ на просьбу — сама просьба («наложи») уже отвечена тем, что
    # снимок на шаре; это то, чего по шару не видно: сколько ему ещё ехать.
    # Своей строки состояния у шара нет, а список наложений есть у того, кто
    # их прислал, — там и место такой подписи.
    on_overlay_progress:
      type: module/OverlaysProgress

dependencies:
  # Кадровый тик — единственный повод рисовать: команды камеры и контуры лишь
  # меняют состояние, а кадр пишется на тике. Тик при этом не значит «рисовать
  # всегда»: кадр из того же состояния, что и прошлый, пропускается —
  # сравнением с нарисованным, а не флагом «изменилось» (см. `drawn` в
  # module.rs: флаг пришлось бы ставить в каждом месте, где что-то меняется,
  # и однажды не поставить).
  app:
    subs: [on_ui_event]
  # Тайлы наложений — тот же конвейер, что у канвы превью: описание и
  # производство у тайлера, готовое у кэша. Убиваются здесь только свои
  # produce — устаревший уровень и снятое наложение (как в image-view).
  image-tiler:
    subs: [on_described, on_produced, on_produce_progress, on_produce_done]
    calls: [on_describe, on_produce]
  tile-cache:
    subs: [on_tile, on_query_done]
    calls: [on_query]
