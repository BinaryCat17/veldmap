name: globe
version: 0.1.0

interface:
  inputs:
    # Место под вид: владелец разметки выделил текстуру, выдал нам право
    # записи и назвал её размер. Обряд общий с поверхностью окна — им же
    # ui-service получает своё (см. core.SurfaceDelegated).
    on_set_surface:
      type: core/SurfaceDelegated
    # Куда двигать камеру. Ни кнопок, ни пикселей: чем именно пользователь это
    # сделал, знает разметка, сюда приезжает уже намерение.
    on_camera:
      type: module/CameraCommand
    # Что очертить на поверхности. Набор целиком, а не правка к нему.
    on_outlines:
      type: module/Outlines
    # Что под указателем. Обратный ход проекции: считать его может только тот,
    # у кого камера.
    on_probe:
      type: module/Probe

  outputs:
    on_probed:
      type: module/Probed
      replies_to: on_probe

dependencies:
  # Кадровый тик — им и рисуем. Не по приходу команд: тогда пришлось бы
  # заводить признак «с прошлого кадра что-то изменилось», а он ровно тот
  # источник несвежести, от которого потом не отличить «не менялось» от
  # «забыли отметить». Место под нас объявлено живым (Viewport), то есть
  # показывается каждый кадр, — значит и рисовать честно каждый кадр.
  app:
    subs: [on_ui_event]
