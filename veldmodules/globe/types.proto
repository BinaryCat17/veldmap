syntax = "proto3";

package veldmap.globe;

// Точка на поверхности: WGS84, градусы — те же, в которых модуль считает всё
// остальное (см. geodesy.rs). Общая для всех сообщений здесь: место на Земле
// называется одинаково, о чём бы ни шла речь — о контуре снимка или о том,
// куда смотреть.
message GeoPoint {
  double lat = 1;
  double lon = 2;
}

// --- GLOBE ---
// Вид на шар: камера ходит по орбите вокруг центра, шар неподвижен.
//
// О разметке, курсоре и кнопках мыши модуль не знает ничего. Что именно
// пользователь сделал, чтобы получилось вращение, — вопрос интерфейса, и
// отвечает на него автор разметки; сюда приезжает уже намерение. Иначе
// решение «левая кнопка вращает» пришлось бы принимать здесь, где не видно ни
// кнопок, ни того, что ещё в это время на экране.

// Одно движение камеры.
message CameraCommand {
  oneof command {
    Orbit orbit = 1;
    Zoom zoom = 2;
    Focus focus = 3;
  }
}

// Повернуть шар под камерой. Доли **высоты** области, а не пиксели: жест обязан
// ощущаться одинаково в окне любого размера, а размер области знает тот, кто её
// выделил. Высотой меряются обе оси, включая горизонтальную: угол обзора задан
// по вертикали, и одна и та же доля высоты означает один и тот же угол, куда бы
// она ни вела. Положительное `dx` — вправо, `dy` — вниз.
message Orbit {
  float dx = 1;
  float dy = 2;
}

// Приблизиться или отдалиться. Положительное — ближе; единица — один щелчок
// колеса, то есть шаг, а не расстояние: во что он превращается, знает камера.
message Zoom {
  float delta = 1;
}

// Навести камеру на место и показать вокруг него круг такого углового радиуса.
//
// Радиусом, а не высотой: сколько нужно отойти, чтобы заданное поместилось в
// кадр, зависит от угла обзора и формы Земли, а они есть только у камеры.
// Заказчик знает другое — что именно он хочет увидеть целиком.
message Focus {
  GeoPoint at = 1;
  // Градусы дуги: 1° — около 111 км по поверхности.
  double radius_deg = 2;
}

// --- УКАЗАНИЕ ---
//
// Обратный ход проекции: доли области — обратно в место на Земле. Спрашивает
// тот, кто ловит указатель, потому что ответить может только тот, у кого
// камера: одна и та же точка кадра означает разные места на разной высоте.

// Куда смотрит точка кадра. Доли области, как у Orbit; (0, 0) — левый верхний
// угол.
message Probe {
  float x = 1;
  float y = 2;
}

// Что под ней. Пустое `at` — луч прошёл мимо Земли: за краем силуэта её нет, и
// это такой же ответ, как всякий другой.
message Probed {
  GeoPoint at = 1;
}

// --- КОНТУРЫ ---
//
// Ломаные по поверхности: контуры найденных снимков, а со временем и берега.
// Что именно они очерчивают, модулю неизвестно и не нужно — как неизвестно ему
// и то, каким жестом двигают камеру.
//
// Цвета здесь нет намеренно: как выглядит контур — решение того, кто рисует,
// наравне с цветом Земли и сетки. Иначе палитра приложения оказалась бы
// размазана по двум модулям, а согласовывать её было бы нечем.

// Замкнутая ломаная. Последняя точка соединяется с первой сама — дублировать её
// не нужно, но и не вредно.
//
// Точки — вершины, а не готовая линия: между соседними модуль вставляет свои,
// чтобы ребро легло на поверхность, а не срезало её хордой.
message Outline {
  repeated GeoPoint points = 1;
  // Выделен ли он. Что это значит — знает приславший; как это выглядит —
  // рисующий. Признак у контура, а не номер выделенного в наборе: набор
  // приходит целиком, и разъехаться признаку не с чем.
  bool selected = 2;
}

// Полная замена набора: что не прислали — того больше нет.
//
// Не досылка и не удаление по одному именно поэтому: набор, собираемый
// правками, живёт у обеих сторон сразу, и разойтись им однажды никто не
// помешает. Присылать целиком дороже ровно настолько, насколько велик набор, а
// он размером с экран списка.
message Outlines {
  repeated Outline outlines = 1;
}
