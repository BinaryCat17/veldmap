syntax = "proto3";

package veldmap.globe;

import "core.proto";

// Точка на поверхности: WGS84, градусы — те же, в которых модуль считает всё
// остальное (см. geodesy.rs). Общая для всех сообщений здесь: место на Земле
// называется одинаково, о чём бы ни шла речь — о контуре снимка или о том,
// куда смотреть.
message GeoPoint {
  double lat = 1;
  double lon = 2;
}

// --- GLOBE ---
// Вид на шар: камера ходит по орбите вокруг центра, шар неподвижен.
//
// О разметке, курсоре и кнопках мыши модуль не знает ничего. Что именно
// пользователь сделал, чтобы получилось вращение, — вопрос интерфейса, и
// отвечает на него автор разметки; сюда приезжает уже намерение. Иначе
// решение «левая кнопка вращает» пришлось бы принимать здесь, где не видно ни
// кнопок, ни того, что ещё в это время на экране.

// Одно движение камеры.
message CameraCommand {
  oneof command {
    Orbit orbit = 1;
    Zoom zoom = 2;
    Focus focus = 3;
  }
}

// Повернуть шар под камерой. Доли **высоты** области, а не пиксели: жест обязан
// ощущаться одинаково в окне любого размера, а размер области знает тот, кто её
// выделил. Высотой меряются обе оси, включая горизонтальную: угол обзора задан
// по вертикали, и одна и та же доля высоты означает один и тот же угол, куда бы
// она ни вела. Положительное `dx` — вправо, `dy` — вниз.
message Orbit {
  float dx = 1;
  float dy = 2;
}

// Приблизиться или отдалиться. Положительное — ближе; единица — один щелчок
// колеса, то есть шаг, а не расстояние: во что он превращается, знает камера.
//
// Место под удерживаемой точкой кадра остаётся на месте — приближаются к тому,
// на что смотрят, а не к середине области. Задаётся точка смещением от середины
// кадра в долях **высоты** области, обе оси; нули — приближение в середину.
// Высотой, а не своей стороной у каждой оси, — по той же причине, что и у
// `Orbit`: угол обзора задан по вертикали, и пропорции области в счёт не
// входят. У `Probe` рядом единицы другие — доли области от угла, — и потому
// поля здесь названы иначе: одно имя при двух мерах ошиблось бы молча.
message Zoom {
  float delta = 1;
  float hold_x = 2;
  float hold_y = 3;
}

// Навести камеру на место и показать вокруг него круг такого углового радиуса.
//
// Радиусом, а не высотой: сколько нужно отойти, чтобы заданное поместилось в
// кадр, зависит от угла обзора и формы Земли, а они есть только у камеры.
// Заказчик знает другое — что именно он хочет увидеть целиком.
message Focus {
  GeoPoint at = 1;
  // Градусы дуги: 1° — около 111 км по поверхности.
  double radius_deg = 2;
}

// --- УКАЗАНИЕ ---
//
// Обратный ход проекции: доли области — обратно в место на Земле. Спрашивает
// тот, кто ловит указатель, потому что ответить может только тот, у кого
// камера: одна и та же точка кадра означает разные места на разной высоте.

// Куда смотрит точка кадра. Доли области — каждая ось по своей стороне, счёт от
// угла: (0, 0) — левый верхний. Не как у `Orbit` и `Zoom`, где обе оси меряются
// высотой от середины кадра: там мерой служит угол обзора, а здесь — сама
// область, потому что указатель приходит её пикселями.
message Probe {
  float x = 1;
  float y = 2;
}

// Что под ней. Пустое `at` — луч прошёл мимо Земли: за краем силуэта её нет, и
// это такой же ответ, как всякий другой. Силуэт при этом чуть шире видимого:
// спрашивают не про сам эллипсоид, а про поверхность, на которой нарисовано, —
// и у самой кромки полоска в треть градуса отвечает местом там, где на экране
// уже космос.
message Probed {
  GeoPoint at = 1;
}

// --- КОНТУРЫ ---
//
// Ломаные по поверхности: контуры найденных снимков, а со временем и берега.
// Что именно они очерчивают, модулю неизвестно и не нужно — как неизвестно ему
// и то, каким жестом двигают камеру.
//
// Цвета здесь нет намеренно: как выглядит контур — решение того, кто рисует,
// наравне с цветом Земли и сетки. Иначе палитра приложения оказалась бы
// размазана по двум модулям, а согласовывать её было бы нечем.

// Чем контур является прямо сейчас. Перечислением, а не набором булевых:
// «выделен» и «снимок ещё едет» — не два независимых свойства, а один вопрос,
// и парой флагов у него завелось бы четвёртое сочетание, не значащее ничего.
// Что каждое из положений значит — знает приславший; как оно выглядит —
// рисующий.
enum OutlineStyle {
  // Просто очерчен.
  OUTLINE_PLAIN = 0;
  // Выделен: тот единственный, о котором сейчас идёт речь.
  OUTLINE_SELECTED = 1;
  // Место снимка, который на шар только едет: картинки ещё нет, а показать,
  // куда смотреть, надо уже сейчас.
  OUTLINE_PENDING = 2;
}

// Замкнутая ломаная. Последняя точка соединяется с первой сама — дублировать её
// не нужно, но и не вредно.
//
// Точки — вершины, а не готовая линия: между соседними модуль вставляет свои,
// чтобы ребро легло на поверхность, а не срезало её хордой.
message Outline {
  repeated GeoPoint points = 1;
  // Признак у контура, а не номер выделенного в наборе: набор приходит
  // целиком, и разъехаться признаку не с чем.
  OutlineStyle style = 2;
}

// Полная замена набора: что не прислали — того больше нет.
//
// Не досылка и не удаление по одному именно поэтому: набор, собираемый
// правками, живёт у обеих сторон сразу, и разойтись им однажды никто не
// помешает. Присылать целиком дороже ровно настолько, насколько велик набор, а
// он размером с экран списка.
message Outlines {
  repeated Outline outlines = 1;
}

// --- Наложения ---
// Снимки, натянутые на поверхность. Кто и что накладывает, модулю неизвестно:
// приезжает ключ, привязка и открытые ресурсы растров; тайлы модуль добывает
// сам — тем же конвейером, что канва превью (image-tiler + tile-cache).

// Рамка растра в метрах зоны UTM. y1 — северный край: строки растра идут с
// севера на юг. В градусы её переводит проекция модуля (projection.rs).
message UtmFrame {
  uint32 zone = 1;
  bool south = 2;
  double x0 = 3;
  double y0 = 4;
  double x1 = 5;
  double y1 = 6;
}

// Роль растра в наложении: с превью картинка начинается, к подробному идут
// на приближении.
enum OverlayRole {
  OVERLAY_PREVIEW = 0;
  OVERLAY_DETAILED = 1;
}

// Один растр наложения. Владение ресурсом переходит сюда вместе с сообщением:
// показ переживает обработчик приславшего.
message OverlayRaster {
  veldmap.core.ResourceHandle resource = 1;
  OverlayRole role = 2;
  // Ресурс с координатами пикселей растра, когда они лежат отдельно от него
  // (Sentinel-3). Приходит во владение вместе с самим растром и живёт столько
  // же: спрашивают его один раз, при описании.
  optional veldmap.core.ResourceHandle geolocation = 3;
  // Занятый номер.
  reserved 4;
  // Номер растра в ответе провайдера у приславшего. Глобус имён не знает и
  // возвращает номер в `OverlayProgress.detailed`, чтобы приславший назвал
  // файл, который лёг подробным, — своим именем, а не ролью.
  uint32 ordinal = 5;
  // Какую величину этого файла показать (`DescribeRequest.variable`); пусто —
  // выбор тайлера. Тот же набор с другой величиной у лежащего растра — не
  // новое наложение: растр описывается заново с ней, ресурсы прежние.
  string variable = 6;
}

// Одно наложение: привязка, растры и то, как его показывать. Рамка UTM —
// точная привязка; без неё растр натягивается на четырёхугольник футпринта по
// обходу вершин — это заявленная аппроксимация для превью, у которых точной
// привязки нет.
message Overlay {
  // Ключ наложения у приславшего; по нему же наложение и заменяется.
  string key = 1;
  // Чем подписать наложение в логах: у ресурсов имён нет.
  string label = 2;
  optional UtmFrame utm = 3;
  // Четыре вершины по обходу растра: верхний левый, верхний правый, нижний
  // правый, нижний левый его углы.
  repeated GeoPoint quad = 4;
  // Квад — не углы контура, а его габарит: сам контур сложнее
  // четырёхугольника (полоса съёмки очерчена десятками вершин). Натягивать
  // растр на габарит нельзя — снимок лёг бы неверно, — и глобус этого не
  // делает: место он держит, пока привязку не принесёт сам растр решёткой
  // опорных точек. Не принёс — наложение не состоялось, и глобус скажет об
  // этом ошибкой слоя.
  bool rough = 8;
  repeated OverlayRaster rasters = 5;
  // Прозрачность слоя, 0..1. Именно optional: у proto3 умолчание числа —
  // ноль, и «не сказали» означало бы «невидимо», то есть отправитель, которому
  // до прозрачности нет дела, гасил бы снимок молчанием.
  optional float opacity = 6;
  // Слой скрыт: не рисуется и тайлов под себя не просит, но остаётся в наборе
  // вместе со своими ресурсами. Тем и отличается от снятия: вернуть его на
  // место — это ничего не открывать заново.
  bool hidden = 7;
}

// Полная замена набора наложений — тем же правилом, что Outlines: что не
// прислали, того больше нет, и его ресурсы освобождаются здесь. Ресурсы уже
// присланных не присылаются заново: наложение с тем же ключом и теми же
// ресурсами остаётся как есть, а его прозрачность и скрытость берутся из
// нового сообщения — иначе поменять их можно было бы, только переоткрыв
// растры.
//
// Порядок элементов — порядок слоёв снизу вверх: последний рисуется поверх
// остальных. Он берётся из каждого сообщения заново, поэтому перестановка в
// списке у отправителя переставляет и слои.
message Overlays {
  repeated Overlay overlays = 1;
}

// Ход добычи тайлов одного наложения. По самому шару его не видно: снимок либо
// уже нарисован, либо ещё нет, — а сколько ему осталось, знает только тот, кто
// его добывает, и ждать бывает десятками секунд.
message OverlayProgress {
  // Ключ наложения — тот же, каким его прислали.
  string key = 1;
  // Ячеек последнего оформленного заказа добыто и сколько их в нём. Заказ, а
  // не то, что видно сейчас: видимое есть функция камеры, и счёт, выведенный
  // из него, менялся бы на каждом кадре жеста, ничего при этом не сообщая.
  // Ноль из нуля — спрашивать было нечего: ступень закрыта либо растр ещё
  // описывают.
  uint32 ready = 2;
  uint32 total = 3;
  // Работа не кончилась. Отдельно от счёта, потому что «заказ доведён» и
  // «больше ничего не едет» — разные вещи: за добытой ступенью идёт следующая.
  bool working = 4;
  // Доля пути слоя, 0..1 — то, чем рисуют полосу.
  //
  // Считается ступенями пирамиды, а не ячейками кадра: ступеней у слоя
  // столько, сколько их есть (от вершины до уровня, на котором картинка станет
  // резкой), и каждая закрывается один раз. Отсюда и главное её свойство —
  // панорама её не двигает. Приближение двигает: подробнее нужный уровень
  // значит длиннее путь, и это правда о работе, а не дрожание.
  //
  // Внутри ступени доля берётся по большему из двух: сколько её ячеек уже
  // дома и сколько байт источника прочитал идущий проход. Второе нужно
  // потому, что ступень бывает в один тайл, а чтобы отдать его,
  // последовательный источник (PNG, полосный TIFF, JP2) читается целиком —
  // минуту и дольше. Без байтов полоса всё это время честно стои́т на нуле, а
  // стоящая полоса неотличима от сломанной.
  float share = 5;
  // Слою нечем лечь, и это не изменится: привязки нет, растры не открылись,
  // ни один из них не описался. Отдельно от `working`, потому что «сейчас не
  // работает» и «не заработает никогда» — разные ответы, а по молчанию их не
  // различить. Пусто — сказать нечего.
  //
  // Заметить это может только тот, кто принимает наложение: у него и растры, и
  // привязка. Убрать его — дело приславшего: набор наложений принадлежит ему.
  string error = 6;
  // Какая ступень пирамиды набирается (с нуля) и сколько их в пути до резкой
  // картинки. Это ровно то, что отсчитывает `share`, — и без них полоса
  // остаётся долей без единицы измерения: смотрящий видит, что она сдвинулась,
  // и не может узнать, сдвинулась ли она на ступень или на четверть тайла.
  // Нули — считать не по чему: слой скрыт, места под кадр нет, растр ещё
  // описывают.
  uint32 step = 7;
  uint32 steps = 8;
  // Слою неполно, но он жив: один из его растров не описался, а второй лёг.
  // Отдельно от `error` по тому же правилу, по какому у канвы разведены
  // `error` и `trouble`: «смотреть не на что» стирает показ и снимает слой,
  // а «резче не станет» — подпись рядом с тем, что уже видно. Молчать здесь
  // нельзя: приблизившийся ждёт резкости, которая никогда не придёт.
  string trouble = 9;
  // Слой уже принят, а нарисовать по нему пока нечего: ни один растр не
  // описан. Ответить на это может только принимающий — снаружи «лежит на
  // шаре» и «виден на шаре» неразличимы, а между ними у растра по сети
  // проходят десятки секунд.
  //
  // Отдельно от доли, а не выведено из неё: доля бывает нулевой и у честно
  // начатой ступени, а «сколько ступеней» у пирамиды в один уровень равно
  // нулю и тогда, когда картинка давно на месте. Приславший рисует по этому
  // признаку и полосу без доли, и место снимка на шаре — единственное, что
  // он вообще может показать за эти секунды.
  bool blank = 10;
  // Байты источника, прочитанные идущим проходом, — единственное, что о работе
  // можно сказать, пока ступень стои́т на одной ячейке: чтобы отдать её,
  // последовательный источник читается целиком, и длится это минуту.
  //
  // Того самого растра, чьими числами посчитаны `ready`, `step` и `steps`:
  // растров у слоя бывает два, и байты одного рядом со ступенями другого
  // сложились бы в подпись о двух разных пирамидах.
  //
  // Нулевой знаменатель значит «мерить нечем», а не «ноль байт», и поводов у
  // него четыре: прохода нет; проход чужой (его корреляции у нас нет, и байты
  // до нас не доезжают); источник с произвольным доступом, у которого счётчик
  // прочитанного — водяной знак головы чтения; байты дошли до знаменателя ещё
  // до прохода, потому что файл прочитан разбором целиком, а впереди
  // декодирование. Разбирает эти поводы не глобус, а общее правило пирамиды
  // (`tiles::inside`) — то же самое, которым считается доля, и разойтись
  // числам в подписи с длиной полосы под ними негде.
  uint64 pass_read = 11;
  uint64 pass_total = 12;
  // Номер (`OverlayRaster.ordinal`) растра, лежащего подробным сейчас: у
  // подробного бывают запасные, и после отказа одного на его месте другой
  // файл. Пусто — подробного растра у слоя нет.
  optional uint32 detailed = 13;
  // Та часть `trouble`, что сказана о подробном растре — его отказ и предел
  // детали, когда деталь решает он; в `trouble` её нет. Врозь, чтобы
  // приславший поставил имя файла (`detailed`) ровно перед словами о нём, а
  // не перед пределом превью или отказом привязки. Пусто — о подробном
  // сказать нечего.
  string detailed_trouble = 14;
  // Какая величина лежащего подробным файла показана (из описания тайлера,
  // `Described.variable`): выбор тайлера либо названная приславшим
  // (`OverlayRaster.variable`). Пусто — подробного нет, он не описан или
  // величина у него одна и без имени (снимок).
  optional Variable detailed_variable = 15;
  // Все величины лежащего подробным файла, из каких выбирают
  // (`Described.variables`), — от последнего описания, которое их назвало:
  // отказавшее названной величине списка не несёт, а выбрать другую нужно
  // как раз тогда. Пусто — подробного нет или он ещё не описывался.
  repeated Variable detailed_variables = 16;
}

// Величина файла многих величин — как в файле и как файл назвал её словами; то
// же, что `Described.variable` тайлера.
message Variable {
  // Путь внутри файла (`/PRODUCT/carbonmonoxide_total_column`).
  string path = 1;
  // `long_name` либо `standard_name`; пусто — файл не назвал.
  string said = 2;
  // `units`, как записано в файле; пусто — не записано.
  string units = 3;
}

// Набор целиком — тем же правилом, что Overlays: о чьём ключе не сказано, у
// того и не добывают ничего.
message OverlaysProgress {
  repeated OverlayProgress overlays = 1;
}
