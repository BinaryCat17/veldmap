package: veldmap-globe
language: rust
rust:
  dependencies:
    prost: "0.14"
    serde:
      version: "1.0"
      features: ["derive"]
    serde_json: "1.0"
    anyhow: "1.0"
    log: "0.4"
    # Векторы и матрицы: своя покомпонентная арифметика по индексам 0/1/2
    # ошибку в индексе не ловит — поворот вокруг перепутанной оси остаётся
    # поворотом, и тесты на ортонормальность его пропускают.
    glam: "0.25"

  # geodesy.rs включён и сюда, и в wrap-крейт (см. wraps/rust/src/wrap.rs),
  # поэтому библиотека нужна обоим и одной версии.
  wrap_dependencies:
    glam: "0.25"
