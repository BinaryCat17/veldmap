[build]
rustflags = ["-Zthreads=16"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-Zthreads=16"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

[profile.release]
opt-level = 3
lto = false         # Отключаем для скорости линковки
codegen-units = 256 # Максимальный параллелизм для LLVM
panic = "abort"
debug = false

[profile.release.package.veldmap-host-gui]
opt-level = 2 # Собираем Хост чуть быстрее
