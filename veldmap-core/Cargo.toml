[package]
name = "veldmap-core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
anyhow = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
glam = { version = "0.29.0", features = ["bytemuck"] }
uniffi = { version = "0.28", features = ["tokio"] }
thiserror = "1.0"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
