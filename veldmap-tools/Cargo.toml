[package]
name = "veldmap-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
veldmap-core = { path = "../veldmap-core" }
veldmap-data-provider = { path = "../veldmap-data-provider" }
veldmap-geo-math = { path = "../veldmap-geo-math" }

tokio = { version = "1.37", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
indicatif = "0.17"
tiff = "0.9"
image = "0.25"
directories = "5.0"
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
urlencoding = "2.1"
iced = { version = "0.13", default-features = false, features = ["tokio", "image", "wgpu", "tiny-skia"] }
log = "0.4"
fern = "0.6"
chrono = "0.4"
libc = "0.2"
async-stream = "0.3"

aws-config = "1.1"
aws-sdk-s3 = "1.14"
