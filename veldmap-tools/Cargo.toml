[package]
name = "veldmap-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["stream", "rustls-tls"] }
futures-util = "0.3"
indicatif = "0.17" # Прогресс-бары
tiff = "0.9"
image = "0.25"
directories = "5.0"
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"

# Для работы с S3 (Copernicus)

aws-config = "1.1"

aws-sdk-s3 = "1.14"



veldmap-geo-math = { path = "../veldmap-geo-math" }
