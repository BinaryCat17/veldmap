package: veld-ui-service
language: rust
rust:
  dependencies:
    prost: '"0.14"'
    serde: '{ version = "1.0", features = ["derive"] }'
    serde_json: '"1.0"'
    log: '"0.4"'
    anyhow: '"1.0"'
    iced_runtime: '{ version = "0.13" }'
    iced_graphics: '{ version = "0.13" }'
    iced_core: '{ version = "0.13" }'
    iced_widget: '{ version = "0.13", default-features = false }'
    iced_renderer: '{ version = "0.13", features = ["tiny-skia"] }'
    cosmic-text: '"0.12"'
    futures-util: '"0.3"'
    lazy_static: '"1.4"'
  config: "crate::module::LocalConfig"
  state: "crate::module::LocalState"
  init: "crate::module::init_module"
  sdk_path: "../../../../veldcore/sdk/rust"
  sdk_features: ["compute", "app"]
