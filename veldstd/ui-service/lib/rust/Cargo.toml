[package]
name = "veld-ui"
version = "0.1.0"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("pdk"))'] }

[dependencies]
veldsdk = { path = "../../../../veldcore/sdk/rust" }
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"

[build-dependencies]
prost-build = "0.13"