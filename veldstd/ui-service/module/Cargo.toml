[package]
name = "veld-ui-service"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
veldsdk = { path = "../../../veldsdk/rust", features = ["wgpu", "app"] }
veld-ui = { path = "../lib/rust" }
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
anyhow = "1.0"
iced_runtime = { version = "0.13" }
iced_graphics = { version = "0.13" }
iced_core = { version = "0.13" }
iced_widget = { version = "0.13", default-features = false }
iced_renderer = { version = "0.13", features = ["tiny-skia"] }
cosmic-text = "0.12"
futures-util = "0.3"
lazy_static = "1.4"

[build-dependencies]
prost-build = "0.13"
