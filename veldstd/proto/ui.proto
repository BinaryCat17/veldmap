syntax = "proto3";

package veldmap.ui;

import "core.proto";
import "app.proto";

message Layout {
    Widget root = 1;
    uint32 width = 2;
    uint32 height = 3;
}

message Widget {
    oneof type {
        Column column = 1;
        Row row = 2;
        Text text = 3;
        Button button = 4;
        TextInput text_input = 5;
        WgpuImage image = 6;
        Space space = 7;
        Container container = 8;
        Scrollable scrollable = 9;
        ProgressBar progress_bar = 10;
        Stack stack = 11;
        Tooltip tooltip = 12;
    }
}

message Stack {
    repeated Widget children = 1;
    Length width = 2;
    Length height = 3;
}

message Tooltip {
    Widget content = 1;
    string tooltip = 2;
    uint32 position = 3; // Enum Position
    float gap = 4;
    Padding padding = 5;
    string style = 6;
}

message ProgressBar {
    float range_start = 1;
    float range_end = 2;
    float value = 3;
    Length width = 4;
    Length height = 5;
}

message Scrollable {
    Widget content = 1;
    Length width = 2;
    Length height = 3;
}

message Column {
    repeated Widget children = 1;
    float spacing = 2;
    Padding padding = 3;
    Alignment align_items = 4;
    Length width = 5;
    Length height = 6;
}

message Row {
    repeated Widget children = 1;
    float spacing = 2;
    Padding padding = 3;
    Alignment align_items = 4;
    Length width = 5;
    Length height = 6;
}

message Text {
    string content = 1;
    float size = 2;
    Color color = 3;
    bool bold = 4;
    Alignment horizontal_alignment = 5;
    Alignment vertical_alignment = 6;
    string style = 7;
    Length width = 8;
    Length height = 9;
}

message Border {
    Color color = 1;
    float width = 2;
    float radius = 3;
}

message Shadow {
    Color color = 1;
    float offset_x = 2;
    float offset_y = 3;
    float blur_radius = 4;
}

message Appearance {
    optional Color background = 1;
    optional Color text_color = 2;
    optional Border border = 3;
    optional Shadow shadow = 4;
}

message ButtonStyle {
    Appearance active = 1;
    Appearance hovered = 2;
    Appearance pressed = 3;
    Appearance disabled = 4;
}

message Button {
    Widget child = 1;
    string on_press = 2; // Message tag
    bool disabled = 3;
    Length width = 4;
    Length height = 5;
    optional Alignment align_x = 6;
    optional Alignment align_y = 7;
    oneof style_variant {
        string style_class = 8;
        ButtonStyle style_custom = 10;
    }
    Padding padding = 9;
}

message TextInput {
    string value = 1;
    string placeholder = 2;
    string on_input = 3; // Message tag
    string on_submit = 4; // Message tag
    string style = 5;
    Length width = 6;
    Padding padding = 7;
    float size = 8;
}

message WgpuImage {
    veldmap.core.ResourceHandle handle = 1;
    Length width = 2;
    Length height = 3;
}

message Space {
    Length width = 1;
    Length height = 2;
}

message Container {
    Widget child = 1;
    Padding padding = 2;
    Length width = 3;
    Length height = 4;
    Alignment align_x = 5;
    Alignment align_y = 6;
    Color background = 7;
    string style = 8;
}

message Padding {
    float top = 1;
    float right = 2;
    float bottom = 3;
    float left = 4;
}

message Length {
    oneof value {
        float fixed = 1;
        bool shrink = 2;
        bool fill = 3;
        float portion = 4;
    }
}

enum Alignment {
    START = 0;
    CENTER = 1;
    END = 2;
}

message Color {
    float r = 1;
    float g = 2;
    float b = 3;
    float a = 4;
}

// RPC messages for ui-service
message SetViewRequest {
    string plugin_id = 1;
    Layout layout = 2;
}

message SetViewResponse {}

message HandleUiEventRequest {
    string plugin_id = 1;
    veldmap.app.UIEvent event = 2;
}

message HandleUiEventResponse {
    repeated UiEventResponse messages = 1;
}

message UiEventResponse {
    string plugin_id = 1;
    string message_tag = 2;
    string value = 3; // For TextInput or similar
}
