[package]
name = "veldmap-core-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
extism-pdk = "1.1.0"
veldmap-rust-rpc = { path = "../../lib/rust/rpc", features = ["pdk"] }
veldmap-logger = { path = "../../lib/rust/logger" }
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
