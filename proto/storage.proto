syntax = "proto3";
package veldmap.storage;
import "common.proto";

service LocalStorage {
  rpc GetTile(GetTileRequest) returns (GetTileResponse);
}

message GetTileRequest {
  veldmap.common.TileId id = 1;
}

message GetTileResponse {
  veldmap.common.DemTile tile = 1;
  string error = 2;
}

message GetGeoidRequest {}