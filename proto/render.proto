syntax = "proto3";

package veldmap.render;

import "common.proto";

message RenderFrameRequest {
    uint32 width = 1;
    uint32 height = 2;
}

message RenderFrameResponse {
    bytes image_data = 1;
    uint32 width = 2;
    uint32 height = 3;
    string error = 4;
}

message UpdateCameraRequest {
    double x = 1;
    double y = 2;
    double z = 3;
    float yaw = 4;
    float pitch = 5;
    float distance = 6;
}

message UpdateCameraResponse {
    bool success = 1;
    string error = 2;
}

message UploadTileRequest {
    veldmap.common.DemTile tile = 1;
}

message UploadTileResponse {
    bool success = 1;
    string error = 2;
}

service RenderService {
    rpc RenderFrame(RenderFrameRequest) returns (RenderFrameResponse);
    rpc UpdateCamera(UpdateCameraRequest) returns (UpdateCameraResponse);
    rpc UploadTile(UploadTileRequest) returns (UploadTileResponse);
}
