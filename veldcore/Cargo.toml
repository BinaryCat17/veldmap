[workspace]
members = [
    "platform/host/core", "platform/host/util",
    "platform/host/modules/app/generated",
    "platform/host/modules/fs/generated", "platform/host/modules/network/generated",
    "platform/host/runners/desktop", "platform/host/runners/desktop/generated",
    "sdk/rust",
]
# Сгенерированный buildgen'ом биндинг-крейт — standalone workspace.
exclude = ["platform/host/generated"]
resolver = "2"

# Единственное место, где задаются профили Rust-части. В .cargo/config.toml их
# нет намеренно: там окружение (toolchain, линковка), и дублирование ключа
# кончалось тем, что действовало не то значение, которое читаешь.
#
# Релизная сборка здесь — ещё и цикл разработки: именно ею проверяется любая
# правка (см. CLAUDE.md), поэтому профиль настроен на скорость пересборки, а не
# на предельную оптимизацию.
[profile.release]
opt-level = 3
lto = false          # Ради скорости линковки
codegen-units = 256  # Максимальный параллелизм LLVM
panic = "abort"
strip = true
incremental = true   # Пересборка после правки одного файла, а не всего крейта

[profile.release.package.veldmap-host-gui]
opt-level = 2 # Хост собирается заметно быстрее, а горячего кода в нём нет
