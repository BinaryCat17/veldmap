[workspace]
members = [
    "platform/host/core", "platform/host/util",
    "platform/host/modules/fs/generated", "platform/host/modules/network/generated",
    "platform/host/runners/desktop",
    "sdk/rust",
]
# Сгенерированный buildgen'ом биндинг-крейт — standalone workspace.
exclude = ["platform/host/generated"]
resolver = "2"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
