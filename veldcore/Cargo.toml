[workspace]
members = [
    "core/host/core",
    "core/host/gui",
    "core/host/cli",
    "core/bindings/rust",
    "sdk/rust/logger",
    "sdk/rust/ui-bridge",
    "sdk/rust/iced-wasm-runtime",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
