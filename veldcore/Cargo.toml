[workspace]
members = [
    "platform/host/core", "platform/host/modules/fs", "platform/host/modules/network", "platform/host/modules/system",
    "platform/host/runners/desktop",
    "sdk/rust",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
