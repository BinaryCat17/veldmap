[workspace]
members = [
    "core/host/core", "core/host/modules/fs", "core/host/modules/gpu", "core/host/modules/image", "core/host/modules/network",
    "core/host/runners/desktop",
    "sdk/rust",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
