syntax = "proto3";

package veldmap.app;

message UIEvent {
    // Логический адресат: имя модуля-владельца окна, породившего событие.
    string plugin_id = 1;
    oneof event {
        ClickEvent click = 2;
        KeyEvent key = 3;
        ResizeEvent resize = 4;
        InitEvent init = 5;
        ScrollEvent scroll = 6;
        CursorMovedEvent cursor_moved = 7;
        FrameEvent frame = 8;
    }
    repeated UIEvent sub_events = 9;
}

message FrameEvent {
    float dt = 1;
    uint32 monitor_fps = 2;
    float actual_fps = 3;
    veldmap.core.ResourceHandle surface_handle = 4;
}

message ClickEvent {
    float x = 1;
    float y = 2;
    uint32 button = 3;
    bool pressed = 4;
}

message ScrollEvent {
    float delta_x = 1;
    float delta_y = 2;
}

message CursorMovedEvent {
    float x = 1;
    float y = 2;
}

message KeyEvent {
    uint32 key_code = 1;
    bool pressed = 2;
}

message ResizeEvent {
    uint32 width = 1;
    uint32 height = 2;
    float scale_factor = 3;
    veldmap.core.ResourceHandle surface_handle = 4;
}

message InitEvent {}

import "core.proto";
