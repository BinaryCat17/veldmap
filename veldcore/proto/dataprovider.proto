syntax = "proto3";

package veldmap.dataprovider;

import "common.proto";

message SearchFilter {
  string name = 1;
  string value = 2;
}

message DataProduct {
  string name = 1;
  string path = 2;
  string timestamp = 3;
  string grid_id = 4;
}

message SearchRequest {
  string query = 1;
  repeated SearchFilter filters = 2;
}

message SearchResponse {
  repeated DataProduct products = 1;
  string error = 2;
}

message ListPathRequest {
  string path = 1;
  string token = 2;
}

message ListPathResponse {
  repeated string items = 1;
  string next_token = 2;
  string error = 3;
}

message DownloadRequest {
  string identifier = 1;
  string destination = 2;
}

message DownloadResponse {
  bool success = 1;
  string error = 2;
  string download_url = 3;
}
