syntax = "proto3";

package veldmap.services;

// Metadata for CRDT and P2P synchronization
message SyncMetadata {
  string origin_id = 1;      // Device/Node ID that created this message
  uint64 lamport_clock = 2; // Logic clock for ordering
}

// UNIVERSAL RESOURCE HANDLE
message ResourceHandle {
  uint64 id = 1;           // Local session ID
  bytes content_hash = 2;  // Global BLAKE3/Iroh hash
  uint64 size = 3;         // Data size
  uint32 type = 4;         // 0: Buffer, 1: Texture
}

// UNIVERSAL RPC CONTAINER
message RpcRequest {
  string service = 1;
  string method = 2;
  bytes payload = 3;
  SyncMetadata sync = 4;
}

message RpcResponse {
  bytes payload = 1;
  string error = 2;
  SyncMetadata sync = 3;
}

// SYSTEM SERVICE MESSAGES

enum LogLevel {
  TRACE = 0;
  DEBUG = 1;
  INFO = 2;
  WARN = 3;
  ERROR = 4;
}

message LogRequest {
  LogLevel level = 1;
  string message = 2;
}

message FsReadRequest {
  string path = 1;
}

message FsReadResponse {
  ResourceHandle handle = 1;
}

message FsWriteRequest {
  string path = 1;
  ResourceHandle handle = 2;
}

message FsListRequest {
  string path = 1;
}

message FsListResponse {
  repeated string entries = 1;
}

message FsDeleteRequest {
  string path = 1;
}

message FsDownloadRequest {
  string url = 1;
  string path = 2;
  map<string, string> headers = 3;
}

message FsDownloadResponse {
  TaskResponse task = 1;
}

// GPU / RESOURCE SERVICE

message GpuResourceRequest {
  oneof command {
    CreateBuffer create_buffer = 1;
    CreateTexture create_texture = 2;
    MapResource map = 3;
    UnmapResource unmap = 4;
    DestroyResource destroy = 5;
  }
}

message CreateBuffer {
  uint64 size = 1;
  uint32 usage = 2;
}

message CreateTexture {
  uint32 width = 1;
  uint32 height = 2;
  uint32 format = 3;
  uint32 usage = 4;
}

message MapResource {
  uint64 id = 1;
}

message UnmapResource {
  uint64 id = 1;
}

message DestroyResource {
  uint64 id = 1;
}

message GpuResourceResponse {
  ResourceHandle handle = 1;
  string error = 2;
}

// ASYNC TASKS

message TaskResponse {
  string task_id = 1;
}

message TaskStatusRequest {
  string task_id = 1;
}

message TaskStatusResponse {
  float progress = 1;
  bool completed = 2;
  string error = 3;
}

message TaskCancelRequest {
  string task_id = 1;
}
