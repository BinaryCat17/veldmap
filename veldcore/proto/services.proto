syntax = "proto3";

package veldmap.services;

// Metadata for CRDT and P2P synchronization
message SyncMetadata {
  string origin_id = 1;      // Device/Node ID that created this message
  uint64 lamport_clock = 2; // Logic clock for ordering
}

// UNIVERSAL RPC CONTAINER
message RpcRequest {
  string service = 1;
  string method = 2;
  bytes payload = 3;
  SyncMetadata sync = 4;
}

message RpcResponse {
  bytes payload = 1;
  string error = 2;
  SyncMetadata sync = 3;
}

// SYSTEM SERVICE MESSAGES

enum LogLevel {
  TRACE = 0;
  DEBUG = 1;
  INFO = 2;
  WARN = 3;
  ERROR = 4;
}

message LogRequest {
  LogLevel level = 1;
  string message = 2;
}

message FsReadRequest {
  string path = 1;
}

message FsReadResponse {
  bytes data = 1;
}

message FsWriteRequest {
  string path = 1;
  bytes data = 2;
}

message FsListRequest {
  string path = 1;
}

message FsListResponse {
  repeated string entries = 1;
}

message FsDeleteRequest {
  string path = 1;
}

message FsDownloadRequest {
  string url = 1;
  string path = 2;
  map<string, string> headers = 3;
}

message TaskResponse {
  string task_id = 1;
}

message TaskStatusRequest {
  string task_id = 1;
}

message TaskStatusResponse {
  float progress = 1;
  bool completed = 2;
  string error = 3;
}

message TaskCancelRequest {
  string task_id = 1;
}