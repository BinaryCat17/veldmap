syntax = "proto3";

package veldmap.wgpu;

// --- Enums for Type Safety ---

enum TextureFormat {
    TEX_RGBA8_UNORM = 0;
    TEX_R32_FLOAT = 1;
    TEX_RGBA16_FLOAT = 2;
    TEX_RGBA32_FLOAT = 3;
    TEX_R8_UNORM = 9;
    TEX_BGRA8_UNORM_SRGB = 10;
}

enum VertexFormat {
    VTX_FLOAT32 = 0;
    VTX_FLOAT32x2 = 1;
    VTX_FLOAT32x3 = 2;
    VTX_FLOAT32x4 = 3;
    VTX_UINT32 = 4;
}

enum IndexFormat {
    IDX_UINT16 = 0;
    IDX_UINT32 = 1;
}

enum AddressMode {
    ADDR_CLAMP_TO_EDGE = 0;
    ADDR_REPEAT = 1;
    ADDR_MIRROR_REPEAT = 2;
}

enum FilterMode {
    FILT_NEAREST = 0;
    FILT_LINEAR = 1;
}

enum StepMode {
    STEP_VERTEX = 0;
    STEP_INSTANCE = 1;
}

// --- Common Structures ---

message GpuBufferBinding {
    uint64 buffer_id = 1;
    uint64 offset = 2;
    uint64 size = 3;
}

message GpuTextureBinding {
    uint64 texture_id = 1;
    uint32 view_dimension = 2; // 0: 2D, 1: 2DArray, etc
}

// --- Resource Creation ---

message CreateBuffer {
    uint64 size = 1;
    uint32 usage = 2;
    bool mapped_at_creation = 3;
    bool readonly = 4;
}

message CreateTexture {
    uint32 width = 1;
    uint32 height = 2;
    uint32 depth_or_array_layers = 3;
    uint32 mip_level_count = 4;
    uint32 sample_count = 5;
    uint32 dimension = 6; // 0: 1D, 1: 2D, 2: 3D
    TextureFormat format = 7;
    uint32 usage = 8;
    bool readonly = 9;
}

message CreateTextureView {
    uint64 texture_id = 1;
    TextureFormat format = 2;
    uint32 dimension = 3;
    uint32 aspect = 4;
    uint32 base_mip_level = 5;
    uint32 mip_level_count = 6;
    uint32 base_array_layer = 7;
    uint32 array_layer_count = 8;
}

message CreateSampler {
    AddressMode address_mode_u = 1;
    AddressMode address_mode_v = 2;
    AddressMode address_mode_w = 3;
    FilterMode mag_filter = 4;
    FilterMode min_filter = 5;
    FilterMode mipmap_filter = 6;
}

message BindGroupLayoutEntry {
    uint32 binding = 1;
    uint32 visibility = 2; // Bitmask: 1: Vertex, 2: Fragment, 4: Compute
    oneof ty {
        BufferBindingLayout buffer = 3;
        SamplerBindingLayout sampler = 4;
        TextureBindingLayout texture = 5;
    }
}

message BufferBindingLayout {
    uint32 type = 1; // 1: Uniform, 2: Storage, etc
    bool has_dynamic_offset = 2;
    uint64 min_binding_size = 3;
}

message SamplerBindingLayout {
    uint32 type = 1; // 1: Filtering, 2: NonFiltering, 3: Comparison
}

message TextureBindingLayout {
    uint32 sample_type = 1; // 1: Float, 2: UnfilterableFloat, etc
    uint32 view_dimension = 2;
    bool multisampled = 3;
}

message CreateBindGroupLayout {
    repeated BindGroupLayoutEntry entries = 1;
    string label = 2;
}

message BindGroupEntry {
    uint32 binding = 1;
    oneof resource {
        uint64 buffer_id = 2;
        GpuBufferBinding buffer_binding = 3;
        uint64 texture_view_id = 4;
        uint64 sampler_id = 5;
    }
}

message CreateBindGroup {
    uint64 layout_id = 1;
    repeated BindGroupEntry entries = 2;
    string label = 3;
}

message VertexAttribute {
    VertexFormat format = 1;
    uint64 offset = 2;
    uint32 shader_location = 3;
}

message VertexBufferLayout {
    uint64 array_stride = 1;
    StepMode step_mode = 2;
    repeated VertexAttribute attributes = 3;
}

message CreateShaderModule {
    string source = 1;
    string label = 2;
}

message CreateRenderPipeline {
    uint64 shader_id = 1;
    string vertex_entry = 2;
    string fragment_entry = 3;
    repeated VertexBufferLayout vertex_layouts = 4;
    uint32 primitive_topology = 5;
    uint32 strip_index_format = 6;
    uint32 front_face = 7;
    uint32 cull_mode = 8;
    TextureFormat target_format = 9;
    bool depth_enabled = 10;
    string label = 11;
}

import "core.proto";

// --- GPU / RESOURCE SERVICE ---

message GpuResourceRequest {
  oneof command {
    CreateBuffer create_buffer = 1;
    CreateTexture create_texture = 2;
    CreateSampler create_sampler = 3;
    CreateBindGroup create_bind_group = 4;
    CreateRenderPipeline create_pipeline = 5;
    CreateShaderModule create_shader = 9;
    CreateBindGroupLayout create_bind_group_layout = 10;
    CreateTextureView create_texture_view = 11;
    Submit submit = 12;
    FsReadToTexture fs_read_to_texture = 13;
    FsReadToBuffer fs_read_to_buffer = 14;
    ImageLoadToTexture image_load_to_texture = 15;
  }
}

message FsReadToTexture {
    string path = 1;
    TextureFormat format = 2; 
    uint32 usage = 3;
}

message FsReadToBuffer {
    string path = 1;
    uint32 usage = 2;
}

message ImageLoadToTexture {
    string path = 1;
    uint32 usage = 2;
    bool generate_mipmaps = 3;
}

message GpuColor {
    float r = 1;
    float g = 2;
    float b = 3;
    float a = 4;
}

message Submit {
    uint64 target_texture_view_id = 1;
    GpuColor clear_color = 2;
    CommandBuffer command_buffer = 3;
}

message GpuResourceResponse {
  veldmap.core.ResourceHandle handle = 1;
  string error = 2;
}

// --- COMMAND BUFFER ---

message WgpuCommand {
    oneof command {
        SetPipeline set_pipeline = 1;
        SetBindGroup set_bind_group = 2;
        SetVertexBuffer set_vertex_buffer = 3;
        SetIndexBuffer set_index_buffer = 4;
        Draw draw = 5;
        DrawIndexed draw_indexed = 6;
        SetViewport set_viewport = 7;
        SetScissorRect set_scissor_rect = 8;
    }
}

message SetPipeline {
    uint64 pipeline_id = 1;
}

message SetBindGroup {
    uint32 index = 1;
    uint64 bind_group_id = 2;
    repeated uint32 dynamic_offsets = 3;
}

message SetVertexBuffer {
    uint32 slot = 1;
    uint64 buffer_id = 2;
    uint64 offset = 3;
    uint64 size = 4;
}

message SetIndexBuffer {
    uint64 buffer_id = 1;
    IndexFormat index_format = 2;
    uint64 offset = 3;
    uint64 size = 4;
}

message Draw {
    uint32 vertex_count = 1;
    uint32 instance_count = 2;
    uint32 first_vertex = 3;
    uint32 first_instance = 4;
}

message DrawIndexed {
    uint32 index_count = 1;
    uint32 instance_count = 2;
    uint32 first_index = 3;
    int32 base_vertex = 4;
    uint32 first_instance = 5;
}

message SetViewport {
    float x = 1;
    float y = 2;
    float width = 3;
    float height = 4;
    float min_depth = 5;
    float max_depth = 6;
}

message SetScissorRect {
    uint32 x = 1;
    uint32 y = 2;
    uint32 width = 3;
    uint32 height = 4;
}

message CommandBuffer {
    repeated WgpuCommand commands = 1;
}
