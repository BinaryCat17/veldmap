syntax = "proto3";

package veldmap.core;

// UNIVERSAL RESOURCE HANDLE
message ResourceHandle {
  uint64 id = 1;           // Local session ID
  bytes content_hash = 2;  // Global BLAKE3/Iroh hash
  uint64 size = 3;         // Data size
}

// UNIVERSAL RPC CONTAINER
//
// Идентичность вызывающего (instance_id для проверок доступа) хост берёт из
// ABI-вызова (локально) или назначает соединению сам (для удалённых пиров) —
// в сообщении её нет, чтобы её нельзя было подделать.
message RpcRequest {
  string service = 1;
  string method = 2;
  bytes payload = 3;
}

message RpcResponse {
  bytes payload = 1;
  string error = 2;
}

// An intentionally empty payload (lifecycle signals etc.)
message Empty {}

// --- FILESYSTEM API ---

message FsReadRequest {
  string path = 1;
  string correlation_id = 2;
}

message FsReadResponse {
  ResourceHandle handle = 1;
  string correlation_id = 2;
}

message FsWriteRequest {
  string path = 1;
  ResourceHandle handle = 2;
  string correlation_id = 3;
}

message FsListRequest {
  string path = 1;
  string correlation_id = 2;
}

message FsListResponse {
  repeated string entries = 1;
  string correlation_id = 2;
}

message FsDownloadRequest {
  string url = 1;
  string path = 2;
  map<string, string> headers = 3;
  string correlation_id = 4;
}

message FsDownloadResponse {
  TaskResponse task = 1;
  string correlation_id = 2;
  string error = 3;
}

// --- HTTP API ---

message HttpTaskRequest {
  string url = 1;
  string method = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  string correlation_id = 5;
}

message HttpTaskResponse {
  uint32 status = 1;
  bytes body = 2;
  string correlation_id = 3;
}

// --- IMAGE API ---

message ImageLoadRequest {
  string path = 1;
  uint32 target_width = 2;  // 0 means original
  uint32 target_height = 3; // 0 means original
  bool preserve_aspect = 4;
  string correlation_id = 5;
}

message ImageLoadResponse {
  TaskResponse task = 1;
  string correlation_id = 2;
}

message ImageLoadResult {
  ResourceHandle handle = 1;
  string error = 2;
  string correlation_id = 3;
}

message FsReadResult {
  ResourceHandle handle = 1;
  string error = 2;
  string correlation_id = 3;
}

message FsWriteResult {
  string error = 1;
  string correlation_id = 2;
}

message FsListResult {
  repeated string entries = 1;
  string error = 2;
  string correlation_id = 3;
}

// --- DYNAMIC RESOURCE DISCOVERY ---

// --- ASYNC TASKS ---

message TaskResponse {
  string task_id = 1;
}

message TaskStatusRequest {
  string task_id = 1;
}

message TaskStatusResponse {
  float progress = 1;
  bool completed = 2;
  string error = 3;
  ResourceHandle result_handle = 4;
  bytes payload = 5;
}

message TaskCancelRequest {
  string task_id = 1;
}

message TaskCreateRequest {
  string task_id = 1;
}

message TaskCreateResponse {
  string task_id = 1;
}

message TaskUpdateRequest {
  string task_id = 1;
  float progress = 2;
  bool completed = 3;
  string error = 4;
  bytes payload = 5;
}

message GetConfigRequest {
  string key = 1;
}

message GetConfigResponse {
  string value = 1;
}

message RegisterConfigRequest {
  uint32 key = 1;
  string value_json = 2;
}

message GenerateUuidRequest {
}

message GenerateUuidResponse {
  string uuid = 1;
}
