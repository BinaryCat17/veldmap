syntax = "proto3";

package veldmap.core;

// Платформенный конверт и разделяемые примитивы хоста.
// Контракты сервисов лежат рядом с их реализациями (как types.proto у wasm-модулей):
//   platform/host/modules/fs/fs.proto
//   platform/host/modules/network/network.proto
// UI/окна/GPU: app.proto, graphics.proto.
// Системные примитивы (конфиг, энтропия) — не сервис, а ABI-вызовы:
// veld_get_config, veld_random_bytes (см. host/core/src/abi.rs).

// UNIVERSAL RESOURCE HANDLE
message ResourceHandle {
  uint64 id = 1;           // Local session ID
  bytes content_hash = 2;  // Global BLAKE3/Iroh hash
  uint64 size = 3;         // Data size
}

// UNIVERSAL RPC CONTAINER
//
// Идентичность вызывающего (instance_id для проверок доступа) хост берёт из
// ABI-вызова (локально) или назначает соединению сам (для удалённых пиров) —
// в сообщении её нет, чтобы её нельзя было подделать.
message RpcRequest {
  string service = 1;
  string method = 2;
  bytes payload = 3;
}

message RpcResponse {
  bytes payload = 1;
  string error = 2;
}
