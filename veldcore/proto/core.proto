syntax = "proto3";

package veldmap.core;

// Платформенный конверт и разделяемые примитивы.
// Эта директория — публичный протокол платформы: общий интерфейс для любых
// хостов и wasm-модулей. Рядом лежат контракты платформенных сервисов
// (fs.proto, network.proto) и UI/окна/GPU (app.proto, graphics.proto).
// Контракты wasm-модулей — types.proto рядом с их реализациями.
// Системные примитивы (конфиг, энтропия) — не сервис, а ABI-вызовы:
// veld_get_config, veld_random_bytes (см. host/core/src/abi.rs).

// UNIVERSAL RESOURCE HANDLE
message ResourceHandle {
  uint64 id = 1;           // Local session ID
  bytes content_hash = 2;  // Global BLAKE3/Iroh hash
  uint64 size = 3;         // Data size
}

// UNIVERSAL RPC CONTAINER
//
// Идентичность вызывающего (instance_id для проверок доступа) хост берёт из
// ABI-вызова (локально) или назначает соединению сам (для удалённых пиров) —
// подделать её через это сообщение нельзя.
message RpcRequest {
  string service = 1;
  string method = 2;
  bytes payload = 3;
  // Имя сервиса-паблишера; пустая строка — сам хост. Заполняется ТОЛЬКО
  // хостом при доставке события подписчику (конверт кодирует хост, модуль
  // может доверять полю). В сообщениях модуль → хост поле игнорируется:
  // там идентичность берётся из ABI.
  string publisher = 4;
}

message RpcResponse {
  bytes payload = 1;
  string error = 2;
}
