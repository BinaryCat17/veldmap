# Платформенный псевдо-модуль: топики app/* (контракт app.proto).
# buildgen генерирует из этого файла veldsdk::app::* — типизированные стабы
# для топиков, которые модули публикуют в платформу. Топики хост → модули
# (ui_event, window_resized, ready) здесь не объявлены: модули подписываются
# на них через dependencies в своих schema.yaml.
name: app
version: 0.1.0
interface:
  inputs:
    set_surface:
      type: app/SetSurface
