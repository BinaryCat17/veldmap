# Окружение сборки Rust-части: toolchain и линковка. Профили живут не здесь,
# а в Cargo.toml рядом — иначе один и тот же ключ задавался бы из двух мест
# (так `codegen-units` и разъехался: 16 в манифесте против 256 здесь).
#
# Читается cargo только когда он запущен из этого каталога или ниже — поэтому
# build.py зовёт его с cwd каталога манифеста (см. build.py::run).

[build]
rustflags = ["-Zthreads=16"] # Параллельный фронтенд rustc (nightly)

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-Zthreads=16"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
