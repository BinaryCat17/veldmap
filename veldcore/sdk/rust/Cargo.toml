[package]
name = "veldsdk"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
# Базовые системные зависимости
prost = "0.14"
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
futures-channel = { version = "0.3", default-features = false, features = ["alloc"] }
paste = "1.0"

[build-dependencies]
prost-build = "0.14"

[features]
default = ["pdk"]
compute = []
pdk = []
client = []
