[package]
name = "veldmap-host-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
veldmap-host-core = { path = "../../core" }
veldmap-host-bindings = { path = "../../generated" }
# Крейт композиции: список модулей объявлен в runner.yaml, крейт генерирует
# buildgen. Добавление модуля — правка runner.yaml, а не этого файла.
veldmap-desktop-modules = { path = "generated" }

async-trait = "0.1"
tokio = { version = "1.53", features = ["full"] }
anyhow = "1.0"
log = "0.4"
chrono = "0.4"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
wgpu = "30.0"
bytemuck = "1.25"
wasmtime = { version = "45.0", features = ["anyhow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
sysinfo = { version = "0.38", features = ["component"] }
spin_sleep = "1.3"
rand = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland"] }
