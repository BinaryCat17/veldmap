# Декларация раннера для buildgen: из списка modules генерируется крейт
# композиции runners/desktop/generated (Cargo.toml + register_all).
#
# Раннер владеет циклом событий ОС и решает, какие нативные модули в него
# входят. Мобильный раннер заведёт свой runner.yaml с другим списком —
# расходиться по #[cfg(target_os)] внутри main.rs для этого не нужно.
package: veldmap-desktop-modules
modules: [app, fs, network]
