# Декларация раннера для buildgen: из этого списка генерируется крейт
# композиции runners/desktop/generated (Cargo.toml + register_all).
#
# Раннер — точка сборки платформы под конкретное окружение: он владеет циклом
# событий ОС и решает, какие нативные модули в него входят. Мобильный раннер
# заведёт свой runner.yaml с другим списком; расходиться по #[cfg(target_os)]
# внутри одного main.rs для этого не нужно.
#
# `app` здесь платформенно-нейтрален: он принимает поверхности окон (шинная
# половина контракта), а ввод и кадровые тики публикует сам раннер.
package: veldmap-desktop-modules
modules: [app, fs, network, tasks]
