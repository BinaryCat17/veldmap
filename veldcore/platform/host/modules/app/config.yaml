# Конфиг нативного модуля app: buildgen генерирует крейт в generated/
# (Cargo.toml + клей диспетчеризации). Логика — src/module.rs.
#
# Модуль платформенно-нейтрален: он реализует только входную половину
# контракта app (приём поверхностей от владельцев окон). Выходную половину
# (ui_event, window_resized, ready) публикует раннер — их порождает цикл
# событий ОС, которым владеет он.
package: veldmap-host-app
language: rust
rust:
  dependencies: {}
