[package]
name = "veldmap-host-core"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = "41.0"
wasmtime-wasi = "41.0"
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.10"
uuid = { version = "1.0", features = ["v4"] }
wgpu = "28.0"
dashmap = "6.0"
async-trait = "0.1"
blake3 = "1.5"
chrono = "0.4"
rand = "0.9"

[build-dependencies]
prost-build = "0.14"
