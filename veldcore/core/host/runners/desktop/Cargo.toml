[package]
name = "veldmap-host-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
veldmap-host-core = { path = "../../core" }
veldmap-host-fs = { path = "../../modules/fs" }
veldmap-host-network = { path = "../../modules/network" }
veldmap-host-image = { path = "../../modules/image" }
veldmap-host-system = { path = "../../modules/system" }


tokio = { version = "1.49", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
winit = { version = "0.29", default-features = false, features = ["rwh_06"] }
wgpu = "28.0"
image = "0.25"
bytemuck = "1.16"
wasmtime = "41.0"
serde_json = "1.0"
prost = "0.14"
iroh = "0.96"
sysinfo = { version = "0.38", features = ["component"] }
spin_sleep = "1.2"
rand = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.29", default-features = false, features = ["wayland"] }
