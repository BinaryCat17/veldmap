[package]
name = "veldmap-host-core"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = "41.0.2"
wasmtime-wasi = "41.0.2"
iroh = "0.31"
iroh-gossip = "0.31"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.10"
reqwest = { version = "0.12", features = ["blocking", "stream"] }
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4"] }
wgpu = "24.0"
dashmap = "6.0"
blake3 = "1.5"
image = "0.25"

[build-dependencies]
prost-build = "0.13"
