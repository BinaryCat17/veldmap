[package]
name = "veldmap-host-network"
version = "0.1.0"
edition = "2021"

[dependencies]
veldmap-host-core = { path = "../../core" }
tokio = { version = "1.49", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
