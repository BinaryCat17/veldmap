[package]
name = "veldmap-rust-rpc"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
once_cell = "1.19"
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"], optional = true }
extism-pdk = { version = "1.1.0", optional = true }

[features]
default = []
client = ["tokio"]
pdk = ["extism-pdk"]

[build-dependencies]
prost-build = "0.13"
