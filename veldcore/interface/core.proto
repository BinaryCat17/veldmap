syntax = "proto3";

package veldmap.core;

// Платформенный конверт и разделяемые примитивы.
// Эта директория — публичный протокол платформы: общий интерфейс для любых
// хостов и wasm-модулей.
//
// Раскладка. Признак категории — наличие schema.yaml:
//   modules/<name>/<name>.proto + <name>.schema.yaml — сервис шины. Схема
//     описывает топики (inputs/outputs, replies_to, targeted); по ней
//     генерируются стабы и клей диспетчеризации (buildgen).
//   корень (этот файл, graphics.proto) — инфраструктура. Схемы нет, потому
//     что нет топиков: это не сервисы, а фундамент, на который они опираются.
// Контракты wasm-модулей — types.proto рядом с их реализациями.
//
// .proto здесь — язык типов, а не признак шины: graphics.proto описывает
// аргументы синхронных ABI-вызовов (veld_graphics_*), которые тоже
// пересекают границу wasm↔хост сериализованными и тоже должны читаться
// не-Rust реализациями SDK.
//
// Системные примитивы (конфиг, энтропия) контракта не имеют вовсе — это
// ABI-вызовы со скалярными аргументами: veld_get_config, veld_random_bytes
// (см. host/core/src/abi.rs).
//
// В самом файле два жителя разной природы: ResourceHandle — общий словарь
// (его импортируют контракты сервисов), EventEnvelope — транспорт шины
// (его не импортирует никто, он сериализуется в veld_host_publish).

// UNIVERSAL RESOURCE HANDLE
//
// Форма адреса ресурса в сообщениях шины. В ABI-вызовах (memory, graphics)
// тот же самый id ходит голым uint64: адресат там локален по определению,
// а size нужен получателю события, который о ресурсе больше ничего не знает.
// Поэтому `ResourceHandle { id, ..Default::default() }` на границе ABI —
// норма, а не недозаполненное сообщение.
message ResourceHandle {
  uint64 id = 1;           // Local session ID
  uint64 size = 3;         // Размер в байтах; у текстуры — размер образа
}

// Ответ на «открой мне это» — общий для всех, кто умеет открывать ресурсы:
// fs (файл на диске), network (удалённый файл по Range-запросам), любой
// прикладной модуль, который открывает своё (data-provider — продукт в
// хранилище, подписав запрос).
//
// Тип один намеренно: для читателя ресурсы неразличимы (arena_read по
// смещению работает одинаково), и разные сообщения одной формы означали бы
// только то, что читателю придётся писать три одинаковых обработчика.
// Владение открытым ресурсом переходит к заказчику — он же его и освободит.
message ResourceOpened {
  veldmap.core.ResourceHandle handle = 1;  // валиден, если error пуст
  string error = 2;
}

// «Вот твой render-таргет» — общий для всех, кто отдаёт свою текстуру чужому
// рендереру: владелец окна отдаёт ui-service поверхность окна, автор разметки
// отдаёт трёхмерному виду место под него в разметке.
//
// Тип один по той же причине, что и у ResourceOpened: для получателя разницы
// нет вовсе. Он выделяет ресурсы под названный размер и рисует; чем это место
// является в чужой раскладке — не его дело. Разные сообщения одной формы
// означали бы только то, что два рендерера пишут два одинаковых обработчика и
// однажды разойдутся в том, что считать размером.
//
// Владение текстурой остаётся у отправителя: он её выделил, он же её и
// освободит, выделив следующую. Получателю выдано право записи, и живёт оно
// ровно столько, сколько сама текстура.
//
// Сообщение объявляет текущее состояние делегирования целиком, поэтому
// **пустое `surface` — это отзыв**: места больше нет, и рендерер обязан
// бросить всё, что под него завёл. Отдельного топика на отзыв нет намеренно —
// он завёл бы вторую точку правды о том, есть ли у рендерера место, а
// молчаливый отзыв (просто освободить текстуру) не работает вовсе: view,
// сделанный рендерером, держит текстуру живой в обход реестра, и рисовать в
// уже никому не видное место он будет вечно.
message SurfaceDelegated {
  // Пусто — место отозвано.
  veldmap.core.ResourceHandle surface = 1;
  // Размер текстуры в физических пикселях — в них же рендерер и рисует.
  uint32 width = 2;
  uint32 height = 3;
  // Сколько физических пикселей приходится на точку раскладки. Нужен не только
  // интерфейсу: линия толщиной в точку обязана остаться видимой и на HiDPI, а
  // вывести это из одного лишь размера нельзя.
  float scale_factor = 4;
  // Формат текстуры (veldmap.graphics.TextureFormat) — под него рендерер
  // собирает свой пайплайн. Едет здесь, а не приходит рендереру откуда-то ещё:
  // формат — свойство именно этой текстуры, и второй его источник разошёлся бы
  // с ней ровно тогда, когда мест под рендер стало больше одного.
  int32 format = 5;
}

// Конверт события шины (fire-and-forget): publish и доставка подписчику.
// Идентичность вызывающего (instance_id для проверок доступа) хост берёт
// из ABI-вызова — подделать её через это сообщение нельзя.
message EventEnvelope {
  string service = 1;
  string method = 2;
  bytes payload = 3;
  // Имя сервиса-паблишера; пустая строка — сам хост. Заполняется ТОЛЬКО
  // хостом при доставке события подписчику (конверт кодирует хост, модуль
  // может доверять полю). В сообщениях модуль → хост поле игнорируется:
  // там идентичность берётся из ABI.
  string publisher = 4;
  // Корреляция запрос/ответ. Транспортная метаданная, а не часть доменного
  // сообщения: топик объявляет пару `replies_to` в schema.yaml, и по этому
  // полю заказчик опознаёт ответ на свой запрос среди широковещательных.
  // Место ему в конверте, а не в доменном типе: носит его рантайм, а типа
  // payload он не знает — прочесть поле внутри сообщения ему нечем.
  //
  // Пусто у топиков, не объявленных парой: у события «состояние изменилось»
  // корреспондента нет. Заполняется паблишером; хост его не подделывает и не
  // интерпретирует — только переносит.
  string correlation_id = 6;
  // Адресат: имя единственного модуля, которому предназначено событие.
  // Пустая строка — обычная широковещательная доставка всем подписчикам
  // топика (текущее поведение). Непустая — доставка только подписчику с
  // этим именем; событие для несуществующего/неподписанного адресата
  // молча дропается диспетчером. Заполняется паблишером (модуль или хост);
  // хост не подделывает и не проверяет это поле при выдаче — им может
  // адресовать событие только владелец топика, публикующий в него.
  string target = 5;
}
