# Контракт нативного сервиса fs (сообщения — fs.proto, рядом).
# buildgen генерирует из этого файла хостовые биндинги (topics/emit).
name: fs
version: 0.1.0
interface:
  inputs:
    on_read:
      type: fs/FsReadRequest
    on_write:
      type: fs/FsWriteRequest
    on_list:
      type: fs/FsListRequest
    on_delete:
      type: fs/FsDeleteRequest
  outputs:
    on_read_result:
      type: core/ResourceOpened
      replies_to: on_read
    on_write_result:
      type: fs/FsWriteResult
      replies_to: on_write
    on_list_result:
      type: fs/FsListResult
      replies_to: on_list
    on_delete_result:
      type: fs/FsDeleteResult
      replies_to: on_delete
