syntax = "proto3";

package veldmap.fs;

import "core.proto";

// --- FILESYSTEM API ---
// Контракт нативного сервиса fs (чтение/запись через shared memory, листинг).

// Ответ — общий core.ResourceOpened: открытый файл ничем не отличается от
// любого другого ресурса, и читателю всё равно, кто его открыл.
message FsReadRequest {
  string path = 1;
}

message FsWriteRequest {
  string path = 1;
  veldmap.core.ResourceHandle handle = 2;
}

message FsWriteResult {
  string error = 1;
}

message FsListRequest {
  string path = 1;
  // Обойти вложенные каталоги. Тогда в ответе только файлы, а имя у каждого —
  // путь от `path`: каталог сам по себе записью не является, он раскладка, и
  // отдельной строкой в ответе означал бы то же самое, что и лежащее в нём.
  //
  // Признака «это каталог» у записи поэтому нет и не нужно: спрашивающий либо
  // смотрит один уровень и знает, что делать с именем без размера, либо
  // просит обойти вглубь и получает одни файлы.
  bool recursive = 2;
}

message FsEntry {
  // Имя файла в каталоге; при `recursive` — путь от каталога, о котором
  // спрашивали, через `/`.
  string name = 1;
  uint64 size = 2;
  // Время изменения, unix-секунды; 0 — файловая система его не отдала.
  int64 modified = 3;
}

message FsListResult {
  repeated FsEntry entries = 1;
  string error = 2;
}

message FsDeleteRequest {
  string path = 1;
}

message FsDeleteResult {
  string error = 1;
}
