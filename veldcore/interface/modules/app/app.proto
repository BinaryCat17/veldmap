syntax = "proto3";

package veldmap.app;

import "core.proto";

// ── Контракт «приложение ↔ платформа» ────────────────────────────────────────
//
// Хост ничего не знает о рендерерах. Он публикует события в нейтральные топики
// и принимает команды от модулей:
//
//   app/ui_event       (UIEvent)       хост → подписчики: ввод и кадровые тики
//   app/window_resized (WindowResized) хост → подписчики: окну нужна поверхность
//   app/set_surface    (SetSurface)    владелец окна → хост: композить эту текстуру
//   app/ready          (пусто)         хост → подписчики: все сервисы загружены
//
// Владелец окна отвечает на window_resized выделением текстуры и делегированием
// её своему рендереру (write-lease) — capability вместо конфигурации.

message UIEvent {
    // Логический адресат: имя модуля-владельца окна, породившего событие.
    string plugin_id = 1;
    oneof event {
        ClickEvent click = 2;
        KeyEvent key = 3;
        ScrollEvent scroll = 4;
        CursorMovedEvent cursor_moved = 5;
        FrameEvent frame = 6;
    }
}

message FrameEvent {
    float dt = 1;
    uint32 monitor_fps = 2;
}

message ClickEvent {
    uint32 button = 3;
    bool pressed = 4;
}

message ScrollEvent {
    float delta_x = 1;
    float delta_y = 2;
}

message CursorMovedEvent {
    float x = 1;
    float y = 2;
}

message KeyEvent {
    // Физический код клавиши (дискриминант winit KeyCode; порядок совпадает
    // с iced_core::keyboard::key::Code).
    uint32 key_code = 1;
    bool pressed = 2;
    // Текст, порождённый нажатием (раскладка и модификаторы применены);
    // пуст для непечатных клавиш и для отпускания.
    string text = 3;
    // Маска модификаторов на момент события: 1=Shift, 2=Ctrl, 4=Alt, 8=Super.
    uint32 modifiers = 4;
}

// Окно модуля создано или изменило размер: владельцу нужно выделить
// render-target указанного размера и формата и приаттачить его (SetSurface).
message WindowResized {
    string plugin_id = 1;
    uint32 width = 2;
    uint32 height = 3;
    float scale_factor = 4;
    // Требуемый формат текстуры (veldmap.graphics.TextureFormat).
    int32 format = 5;
}

// Команда хосту: композить эту текстуру в окно модуля plugin_id.
// Отправитель должен владеть окном (plugin_id — его имя) и текстурой.
// Свап атомарный: до первого SetSurface окно рисует фон, при ресайзе
// старая текстура показывается, пока не приаттачена новая.
message SetSurface {
    string plugin_id = 1;
    veldmap.core.ResourceHandle surface = 2;
}

// Показать путь в файловом менеджере системы. Единственное, что может сделать
// только платформа: у wasm-модуля нет ни процессов, ни рабочего стола.
//
// Ответа нет намеренно. Смысл команды — «переведи взгляд туда», и знать, чем
// она кончилась, заказчику незачем: файловый менеджер откроется поверх нашего
// окна, и это увидит сам человек. Отказ уходит в лог хоста.
message RevealPath {
    // Путь относительно runtime-каталога — тот же вид, в котором пути ходят у
    // fs. Каталог показывается сам, файл — вместе со своим каталогом.
    string path = 1;
}
