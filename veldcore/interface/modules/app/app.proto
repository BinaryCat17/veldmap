syntax = "proto3";

package veldmap.app;

import "core.proto";

// ── Контракт «приложение ↔ платформа» ────────────────────────────────────────
//
// Хост ничего не знает о рендерерах. Он публикует события в нейтральные топики
// и принимает команды от модулей:
//
//   app/ui_event       (UIEvent)       хост → подписчики: ввод и кадровые тики
//   app/window_resized (WindowResized) хост → подписчики: окну нужна поверхность
//   app/set_surface    (SetSurface)    владелец окна → хост: композить эту текстуру
//   app/ready          (пусто)         хост → подписчики: все сервисы загружены
//   app/locate_widget  (LocateWidget)  хост → рендерер: где на экране этот элемент
//   app/widget_located (WidgetLocated) рендерер → хост: вот где, и сколько таких
//
// Владелец окна отвечает на window_resized выделением текстуры и делегированием
// её своему рендереру (write-lease) — capability вместо конфигурации.

message UIEvent {
    // Логический адресат: имя модуля-владельца окна, породившего событие.
    string plugin_id = 1;
    oneof event {
        ClickEvent click = 2;
        KeyEvent key = 3;
        ScrollEvent scroll = 4;
        CursorMovedEvent cursor_moved = 5;
        FrameEvent frame = 6;
    }
}

message FrameEvent {
    float dt = 1;
    // Тег 2 и имя закрыты за monitor_fps — частотой экрана. Держатся они не
    // ради старых сообщений (шина живёт внутри процесса, и хост с модулями
    // собираются вместе), а ради читающего: лог, дамп и .proto из истории
    // ссылаются на тег числом, и переиспользованный он врал бы им молча.
    reserved 2;
    reserved "monitor_fps";
}

message ClickEvent {
    uint32 button = 3;
    bool pressed = 4;
}

message ScrollEvent {
    float delta_x = 1;
    float delta_y = 2;
}

message CursorMovedEvent {
    float x = 1;
    float y = 2;
}

message KeyEvent {
    // Физический код клавиши (дискриминант winit KeyCode; порядок совпадает
    // с iced_core::keyboard::key::Code).
    uint32 key_code = 1;
    bool pressed = 2;
    // Текст, порождённый нажатием (раскладка и модификаторы применены);
    // пуст для непечатных клавиш и для отпускания.
    string text = 3;
    // Маска модификаторов на момент события: 1=Shift, 2=Ctrl, 4=Alt, 8=Super.
    uint32 modifiers = 4;
}

// Окно модуля создано или изменило размер: владельцу нужно выделить
// render-target указанного размера и формата и приаттачить его (SetSurface).
message WindowResized {
    string plugin_id = 1;
    uint32 width = 2;
    uint32 height = 3;
    float scale_factor = 4;
    // Требуемый формат текстуры (veldmap.graphics.TextureFormat).
    int32 format = 5;
}

// Команда хосту: композить эту текстуру в окно модуля plugin_id.
// Отправитель должен владеть окном (plugin_id — его имя) и текстурой.
// Свап атомарный: до первого SetSurface окно рисует фон, при ресайзе
// старая текстура показывается, пока не приаттачена новая.
message SetSurface {
    string plugin_id = 1;
    veldmap.core.ResourceHandle surface = 2;
}

// Показать путь в файловом менеджере системы. Единственное, что может сделать
// только платформа: у wasm-модуля нет ни процессов, ни рабочего стола.
//
// Ответа нет намеренно. Смысл команды — «переведи взгляд туда», и знать, чем
// она кончилась, заказчику незачем: файловый менеджер откроется поверх нашего
// окна, и это увидит сам человек. Отказ уходит в лог хоста.
message RevealPath {
    // Путь относительно runtime-каталога — тот же вид, в котором пути ходят у
    // fs. Каталог показывается сам, файл — вместе со своим каталогом.
    string path = 1;
}

// ── Поиск элемента на экране ─────────────────────────────────────────────────
//
// Средство прогона по сценарию: сценарий называет элемент тем же, чем его
// называет разметка, — обработчиком или видимой надписью, — а не пикселями.
// Где он на экране, знает только рендерер: раскладку считает он. Поэтому
// спрашивает раннер, а отвечает тот, кому делегирована поверхность окна.
//
// Координат в вопросе нет вовсе, и это главное: сценарий переживает и смену
// размера окна, и переезд элемента, и перерисовку списка — всё то, от чего
// пиксельный сценарий врёт молча.
message LocateWidget {
    // Чей экран обходим — имя владельца окна, как и во всех событиях app.
    string plugin_id = 1;
    // Номер вопроса, растущий у раннера. Ответ повторяет его эхом: обход стоит
    // кадра, и ответ на позапрошлый вопрос приходит уже не ко времени.
    uint64 request = 2;
    // Обработчик искомого: имя метода и его нагрузка. Ключ в адрес не входит —
    // им разметка называет вкладку-адресата, а не элемент, и от запуска к
    // запуску он свой.
    string method = 3;
    string value = 4;
    // Часть видимой надписи. Задана вместо метода: подписью адресуется то, у
    // чего обработчика нет вовсе. Пустыми оба сразу не бывают — вопрос без
    // имени не спрашивает ни о чём, и отвечают на него «не нашлось».
    string text = 5;
    // Который по счёту из подошедших, считая с единицы, в порядке обхода
    // разметки. 0 — «подойти должен ровно один»: место тогда называют у
    // первого, а сколько их всего, спрашивающий видит по счёту и решает сам,
    // считать ли это ответом.
    uint32 ordinal = 6;
}

// Ответ на LocateWidget.
message WidgetLocated {
    string plugin_id = 1;
    uint64 request = 2;
    // Сколько элементов подошло под вопрос. Считаются только видимые: то, что
    // уехало за край списка или за обрезающую коробку, нажать нельзя, и
    // называть его найденным значит обещать невыполнимое.
    uint32 found = 3;
    // Место названного, в физических пикселях окна — в тех же, в которых
    // сценарий двигает курсор. Значимо, только когда названный нашёлся.
    float x = 4;
    float y = 5;
    float width = 6;
    float height = 7;
}
