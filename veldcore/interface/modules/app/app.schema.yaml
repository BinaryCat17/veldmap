# Контракт сервиса app: «приложение ↔ платформа» (сообщения — app.proto, рядом).
# buildgen генерирует из этого файла хостовые биндинги (topics/emit) и клей
# нативного модуля platform/host/modules/app.
#
# Сервис поделён между двумя реализациями, и это намеренно:
#   inputs  — принимает нативный модуль modules/app, платформенно-нейтрально
#             (авторизация владельца окна + очередь на аттач);
#   outputs — публикует раннер напрямую через emit-стабы: ввод и кадровые тики
#             порождает цикл событий ОС, а им владеет раннер, не модуль.
# Wasm-модули объявляют свою сторону как обычную зависимость в schema.yaml
# (`app: subs: [...], calls: [...]`) — отдельных стабов в SDK для app нет.
name: app
version: 0.1.0
interface:
  inputs:
    on_set_surface:
      type: app/SetSurface
    on_reveal_path:
      type: app/RevealPath
    # Ответ на обход разметки. Принимает его модуль app и кладёт в очередь
    # хоста — забирает оттуда кадровый цикл раннера, как и поверхность окна:
    # спрашивал он, и ждёт ответа тоже он.
    on_widget_located:
      type: app/WidgetLocated
  outputs:
    on_ui_event:
      type: app/UIEvent
    on_window_resized:
      type: app/WindowResized
      targeted: true
    # Вопрос рендереру: где на экране элемент, названный не пикселями. Идёт
    # широковещательно — хост не знает, кто рисует, и адресовать ему некого.
    on_locate_widget:
      type: app/LocateWidget
