# Контракт нативного сервиса network (сообщения — network.proto, рядом).
# buildgen генерирует из этого файла хостовые биндинги (topics/emit).
name: network
version: 0.1.0
interface:
  inputs:
    on_fs_download:
      type: network/FsDownloadRequest
    on_http:
      type: network/HttpTaskRequest
  outputs:
    on_fs_download_result:
      type: network/FsDownloadResponse
      replies_to: on_fs_download
    on_fs_download_progress:
      type: network/FsDownloadProgress
      replies_to: on_fs_download
    on_http_result:
      type: network/HttpTaskResponse
      replies_to: on_http
