# Контракт нативного сервиса network (сообщения — network.proto, рядом).
# buildgen генерирует из этого файла хостовые биндинги (topics/emit).
name: network
version: 0.1.0
interface:
  inputs:
    # Закачка и HTTP идут в фоне и бывают долгими — их можно убить.
    on_fs_download:
      type: network/FsDownloadRequest
      cancellable: true
    on_http:
      type: network/HttpTaskRequest
      cancellable: true
    # Открытие ресурса — один Range-запрос за заголовками, убивать нечего.
    on_open:
      type: network/RemoteOpenRequest
    # Новая подпись объекта в ответ на on_resign; пара не объявлена — ответ
    # узнаётся по адресу, а не по корреляции (см. network.proto).
    on_resigned:
      type: network/ResignResponse
  outputs:
    # Подпись истекла посреди чтения: просьба подписать заново тому, у кого
    # ключи. Широковещательно — сервис не знает, кто подписывал.
    on_resign:
      type: network/ResignRequest
    on_open_result:
      type: core/ResourceOpened
      replies_to: on_open
    # У закачки два ответа, и концом работы является только этот: прогресс
    # приходит многократно и операцию не закрывает.
    on_fs_download_result:
      type: network/FsDownloadResponse
      replies_to: on_fs_download
      terminal: true
    on_fs_download_progress:
      type: network/FsDownloadProgress
      replies_to: on_fs_download
    on_http_result:
      type: network/HttpTaskResponse
      replies_to: on_http
