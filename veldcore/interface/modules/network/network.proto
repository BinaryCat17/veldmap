syntax = "proto3";

package veldmap.network;

import "core.proto";

// --- NETWORK API ---
// Контракт нативного сервиса network (HTTP-запросы и потоковые скачивания).
// Идентификатор операции везде — correlation_id: прогресс и результаты
// доставляются событиями, отмена — платформенным событием tasks/cancel
// (veldcore/proto/tasks.proto).

// Открыть удалённый файл как ресурс, не скачивая его (топик network/open).
// В ответе — общий core.ResourceOpened: читатель тянет из него фрагменты
// (arena_read), а сервер получает Range-запросы. Так превью снимка на
// гигабайты стоит нескольких сотен килобайт трафика — при условии, что
// сервер отвечает Accept-Ranges, а формат допускает произвольный доступ.
message RemoteOpenRequest {
  string url = 1;
  // Авторизация и прочее, как у скачивания — но здесь это снимок на момент
  // открытия: ресурс живёт ровно столько, сколько заголовки действительны.
  // Подпись с ограниченным сроком (SigV4 и подобные) задаёт этот срок.
  map<string, string> headers = 2;
  string correlation_id = 3;
}

message FsDownloadRequest {
  string url = 1;
  string path = 2;
  map<string, string> headers = 3;
  string correlation_id = 4;
}

message FsDownloadResponse {
  string correlation_id = 1;
  string error = 2;
}

// Событие прогресса скачивания (топик network/fs_download_progress).
message FsDownloadProgress {
  string correlation_id = 1;
  float progress = 2;  // 0.0 to 1.0
  uint64 downloaded_bytes = 3;
  uint64 total_bytes = 4;  // 0, если сервер не прислал Content-Length
}

// --- HTTP API ---

message HttpTaskRequest {
  string url = 1;
  string method = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  string correlation_id = 5;
}

message HttpTaskResponse {
  uint32 status = 1;
  bytes body = 2;
  string correlation_id = 3;
}
