syntax = "proto3";

package veldmap.network;

import "core.proto";

// --- NETWORK API ---
// Контракт нативного сервиса network (HTTP-запросы и потоковые скачивания).
// Прогресс и результаты доставляются событиями; операцию заказчик опознаёт
// по корреляции конверта (EventEnvelope.correlation_id — пары объявлены в
// network.schema.yaml).

// Открыть удалённый файл как ресурс, не скачивая его (топик network/open).
// В ответе — общий core.ResourceOpened: читатель тянет из него фрагменты
// (arena_read), а сервер получает Range-запросы. Так превью снимка на
// гигабайты стоит нескольких сотен килобайт трафика — при условии, что
// сервер отвечает Accept-Ranges, а формат допускает произвольный доступ.
message RemoteOpenRequest {
  string url = 1;
  // Авторизация и прочее, как у скачивания. Подпись с ограниченным сроком
  // (SigV4 и подобные) истекает посреди жизни ресурса — тогда network просит
  // подписать объект заново (ResignRequest), не закрывая его.
  map<string, string> headers = 2;
}

// Подпись объекта истекла посреди чтения (401/403): network просит того, у кого
// ключи, подписать адрес заново (топик network/on_resign). Событие без
// адресата и без пары: подписать умеет только data-provider, а ответ узнаётся
// по адресу.
message ResignRequest {
  string url = 1;
}

// Ответ на просьбу (топик network/on_resigned): заголовки с новой подписью.
// Пусто — подписать нечем (ключей нет либо адрес чужой), и чтение отказывает.
message ResignResponse {
  string url = 1;
  map<string, string> headers = 2;
}

message FsDownloadRequest {
  string url = 1;
  string path = 2;
  map<string, string> headers = 3;
}

message FsDownloadResponse {
  string error = 1;
}

// Событие прогресса скачивания (топик network/fs_download_progress).
message FsDownloadProgress {
  // Доли здесь нет: она выводится из байт, и второе число рядом с ними могло
  // бы только разойтись. Тег 1 занимала именно она — заново не занимать.
  reserved 1;
  uint64 downloaded_bytes = 2;
  uint64 total_bytes = 3;  // 0, если сервер не прислал Content-Length
}

// --- HTTP API ---

message HttpTaskRequest {
  string url = 1;
  string method = 2;
  map<string, string> headers = 3;
  bytes body = 4;
}

message HttpTaskResponse {
  uint32 status = 1;
  bytes body = 2;
}
