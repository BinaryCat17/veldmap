# Контракт платформенного сервиса tasks (сообщения — tasks.proto, рядом).
# buildgen генерирует из этого файла хостовые биндинги (topics/emit) и
# клей нативного модуля platform/host/modules/tasks.
name: tasks
version: 0.1.0
interface:
  inputs:
    on_begin:
      type: tasks/TaskBeginRequest
    on_end:
      type: tasks/TaskEndRequest
    on_cancel:
      type: tasks/TaskCancelRequest
    on_grant:
      type: tasks/TaskGrantRequest
  outputs:
    on_task_started:
      type: tasks/TaskStarted
    on_task_finished:
      type: tasks/TaskFinished
