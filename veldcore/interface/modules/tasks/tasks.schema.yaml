# Контракт платформенного сервиса tasks (сообщения — tasks.proto, рядом).
#
# От сервиса осталось одно: убить операцию. Завести и закрыть её топиков нет —
# учёт ведёт диспетчер по самим публикациям запроса и его терминального ответа
# (`cancellable:`/`terminal:` в схемах исполнителей).
name: tasks
version: 0.1.0
interface:
  inputs:
    on_cancel:
      type: tasks/TaskCancelRequest
  outputs:
    # Только про убийство: операция, кончившаяся сама, сообщает об этом
    # собственным терминальным ответом.
    on_task_finished:
      type: tasks/TaskFinished
