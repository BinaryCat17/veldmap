syntax = "proto3";

package veldmap.tasks;

// --- TASKS API ---
// Всё, что осталось от системы задач как отдельной сущности: убить операцию
// и узнать, что её убили.
//
// Задача — это событие в полёте, а не отдельно заводимая запись. Учёт ведёт
// диспетчер: он открывает его, когда публикуется запрос, объявленный в схеме
// `cancellable: true`, и закрывает, когда проходит терминальный ответ на эту
// корреляцию. Поэтому идентификатор задачи — correlation_id запроса, а её
// владелец — паблишер, которого штампует хост; ни то, ни другое модуль не
// сообщает и подделать не может.

// Убить операцию (топик tasks/on_cancel).
//
// Убийство без церемоний: исполнителя снимают там, где он есть, ничего не
// доделывая и не разматывая. Это моделирует отключение электричества, и
// корректность после него — свойство устройства участников, а не аккуратности
// завершения: ресурсы убитого возвращает хост по lease, а всё, что должно
// пережить обрыв, к этому моменту уже на диске.
//
// Убить может владелец операции — тот, кто её запросил, — или сам хост.
message TaskCancelRequest {
  string task_id = 1;  // correlation_id запроса, который убиваем
}

// Операцию убили (топик tasks/on_task_finished).
//
// Приходит только на убийство: операция, дошедшая до конца сама, сообщает об
// этом своим терминальным ответом, и второго события на то же самое не нужно.
message TaskFinished {
  string task_id = 1;
}
