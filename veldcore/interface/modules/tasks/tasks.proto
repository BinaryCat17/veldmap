syntax = "proto3";

package veldmap.tasks;

// --- TASKS API ---
// Платформенный контракт системы фоновых задач. Идентификатор задачи —
// correlation_id инициатора. Жизненный цикл доставляется событиями
// tasks/task_started и tasks/task_finished; finished гарантируется
// платформой для любой зарегистрированной задачи (успех, ошибка, отмена).
// Права проверяются по lease, как у ресурсов: отменить задачу может
// владелец (инициатор), сервис с grant'ом или сам хост (id 0).

// Отмена фоновой задачи (топик tasks/cancel).
message TaskCancelRequest {
  string task_id = 1;
}

// Регистрация задачи заказчиком (топик tasks/begin).
//
// Нужна, когда исполнитель — wasm-модуль, делающий длинную работу внутри
// одного обработчика: принять tasks/cancel событием он не может (очередь не
// разгребается, пока обработчик не вернул управление), поэтому вместо этого
// он опрашивает живость задачи через veld_task_alive.
//
// Заводит задачу именно заказчик, а не исполнитель: владелец — тот, кто
// вправе отменить, и им становится паблишер этого события, которого штампует
// хост. Попроси мы исполнителя назвать владельца — он называл бы его строкой
// в сообщении, то есть мог бы завести задачу от чужого имени.
message TaskBeginRequest {
  string task_id = 1;   // обычно correlation_id запроса, который исполняется
  string kind = 2;      // тип операции ("image_decode", ...)
  string label = 3;     // человекочитаемое описание (путь, url)
  // Кого заказчик попросил сделать работу. Поле описательное — идёт в
  // task_started для показа и только; правами оно не управляет, поэтому
  // взять его из сообщения безопасно, в отличие от владельца.
  string executor = 4;
}

// Завершение задачи заказчиком (топик tasks/end): исполнитель ответил, и
// работа кончилась — успехом или ошибкой. Закрыть задачу может только её
// владелец, тот же lease, что у отмены.
message TaskEndRequest {
  string task_id = 1;
  string error = 2;    // "" — успех
}

// Делегирование права отмены другому сервису (топик tasks/grant).
// Менять lease может только владелец задачи — как у ресурсов.
message TaskGrantRequest {
  string task_id = 1;
  string service = 2;  // имя сервиса-получателя права
}

// Задача зарегистрирована исполнителем (топик tasks/task_started).
message TaskStarted {
  string task_id = 1;
  string label = 2;     // человекочитаемое описание (путь, url)
  string kind = 3;      // тип операции ("fs_download", "http", ...)
  string executor = 4;  // имя сервиса-исполнителя ("network", ...)
  string owner = 5;     // имя сервиса-инициатора ("" — хост)
}

// Терминальное событие задачи (топик tasks/task_finished).
// error пуст при успехе; cancelled=true при отмене через tasks/cancel.
message TaskFinished {
  string task_id = 1;
  string error = 2;
  bool cancelled = 3;
}
